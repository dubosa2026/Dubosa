 * ------------------------------------------------------------------ */
/* Quem esta comecando precisa de descanso igual ao esforco; quem ja treina
   aguenta 45 e 15. Nao e capricho: com pouco descanso a tecnica cai, e
   exercicio com tecnica ruim e onde as pessoas se machucam. */
const RITMO = {
  1: { trabalho: 30, descanso: 30, entreRodadas: 60, estacoes: 4 },
  2: { trabalho: 40, descanso: 20, entreRodadas: 45, estacoes: 5 },
  3: { trabalho: 45, descanso: 15, entreRodadas: 30, estacoes: 6 },
};

const PREPARAR = 10;      // a contagem antes de cada bloco comecar
const TEMPO_AQUECIMENTO = 40;
const TEMPO_SOLTA = 30;

function limitar(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

/* ------------------------------------------------------------------ *
 * Escolher os exercicios de um bloco                                  *
 * ------------------------------------------------------------------ */

/* O poco de onde as estacoes saem. Se o filtro apertado nao rende gente
   suficiente, ele afrouxa em ordem — primeiro o nivel, depois o foco. O
   que ele NUNCA afrouxa e equipamento e impacto: prescrever um exercicio
   com halter para quem nao tem halter, ou um polichinelo para quem pediu
   silencio, e pior do que repetir exercicio. */
function poco(op, minimo) {
  const base = {
    tipo: 'principal',
    equipamentos: op.equipamentos,
    semImpacto: op.semImpacto,
    nivel: op.nivel,
    foco: op.foco,
  };
  let lista = X.filtrar(base);
  if (lista.length >= minimo) return lista;

  lista = X.filtrar(Object.assign({}, base, { nivel: Math.min(3, (op.nivel || 1) + 1) }));
  if (lista.length >= minimo) return lista;

  lista = X.filtrar(Object.assign({}, base, { nivel: 3, foco: 'corpo-todo' }));
  return lista;
}

/* Sequencia de estacoes sem dois padroes iguais seguidos e, quando da,
   sem dois grupos iguais seguidos.

   O algoritmo e ganancioso de proposito: percorre a lista embaralhada e
   pega o primeiro que serve. Uma busca perfeita gastaria tempo para
   resolver um problema que ninguem tem — com 46 exercicios no catalogo
   sempre sobra candidato. Quando nao sobra (poucos equipamentos, sem
   impacto, nivel 1), ele afrouxa a exigencia em vez de travar. */
function sequenciar(candidatos, quantidade, rnd, evitar) {
  const evitados = evitar || [];
  const baralho = embaralhar(candidatos, rnd);

  // Quem foi treinado nos ultimos dias vai para o fim da fila. Nao some do
  // catalogo — so perde a vez para quem ainda nao apareceu esta semana.
  const novos = baralho.filter((e) => evitados.indexOf(e.id) < 0);
  const repetidos = baralho.filter((e) => evitados.indexOf(e.id) >= 0);
  const fila = novos.concat(repetidos);

  const escolhidos = [];
  const usados = {};

  while (escolhidos.length < quantidade) {
    const anterior = escolhidos[escolhidos.length - 1];
    const livres = fila.filter((e) => !usados[e.id]);
    if (!livres.length) break;

    // O circuito da voltas: a ultima estacao emenda na PRIMEIRA da rodada
    // seguinte. Entao, ao escolher a ultima, ela tem que ser diferente das
    // duas pontas — senao a pessoa faz prancha, descansa 20 segundos e cai
    // noutra prancha, que e exatamente o que esta regra existe para
    // impedir.
    const primeiro = escolhidos[0];
    const ultima = escolhidos.length === quantidade - 1 && primeiro;

    function serve(e, exigirGrupo) {
      if (anterior && e.padrao === anterior.padrao) return false;
      if (ultima && e.padrao === primeiro.padrao) return false;
      if (!exigirGrupo) return true;
      if (anterior && e.grupo === anterior.grupo) return false;
      if (ultima && e.grupo === primeiro.grupo) return false;
      return true;
    }

    let alvo = null;
    if (anterior) {
      alvo = livres.find((e) => serve(e, true)) || livres.find((e) => serve(e, false));
    }
    alvo = alvo || livres[0];

    escolhidos.push(alvo);
    usados[alvo.id] = true;
  }

  // Catalogo pequeno demais para o tamanho do bloco: repete do comeco, que
  // e o que qualquer professor faria com um aluno sem equipamento nenhum.
  let i = 0;
  while (escolhidos.length < quantidade && escolhidos.length) {
    escolhidos.push(escolhidos[i % escolhidos.length]);
    i += 1;
  }
  return escolhidos;
}

/* Nome do bloco a partir do que ele treina: "Bloco 2 · pernas e core".
   Melhor que "Bloco 2" sozinho — a pessoa olha a lista e sabe o que vem. */
const APELIDO = {
  inferior: 'pernas', superior: 'braços e costas', core: 'core', 'corpo-todo': 'corpo todo',
};

function nomearBloco(n, exercicios) {
  const vistos = [];
  exercicios.forEach((e) => { if (vistos.indexOf(e.grupo) < 0) vistos.push(e.grupo); });
  const partes = vistos.slice(0, 2).map((g) => APELIDO[g]);
  return 'Bloco ' + n + (partes.length ? ' · ' + partes.join(' e ') : '');
}

/* ------------------------------------------------------------------ *
 * Encaixar o circuito no tempo que sobrou                              *
 * ------------------------------------------------------------------ */

/* Quanto custa, em segundos, um bloco de `estacoes` estacoes repetido
   `rodadas` vezes. Tem que bater com o que `passos()` gera, senao o app
   promete um tempo e executa outro: dentro da rodada ha descanso entre
   estacoes (uma a menos que o numero de estacoes, porque a ultima emenda
   no intervalo), e entre rodadas ha o descanso maior. */
function custoDoBloco(estacoes, rodadas, ritmo) {
  const rodada = estacoes * ritmo.trabalho + (estacoes - 1) * ritmo.descanso;
  return PREPARAR + rodadas * rodada + (rodadas - 1) * ritmo.entreRodadas;
}

/* A promessa de tempo, resolvida na forca bruta.

   Sao tres numeros para escolher — blocos, estacoes e rodadas — e umas
   duzias de combinacoes possiveis. Em vez de uma formula fechada que erra
   por arredondamento (a primeira versao prometia 20 minutos e montava 25),
   o app testa todas e fica com a que menos afasta do tempo pedido,
   preferindo, no empate, o desenho normal do nivel. */
function melhorPlano(sobra, ritmo, minutos) {
  const maxBlocos = minutos <= 15 ? 1 : (minutos <= 35 ? 2 : 3);
  let melhor = null;
  for (let nb = 1; nb <= maxBlocos; nb += 1) {
    for (let est = 3; est <= 6; est += 1) {
      for (let rod = 2; rod <= 8; rod += 1) {
        const custo = nb * custoDoBloco(est, rod, ritmo);
        // Alem do tempo, o erro pesa o desenho: 3 estacoes repetidas 8
        // vezes cabem no relogio e sao um treino chato e desequilibrado.
        // Circuito bom fica entre 4 e 6 estacoes e entre 3 e 5 rodadas —
        // fora disso, o plano paga pedagio.
        const pedagioRodadas = rod < 3 ? (3 - rod) * 12 : (rod > 5 ? (rod - 5) * 22 : 0);
        const erro = Math.abs(custo - sobra)
          + Math.abs(est - ritmo.estacoes) * 10
          + pedagioRodadas
          + (nb === maxBlocos ? 0 : 25);
        if (!melhor || erro < melhor.erro) melhor = { nb: nb, est: est, rod: rod, custo: custo, erro: erro };
      }
    }
  }
  return melhor;
}

/* ------------------------------------------------------------------ *
 * A montagem                                                          *
 * ------------------------------------------------------------------ */
function montar(opcoes) {
  const op = Object.assign({
    minutos: 20,
    foco: 'corpo-todo',
    equipamentos: [],
    nivel: 2,
    semImpacto: false,
    semente: 'padrao',
    evitar: [],
  }, opcoes || {});

  const rnd = sorteador(semente(op.semente));
  const ritmo = RITMO[op.nivel] || RITMO[2];
  const total = Math.max(5, Number(op.minutos) || 20) * 60;

  // As pontas primeiro: elas nao sao negociaveis. Treino curto encolhe o
  // aquecimento, mas nunca fica sem — entrar frio num circuito e o jeito
  // mais rapido de terminar o mes machucado.
  const nAquecimento = limitar(Math.floor((total * 0.16) / TEMPO_AQUECIMENTO), 3, 6);
  const nSolta = limitar(Math.floor((total * 0.10) / TEMPO_SOLTA), 2, 5);
  const tempoAquecimento = nAquecimento * TEMPO_AQUECIMENTO;
  const tempoSolta = nSolta * TEMPO_SOLTA;

  const aquecimento = sequenciar(X.filtrar({ tipo: 'aquecimento', semImpacto: op.semImpacto }),
    nAquecimento, rnd, []);
  const solta = sequenciar(X.filtrar({ tipo: 'solta' }), nSolta, rnd, []);

  // O que sobra e o circuito.
  const sobra = total - tempoAquecimento - tempoSolta;

  const plano = melhorPlano(sobra, ritmo, op.minutos);
  const nBlocos = plano.nb;
  const estacoes = plano.est;
  const rodadas = plano.rod;

  const disponiveis = poco(op, estacoes);
  const blocos = [];
  const jaUsados = (op.evitar || []).slice();

  for (let b = 0; b < nBlocos; b += 1) {
    const escolhidos = sequenciar(disponiveis, estacoes, rnd, jaUsados);
    escolhidos.forEach((e) => { if (jaUsados.indexOf(e.id) < 0) jaUsados.push(e.id); });
    blocos.push({
      nome: nomearBloco(b + 1, escolhidos),
      rodadas,
      trabalho: ritmo.trabalho,
      descanso: ritmo.descanso,
      entreRodadas: ritmo.entreRodadas,
      exercicios: escolhidos.map((e) => e.id),
    });
  }

  const treino = {
    versao: 1,
    semente: String(op.semente),
    minutos: op.minutos,
    foco: op.foco,
    nivel: op.nivel,
    semImpacto: !!op.semImpacto,
    equipamentos: (op.equipamentos || []).slice(),
    aquecimento: aquecimento.map((e) => e.id),
    tempoAquecimento: TEMPO_AQUECIMENTO,
    blocos,
    solta: solta.map((e) => e.id),
    tempoSolta: TEMPO_SOLTA,
  };
  treino.duracao = duracao(treino);
  return treino;
}

/* ------------------------------------------------------------------ *
 * O treino virado em passos — e o que o cronometro executa             *
 * ------------------------------------------------------------------ */

/* Cada passo e uma tela: um tipo, um tempo e o que aparece escrito. O
   cronometro nao sabe o que e bloco nem rodada; ele so anda nesta lista.
   Separar assim e o que deixa testar o tempo do treino inteiro sem abrir
   navegador. */
function passos(treino) {
  const lista = [];
  const t = treino || {};

  function nome(id) {
    const e = X.porId(id);
    return e ? e.nome : id;
  }

  if ((t.aquecimento || []).length) {
    lista.push({ tipo: 'preparar', segundos: PREPARAR, titulo: 'Aquecimento',
      bloco: 'Aquecimento', exercicio: t.aquecimento[0] });
    t.aquecimento.forEach((id) => {
      const ex = X.porId(id);
      lista.push({ tipo: 'aquecimento', segundos: t.tempoAquecimento || TEMPO_AQUECIMENTO,
        exercicio: id, titulo: nome(id), bloco: 'Aquecimento',
        troca: !!(ex && ex.unilateral) });
    });
  }

  (t.blocos || []).forEach((bloco, ib) => {
    lista.push({ tipo: 'preparar', segundos: PREPARAR, titulo: bloco.nome, bloco: bloco.nome,
      exercicio: bloco.exercicios[0], indiceBloco: ib });
    for (let r = 1; r <= bloco.rodadas; r += 1) {
      bloco.exercicios.forEach((id, ie) => {
        const ex = X.porId(id);
        lista.push({
          tipo: 'trabalho', segundos: bloco.trabalho, exercicio: id, titulo: nome(id),
          bloco: bloco.nome, indiceBloco: ib, rodada: r, rodadas: bloco.rodadas,
          estacao: ie + 1, estacoes: bloco.exercicios.length,
          troca: !!(ex && ex.unilateral),
        });
        const ultimaEstacao = ie === bloco.exercicios.length - 1;
        // O descanso tambem carrega a rodada e o total dela: a tela de
        // execucao escreve "rodada 2/3" no cabecalho o tempo todo, e sem o
        // total ela escrevia "rodada 2/undefined" justamente no descanso,
        // que e quando a pessoa tem tempo de ler o cabecalho.
        if (!ultimaEstacao) {
          lista.push({ tipo: 'descanso', segundos: bloco.descanso, titulo: 'Descanso',
            bloco: bloco.nome, indiceBloco: ib, rodada: r, rodadas: bloco.rodadas });
        } else if (r < bloco.rodadas) {
          lista.push({ tipo: 'intervalo', segundos: bloco.entreRodadas,
            titulo: 'Fim da rodada ' + r, bloco: bloco.nome, indiceBloco: ib,
            rodada: r, rodadas: bloco.rodadas });
        }
      });
    }
  });

  if ((t.solta || []).length) {
    lista.push({ tipo: 'preparar', segundos: PREPARAR, titulo: 'Volta à calma',
      bloco: 'Volta à calma', exercicio: t.solta[0] });
    t.solta.forEach((id) => {
      const ex = X.porId(id);
      lista.push({ tipo: 'solta', segundos: t.tempoSolta || TEMPO_SOLTA, exercicio: id,
        titulo: nome(id), bloco: 'Volta à calma', troca: !!(ex && ex.unilateral) });
    });
  }

  // O que vem depois, para a tela poder mostrar "a seguir: prancha" antes
  // de chegar la. Sem isso a pessoa descansa sem saber para o que se
  // preparar, e a primeira repeticao da estacao seguinte sai torta.
  //
  // Sao duas perguntas diferentes: o proximo PASSO (que pode ser um
  // descanso) e o proximo EXERCICIO. Avisar "a seguir: descanso" no meio
  // de um agachamento nao ajuda ninguem — quem esta trabalhando quer saber
  // qual e a proxima estacao, nao que vai descansar antes dela.
  lista.forEach((p, i) => {
    const prox = lista[i + 1];
    p.proximo = prox ? (prox.exercicio || prox.titulo) : null;
    p.proximoNome = prox ? (prox.exercicio ? nome(prox.exercicio) : prox.titulo) : null;
    p.indice = i;
    let j = i + 1;
    while (j < lista.length && !lista[j].exercicio) j += 1;
    p.proximoExercicio = j < lista.length ? lista[j].exercicio : null;
    p.proximoExercicioNome = p.proximoExercicio ? nome(p.proximoExercicio) : null;
  });
  return lista;
}

function duracao(treino) {
  return passos(treino).reduce((s, p) => s + p.segundos, 0);
}

/* Quantos segundos de esforco de verdade — o que conta para o volume da
   semana. Descanso nao entra: somar descanso no "tempo treinado" e
   inflar o numero que a pessoa usa para se avaliar. */
function tempoDeEsforco(treino) {
  return passos(treino)
    .filter((p) => p.tipo === 'trabalho' || p.tipo === 'aquecimento')
    .reduce((s, p) => s + p.segundos, 0);
}

/* Tudo que o treino pede que nao seja o proprio corpo. A tela de Hoje
   mostra isso antes de comecar: nada pior que descobrir no meio do bloco
   que faltava o halter. */
function equipamentoNecessario(treino) {
  const vistos = [];
  const ids = (treino.aquecimento || [])
    .concat((treino.blocos || []).reduce((a, b) => a.concat(b.exercicios), []))
    .concat(treino.solta || []);
  ids.forEach((id) => {
    const e = X.porId(id);
    if (e) e.equipamento.forEach((q) => { if (vistos.indexOf(q) < 0) vistos.push(q); });
  });
  return vistos;
}

/* Lista dos exercicios diferentes do treino, sem repetir — para o cartao
   de Hoje e para o registro do historico. */
function exerciciosDoTreino(treino) {
  const vistos = [];
  (treino.blocos || []).forEach((b) => b.exercicios.forEach((id) => {
    if (vistos.indexOf(id) < 0) vistos.push(id);
  }));
  return vistos;
}

const Montador = {
  montar, passos, duracao, tempoDeEsforco, equipamentoNecessario, exerciciosDoTreino,
  semente, sorteador, RITMO, PREPARAR,
};

if (typeof module !== 'undefined' && module.exports) module.exports = Montador;
else window.Montador = Montador;

})();

/* ==== relogio.js ==== */
(function(){
/* O cronometro do treino, sem cronometro.
 *
 * Este arquivo nao tem `setInterval`, nao tem som e nao toca na tela. Ele
 * responde uma pergunta so: "passaram X segundos desde que o treino
 * comecou — o que a pessoa esta fazendo agora?".
 *
 * Fazer assim resolve tres problemas de uma vez:
 *
 * - PAUSAR e VOLTAR viram aritmetica. Nao existe estado escondido para
 *   dessincronizar: pausou, para de somar; voltou, soma de novo.
 * - PULAR uma estacao e so mover o relogio para o comeco do passo
 *   seguinte.
 * - O CELULAR QUE DORME nao atrapalha. O navegador congela o timer quando
 *   a tela apaga, e um contador que se decrementa sozinho perderia
 *   segundos — aqui o tempo vem do relogio do sistema, entao ao voltar o
 *   app ja esta no passo certo em vez de estar atrasado dois exercicios.
 */

/* Onde cada passo comeca, em segundos desde o inicio. */
function marcos(passos) {
  const inicio = [];
  let t = 0;
  (passos || []).forEach((p) => { inicio.push(t); t += p.segundos; });
  return { inicio: inicio, total: t };
}

function total(passos) {
  return (passos || []).reduce((s, p) => s + p.segundos, 0);
}

/* O estado do treino no instante `t`. */
function em(passos, t) {
  const lista = passos || [];
  const m = marcos(lista);
  const decorrido = Math.max(0, Number(t) || 0);

  if (!lista.length || decorrido >= m.total) {
    return {
      indice: lista.length, passo: null, proximo: null, terminou: true,
      restante: 0, decorridoNoPasso: 0, restanteTotal: 0,
      total: m.total, progresso: 1, lado: 0,
    };
  }

  let i = 0;
  while (i + 1 < lista.length && m.inicio[i + 1] <= decorrido) i += 1;

  const passo = lista[i];
  const dentro = decorrido - m.inicio[i];
  const restante = passo.segundos - dentro;

  return {
    indice: i,
    passo: passo,
    proximo: lista[i + 1] || null,
    terminou: false,
    decorridoNoPasso: dentro,
    // Arredonda para cima: enquanto sobrar qualquer fracao de segundo, a
    // tela ainda mostra "1". Chegar a zero e o fim do passo, nao o ultimo
    // segundo dele.
    restante: Math.ceil(restante - 0.0001),
    restanteTotal: Math.ceil(m.total - decorrido - 0.0001),
    total: m.total,
    progresso: m.total ? decorrido / m.total : 1,
    // Exercicio de um lado so: a primeira metade e um lado, a segunda e o
    // outro. 0 quando nao ha troca.
    lado: passo.troca ? (dentro < passo.segundos / 2 ? 1 : 2) : 0,
  };
}

/* Quando comeca o passo `i` — para pular para frente ou voltar. */
function inicioDoPasso(passos, i) {
  const m = marcos(passos);
  if (i <= 0) return 0;
  if (i >= m.inicio.length) return m.total;
  return m.inicio[i];
}

/* Pular o passo atual: devolve o instante em que o proximo comeca. */
function pular(passos, t) {
  const e = em(passos, t);
  if (e.terminou) return total(passos);
  return inicioDoPasso(passos, e.indice + 1);
}

/* Voltar. Nos primeiros 2 segundos de um passo, volta para o anterior —
   se ja passou disso, volta para o comeco do proprio passo. E o mesmo
   comportamento de "faixa anterior" de qualquer tocador de musica, e
   existe pela mesma razao: quase sempre quem aperta quer repetir o que
   acabou de comecar errado. */
function voltar(passos, t) {
  const e = em(passos, t);
  if (e.terminou) return inicioDoPasso(passos, (passos || []).length - 1);
  if (e.decorridoNoPasso > 2) return inicioDoPasso(passos, e.indice);
  return inicioDoPasso(passos, Math.max(0, e.indice - 1));
}

/* Os avisos sonoros que aconteceram entre dois instantes.
 *
 * A tela chama isto a cada quadro passando o instante anterior e o atual, e
 * toca o que voltar. Calcular por intervalo (e nao por "o segundo atual e
 * 3") e o que impede o apito de sumir quando o app perde um quadro — e
 * impede o apito duplicado quando ganha dois quadros no mesmo segundo.
 */
function avisos(passos, de, ate) {
  const eventos = [];
  if (ate <= de) return eventos;
  const m = marcos(passos);
  const lista = passos || [];

  lista.forEach((p, i) => {
    const inicio = m.inicio[i];
    const fim = inicio + p.segundos;
    const cruzou = (x) => x > de && x <= ate;

    // Contagem regressiva nos 3 ultimos segundos de qualquer passo com mais
    // de 5 segundos. Em passo curto ela viraria um chiado continuo.
    if (p.segundos > 5) {
      [3, 2, 1].forEach((n) => { if (cruzou(fim - n)) eventos.push({ tipo: 'conta', passo: i, falta: n }); });
    }
    if (p.troca && cruzou(inicio + p.segundos / 2)) eventos.push({ tipo: 'troca', passo: i });
    if (cruzou(fim)) {
      const proximo = lista[i + 1];
      eventos.push({ tipo: proximo ? (proximo.tipo === 'trabalho' || proximo.tipo === 'aquecimento'
        || proximo.tipo === 'solta' ? 'comeca' : 'para') : 'fim', passo: i });
    }
  });

  return eventos;
}

/* Quanto do treino ja foi, contado em esforco e nao em relogio: a pessoa
   quer saber quantas estacoes faltam, nao quantos segundos de descanso. */
function progressoDeEsforco(passos, t) {
  const lista = (passos || []).filter((p) => p.tipo === 'trabalho');
  if (!lista.length) return { feitas: 0, totais: 0 };
  const e = em(passos, t);
  const ate = e.terminou ? (passos || []).length : e.indice;
  const feitas = (passos || []).slice(0, ate).filter((p) => p.tipo === 'trabalho').length;
  return { feitas: feitas, totais: lista.length };
}

const Relogio = { marcos, total, em, inicioDoPasso, pular, voltar, avisos, progressoDeEsforco };

if (typeof module !== 'undefined' && module.exports) module.exports = Relogio;
else window.Relogio = Relogio;

})();

/* ==== progresso.js ==== */
(function(){
/* O que ficou dos treinos: ajustes, historico, sequencia e volume.
 *
 * Tudo isso mora no aparelho, no `localStorage`. Nao existe cadastro, nao
 * existe servidor e nada sai daqui — o que tambem quer dizer que trocar de
 * celular leva junto o historico so se a pessoa exportar. A tela de
 * Ajustes diz isso com todas as letras e tem o botao de exportar.
 *
 * Este arquivo e JavaScript puro: nao toca no DOM e nao le `localStorage`
 * sozinho (quem faz isso e a interface). Assim da para conferir a
 * sequencia e o volume no node, sem navegador.
 */

/* eslint-disable no-undef */
const F = (typeof require !== 'undefined' && typeof module !== 'undefined')
  ? require('./formato.js') : window.Formato;

/* Onde a pessoa vai treinar muda tudo: o que existe para usar e o que da
   para fazer sem incomodar. Por isso cada lugar guarda o SEU equipamento e
   a SUA regra de barulho — quem tem halter em casa nao tem halter no
   parque, e quem mora em apartamento nao pula as 6h da manha, mas pula na
   academia no mesmo dia. Um interruptor so, global, obrigava a pessoa a
   reconfigurar o app toda vez que trocasse de lugar. */
const LOCAIS_PADRAO = {
  apartamento: { equipamentos: [], semImpacto: true },
  casa: { equipamentos: [], semImpacto: false },
  academia: {
    equipamentos: ['halter', 'kettlebell', 'elastico', 'caixa', 'corda', 'barra', 'bola'],
    semImpacto: false,
  },
  'ar-livre': { equipamentos: ['elastico', 'corda'], semImpacto: false },
};

const AJUSTES_PADRAO = {
  minutos: 20,
  foco: 'corpo-todo',
  nivel: 2,
  local: 'apartamento',
  altura: 0,
  som: true,
  vibrar: true,
  telaAcesa: true,
  metaSemanal: 3,
};

function locaisNovos() {
  const l = {};
  Object.keys(LOCAIS_PADRAO).forEach((nome) => {
    l[nome] = { equipamentos: LOCAIS_PADRAO[nome].equipamentos.slice(),
      semImpacto: LOCAIS_PADRAO[nome].semImpacto };
  });
  return l;
}

function estadoNovo() {
  return {
    versao: 2,
    ajustes: Object.assign({}, AJUSTES_PADRAO, { locais: locaisNovos() }),
    historico: [],
    medidas: [],
    doDia: null,
  };
}

/* O lugar escolhido agora, ja com o equipamento e a regra de barulho dele. */
function localAtual(ajustes) {
  const a = ajustes || {};
  const nome = LOCAIS_PADRAO[a.local] ? a.local : 'apartamento';
  const guardado = (a.locais || {})[nome] || {};
  return {
    nome: nome,
    equipamentos: Array.isArray(guardado.equipamentos)
      ? guardado.equipamentos.slice() : LOCAIS_PADRAO[nome].equipamentos.slice(),
    semImpacto: guardado.semImpacto === undefined
      ? LOCAIS_PADRAO[nome].semImpacto : !!guardado.semImpacto,
  };
}

/* Le o que estava salvo sem confiar em nada: versao antiga, campo que
   sumiu, numero que virou texto. Um app que quebra ao abrir porque o
   formato mudou perde o historico inteiro da pessoa — e ela nao tem como
   recuperar. */
function normalizar(bruto) {
  const novo = estadoNovo();
  if (!bruto || typeof bruto !== 'object') return novo;

  const a = bruto.ajustes || {};
  Object.keys(AJUSTES_PADRAO).forEach((k) => {
    const padrao = AJUSTES_PADRAO[k];
    let v = a[k];
    if (v === undefined || v === null) v = padrao;
    if (typeof padrao === 'boolean') v = !!v;
    else if (typeof padrao === 'number') v = Number(v) || padrao;
    else if (Array.isArray(padrao)) v = Array.isArray(v) ? v.slice() : padrao.slice();
    novo.ajustes[k] = v;
  });
  if (!LOCAIS_PADRAO[novo.ajustes.local]) novo.ajustes.local = 'apartamento';

  // Versao 1 guardava equipamento e impacto soltos, valendo em qualquer
  // lugar. Quem ja usava o app tinha o halter marcado ali: esse halter vai
  // para casa e para o apartamento, que e onde ele de fato esta. A academia
  // fica com o padrao dela, que ja tem tudo.
  novo.ajustes.locais = locaisNovos();
  const antigosEquip = Array.isArray(a.equipamentos) ? a.equipamentos.slice() : null;
  Object.keys(novo.ajustes.locais).forEach((nome) => {
    const guardado = (a.locais || {})[nome];
    if (guardado) {
      if (Array.isArray(guardado.equipamentos)) {
        novo.ajustes.locais[nome].equipamentos = guardado.equipamentos.map(String);
      }
      if (guardado.semImpacto !== undefined) {
        novo.ajustes.locais[nome].semImpacto = !!guardado.semImpacto;
      }
    } else if (antigosEquip && (nome === 'casa' || nome === 'apartamento')) {
      novo.ajustes.locais[nome].equipamentos = antigosEquip.slice();
      if (a.semImpacto !== undefined && nome === 'apartamento') {
        novo.ajustes.locais[nome].semImpacto = !!a.semImpacto;
      }
    }
  });

  novo.ajustes.nivel = Math.min(3, Math.max(1, Math.round(novo.ajustes.nivel)));
  novo.ajustes.minutos = Math.min(90, Math.max(5, Math.round(novo.ajustes.minutos)));
  novo.ajustes.metaSemanal = Math.min(7, Math.max(1, Math.round(novo.ajustes.metaSemanal)));
  // Altura em centimetros. Zero quer dizer "nao disse ainda", e e por isso
  // que o IMC some da tela em vez de aparecer errado.
  const alt = Math.round(novo.ajustes.altura);
  novo.ajustes.altura = (alt >= 100 && alt <= 250) ? alt : 0;

  novo.historico = (Array.isArray(bruto.historico) ? bruto.historico : [])
    .filter((s) => s && s.data)
    .map((s) => ({
      id: String(s.id || (s.data + '-' + Math.random().toString(36).slice(2, 7))),
      data: String(s.data),
      quando: Number(s.quando) || 0,
      minutos: Number(s.minutos) || 0,
      esforco: Number(s.esforco) || 0,
      foco: String(s.foco || 'corpo-todo'),
      nivel: Number(s.nivel) || 2,
      local: String(s.local || 'apartamento'),
      completo: s.completo !== false,
      exercicios: Array.isArray(s.exercicios) ? s.exercicios.map(String) : [],
    }))
    .sort((x, y) => (x.data < y.data ? 1 : (x.data > y.data ? -1 : y.quando - x.quando)));

  // As medidas do corpo sao normalizadas pelo modulo delas, que conhece as
  // faixas de cada campo. Aqui so garantimos que a lista existe.
  novo.medidas = Array.isArray(bruto.medidas) ? bruto.medidas : [];
  novo.doDia = bruto.doDia && bruto.doDia.data ? bruto.doDia : null;
  return novo;
}

/* ------------------------------------------------------------------ *
 * Registrar o que foi feito                                           *
 * ------------------------------------------------------------------ */

/* Guarda a sessao. `completo` false para quem parou no meio: o treino pela
   metade continua contando para a sequencia — quem levantou, aqueceu e fez
   dois blocos treinou. Nao contar seria o app punindo justamente o dia
   dificil, que e o dia que mais precisa de credito. */
function registrar(estado, sessao) {
  const s = sessao || {};
  const nova = {
    id: String(s.id || (s.data + '-' + Date.now().toString(36))),
    data: String(s.data || F.hoje()),
    quando: Number(s.quando) || Date.now(),
    minutos: Math.max(0, Math.round(Number(s.minutos) || 0)),
    esforco: Math.max(0, Math.round(Number(s.esforco) || 0)),
    foco: String(s.foco || 'corpo-todo'),
    nivel: Number(s.nivel) || 2,
    local: String(s.local || 'apartamento'),
    completo: s.completo !== false,
    exercicios: Array.isArray(s.exercicios) ? s.exercicios.slice() : [],
  };
  const copia = Object.assign({}, estado);
  copia.historico = [nova].concat(estado.historico || []);
  return copia;
}

function apagarSessao(estado, id) {
  const copia = Object.assign({}, estado);
  copia.historico = (estado.historico || []).filter((s) => s.id !== id);
  return copia;
}

/* ------------------------------------------------------------------ *
 * As contas                                                           *
 * ------------------------------------------------------------------ */

function diasTreinados(historico) {
  const dias = {};
  (historico || []).forEach((s) => { dias[s.data] = true; });
  return dias;
}

/* Dias seguidos de treino.
 *
 * A regra que importa: o dia de HOJE ainda nao acabou. Quem treinou ontem
 * e ainda nao treinou hoje esta com a sequencia viva, nao quebrada — ela so
 * quebra quando o dia passa em branco. Contar diferente faria o app dar a
 * noticia ruim as 00h01, antes de a pessoa ter tido qualquer chance.
 */
function sequencia(historico, refIso) {
  const dias = diasTreinados(historico);
  const hoje = refIso || F.hoje();
  let inicio = hoje;
  if (!dias[hoje]) {
    const ontem = F.somarDias(hoje, -1);
    if (!dias[ontem]) return 0;
    inicio = ontem;
  }
  let n = 0;
  let dia = inicio;
  while (dias[dia]) {
    n += 1;
    dia = F.somarDias(dia, -1);
  }
  return n;
}

/* A maior sequencia que a pessoa ja teve — o recorde a bater. */
function maiorSequencia(historico) {
  const dias = Object.keys(diasTreinados(historico)).sort();
  let melhor = 0, atual = 0, anterior = null;
  dias.forEach((d) => {
    atual = (anterior && F.diasEntre(anterior, d) === 1) ? atual + 1 : 1;
    anterior = d;
    if (atual > melhor) melhor = atual;
  });
  return melhor;
}

function noPeriodo(historico, deIso, ateIso) {
  return (historico || []).filter((s) => s.data >= deIso && s.data <= ateIso);
}

/* O retrato que a tela de Historico desenha. */
function resumo(historico, refIso) {
  const hoje = refIso || F.hoje();
  const semana = noPeriodo(historico, F.inicioDaSemana(hoje), hoje);
  const mes = noPeriodo(historico, hoje.slice(0, 8) + '01', hoje);
  const soma = (l, campo) => l.reduce((s, x) => s + (Number(x[campo]) || 0), 0);

  return {
    sequencia: sequencia(historico, hoje),
    recorde: maiorSequencia(historico),
    semana: { treinos: semana.length, minutos: soma(semana, 'minutos'), esforco: soma(semana, 'esforco') },
    mes: { treinos: mes.length, minutos: soma(mes, 'minutos') },
    total: { treinos: (historico || []).length, minutos: soma(historico || [], 'minutos') },
    // O mais recente por data, e nao o primeiro da lista: quem registra
    // um treino esquecido de ontem nao pode fazer o app achar que o ultimo
    // treino foi ontem.
    ultimo: (historico || []).reduce((a, s) => (!a || s.data > a.data ? s : a), null),
  };
}

/* Os ultimos `n` dias, do mais antigo para o mais novo — o grafico de
   barrinhas da tela de Historico. */
function ultimosDias(historico, n, refIso) {
  const hoje = refIso || F.hoje();
  const porDia = {};
  (historico || []).forEach((s) => {
    porDia[s.data] = (porDia[s.data] || 0) + (Number(s.minutos) || 0);
  });
  const dias = [];
  for (let i = n - 1; i >= 0; i -= 1) {
    const d = F.somarDias(hoje, -i);
    dias.push({ data: d, minutos: porDia[d] || 0, treinou: !!porDia[d] });
  }
  return dias;
}

/* Os exercicios dos ultimos treinos, para o montador dar a vez a quem nao
   apareceu. Variedade nao e enfeite: musculo que nunca e estimulado de
   outro angulo para de evoluir, e treino repetido e treino abandonado. */
function recentes(historico, quantosTreinos) {
  const ids = [];
  (historico || []).slice(0, quantosTreinos || 3).forEach((s) => {
    (s.exercicios || []).forEach((id) => { if (ids.indexOf(id) < 0) ids.push(id); });
  });
  return ids;
}

function maisTreinados(historico, quantos) {
  const conta = {};
  (historico || []).forEach((s) => (s.exercicios || []).forEach((id) => {
    conta[id] = (conta[id] || 0) + 1;
  }));
  return Object.keys(conta)
    .map((id) => ({ id: id, vezes: conta[id] }))
    .sort((a, b) => b.vezes - a.vezes || (a.id < b.id ? -1 : 1))
    .slice(0, quantos || 5);
}

/* ------------------------------------------------------------------ *
 * Carga, tendencia e projecao                                         *
 * ------------------------------------------------------------------ */

/* O app nao mede batimento nem oxigenio: nao tem sensor e nao vai fingir
 * que tem. O que ele mede com honestidade e VOLUME — quanto tempo de
 * esforco, em que intensidade. E o suficiente para responder as duas
 * perguntas que fazem alguem largar ou se machucar:
 *
 *   "estou treinando menos do que treinava?"
 *   "estou aumentando rapido demais?"
 *
 * A carga de uma sessao e o tempo de esforco vezes o peso do nivel. Nao e
 * fisiologia, e aritmetica declarada: 40 minutos no nivel 3 pesam mais que
 * 40 minutos no nivel 1, e e so isso que a conta diz.
 */
const PESO_DO_NIVEL = { 1: 1, 2: 1.3, 3: 1.6 };

function carga(sessao) {
  if (!sessao) return 0;
  const esforco = Number(sessao.esforco) || Number(sessao.minutos) || 0;
  return esforco * (PESO_DO_NIVEL[sessao.nivel] || 1.3);
}

/* As ultimas `semanas` semanas, da mais antiga para a mais nova. */
function cargaPorSemana(historico, semanas, refIso) {
  const hoje = refIso || F.hoje();
  const quantas = semanas || 8;
  const linhas = [];
  for (let i = quantas - 1; i >= 0; i -= 1) {
    const inicio = F.somarDias(F.inicioDaSemana(hoje), -7 * i);
    const fim = F.somarDias(inicio, 6);
    const dentro = (historico || []).filter((s) => s.data >= inicio && s.data <= fim);
    linhas.push({
      inicio: inicio,
      fim: fim,
      treinos: dentro.length,
      minutos: dentro.reduce((t, s) => t + (Number(s.minutos) || 0), 0),
      carga: Math.round(dentro.reduce((t, s) => t + carga(s), 0)),
      atual: i === 0,
    });
  }
  return linhas;
}

/* Carga dos ultimos 7 dias contra a media semanal dos ultimos 28.
 *
 * E a razao aguda/cronica, que treinadores usam para achar o ponto entre
 * treinar de menos e aumentar rapido demais. A leitura util nao e o numero,
 * e a faixa: perto de 1 quer dizer "esta semana parece as ultimas", e e ali
 * que se progride sem susto. Precisa de umas tres semanas de historico
 * para dizer qualquer coisa — antes disso o app diz que ainda nao sabe, em
 * vez de inventar um diagnostico.
 */
function tendencia(historico, refIso) {
  const hoje = refIso || F.hoje();
  const l = historico || [];
  const desde = (dias) => l.filter((s) => F.diasEntre(s.data, hoje) < dias
    && F.diasEntre(s.data, hoje) >= 0);

  const aguda = desde(7).reduce((t, s) => t + carga(s), 0);
  const cronicaTotal = desde(28).reduce((t, s) => t + carga(s), 0);
  const cronica = cronicaTotal / 4;

  const maisAntigo = l.reduce((a, s) => (!a || s.data < a ? s.data : a), null);
  const diasDeHistorico = maisAntigo ? F.diasEntre(maisAntigo, hoje) + 1 : 0;
  if (diasDeHistorico < 21 || cronica <= 0) {
    return { aguda: Math.round(aguda), cronica: Math.round(cronica), razao: null,
      faixa: 'cedo', diasDeHistorico: diasDeHistorico,
      recado: 'Ainda é cedo para falar de tendência. Faltam '
        + F.plural(Math.max(0, 21 - diasDeHistorico), 'dia', 'dias') + ' de histórico.' };
  }

  const razao = aguda / cronica;
  let faixa = 'boa';
  let recado = 'Esta semana está no mesmo ritmo das últimas. É assim que se evolui sem susto.';
  if (razao < 0.6) {
    faixa = 'caiu';
    recado = 'Você treinou bem menos que o seu normal. Um treino curto já recoloca no ritmo.';
  } else if (razao < 0.85) {
    faixa = 'caindo';
    recado = 'Semana mais leve que as anteriores. Se foi de propósito, ótimo — descanso também treina.';
  } else if (razao > 1.5) {
    faixa = 'rapido';
    recado = 'Subiu bem mais rápido que o seu normal. É o padrão que costuma anteceder lesão: '
      + 'segure o ritmo na próxima semana.';
  } else if (razao > 1.25) {
    faixa = 'subindo';
    recado = 'Está subindo mais que o normal. Dá para manter, mas sem acelerar de novo.';
  }
  return { aguda: Math.round(aguda), cronica: Math.round(cronica), razao: razao,
    faixa: faixa, diasDeHistorico: diasDeHistorico, recado: recado };
}

/* No ritmo de agora, como o mes termina.
 *
 * Regra de tres com o que ja passou do mes, e nada mais: nao ha modelo
 * escondido. Nos primeiros dias do mes a projecao balanca muito, entao ela
 * so aparece a partir do dia 5. */
function projecaoDoMes(historico, refIso) {
  const hoje = refIso || F.hoje();
  const dia = Number(hoje.slice(8, 10));
  const primeiro = hoje.slice(0, 8) + '01';
  const noMes = (historico || []).filter((s) => s.data >= primeiro && s.data <= hoje);
  const diasNoMes = new Date(Number(hoje.slice(0, 4)), Number(hoje.slice(5, 7)), 0).getDate();

  const feitos = noMes.length;
  const minutos = noMes.reduce((t, s) => t + (Number(s.minutos) || 0), 0);
  if (dia < 5) {
    return { cedo: true, dia: dia, diasNoMes: diasNoMes, treinos: feitos, minutos: minutos };
  }
  return {
    cedo: false,
    dia: dia,
    diasNoMes: diasNoMes,
    treinos: feitos,
    minutos: minutos,
    treinosProjetados: Math.round((feitos / dia) * diasNoMes),
    minutosProjetados: Math.round((minutos / dia) * diasNoMes),
  };
}

/* A frase do topo da tela de Hoje. Curta, verdadeira e sem empolgacao
   falsa: "voce arrasou!" para quem nao treina ha duas semanas soa como
   deboche. */
function recado(historico, ajustes, refIso) {
  const r = resumo(historico, refIso);
  const meta = (ajustes && ajustes.metaSemanal) || 3;
  const hoje = refIso || F.hoje();
  const treinouHoje = (historico || []).some((s) => s.data === hoje);

  if (treinouHoje) {
    const faltam = meta - r.semana.treinos;
    return r.semana.treinos >= meta
      ? 'Meta da semana batida: ' + F.plural(r.semana.treinos, 'treino', 'treinos') + '.'
      : 'Treino de hoje feito. ' + (faltam === 1 ? 'Falta ' : 'Faltam ')
        + F.plural(faltam, 'treino', 'treinos') + ' para a meta.';
  }
  if (!(historico || []).length) return 'Primeiro treino. Comece pelo nível 1 e ajuste depois.';
  if (r.sequencia >= 2) return F.plural(r.sequencia, 'dia seguido', 'dias seguidos') + '. Hoje mantém.';
  const dias = F.diasEntre(r.ultimo.data, hoje);
  if (dias >= 10) return 'Faz ' + F.plural(dias, 'dia', 'dias') + '. Um treino curto hoje já reabre a conta.';
  if (dias >= 3) return 'Último treino ' + F.dataAmigavel(r.ultimo.data, hoje) + '. Dá para voltar hoje.';
  return r.semana.treinos >= meta
    ? 'Meta da semana já batida. O de hoje é lucro.'
    : F.plural(r.semana.treinos, 'treino', 'treinos') + ' nesta semana, meta ' + meta + '.';
}

const Progresso = {
  AJUSTES_PADRAO, LOCAIS_PADRAO, estadoNovo, normalizar, registrar, apagarSessao, localAtual,
  sequencia, maiorSequencia, resumo, ultimosDias, recentes, maisTreinados, recado,
  carga, cargaPorSemana, tendencia, projecaoDoMes, PESO_DO_NIVEL,
};

if (typeof module !== 'undefined' && module.exports) module.exports = Progresso;
else window.Progresso = Progresso;

})();

/* ==== corpo.js ==== */
(function(){
/* Medidas do corpo: peso, cintura, quadril, IMC e a evolucao de cada um.
 *
 * Duas decisoes que valem explicar.
 *
 * A ALTURA MORA NOS AJUSTES, nao na medida. Ela nao muda de mes para mes, e
 * pedir a altura toda vez que a pessoa sobe na balanca e o jeito mais
 * rapido de ela parar de anotar o peso.
 *
 * O IMC APARECE COM RESSALVA, sempre. Ele divide peso por altura ao
 * quadrado e nao sabe o que e musculo: quem comeca a treinar frequentemente
 * ganha peso e "piora" no IMC enquanto melhora de verdade. Um app de treino
 * que mostra IMC sem dizer isso empurra a pessoa para a conclusao errada
 * bem no mes em que ela mais precisa continuar. Por isso a cintura fica ao
 * lado dele na tela: ela responde melhor a pergunta que a pessoa esta
 * fazendo.
 */

/* eslint-disable no-undef */
const F = (typeof require !== 'undefined' && typeof module !== 'undefined')
  ? require('./formato.js') : window.Formato;

const CAMPOS = [
  { id: 'peso', nome: 'Peso', unidade: 'kg', min: 25, max: 350, casas: 1 },
  { id: 'cintura', nome: 'Cintura', unidade: 'cm', min: 40, max: 200, casas: 0 },
  { id: 'quadril', nome: 'Quadril', unidade: 'cm', min: 40, max: 200, casas: 0 },
];

/* As faixas da Organizacao Mundial da Saude. Valem para adulto, e so. */
const FAIXAS = [
  { ate: 18.5, nome: 'abaixo do peso', tom: 'atencao' },
  { ate: 25, nome: 'peso normal', tom: 'bom' },
  { ate: 30, nome: 'sobrepeso', tom: 'atencao' },
  { ate: 35, nome: 'obesidade grau 1', tom: 'alerta' },
  { ate: 40, nome: 'obesidade grau 2', tom: 'alerta' },
  { ate: Infinity, nome: 'obesidade grau 3', tom: 'alerta' },
];

function limpar(valor, campo) {
  const n = Number(String(valor).replace(',', '.'));
  if (!isFinite(n) || n <= 0) return null;
  if (campo && (n < campo.min || n > campo.max)) return null;
  return n;
}

function campoPorId(id) {
  return CAMPOS.filter((c) => c.id === id)[0] || null;
}

/* Uma anotacao do corpo. Campo em branco fica em branco: quem so quer
   pesar nao precisa medir a cintura, e obrigar isso faria a pessoa
   inventar um numero — que e pior que nao ter numero nenhum. */
function anotar(estado, bruta) {
  const b = bruta || {};
  const nova = { id: String(b.id || (b.data || F.hoje()) + '-' + Date.now().toString(36)),
    data: String(b.data || F.hoje()) };
  let temAlgo = false;
  CAMPOS.forEach((c) => {
    const v = limpar(b[c.id], c);
    if (v !== null) { nova[c.id] = v; temAlgo = true; }
  });
  if (!temAlgo) return null;

  const copia = Object.assign({}, estado);
  // Uma anotacao por dia: pesar de novo no mesmo dia corrige a anterior em
  // vez de virar duas linhas iguais no historico.
  //
  // E corrigir e MESCLAR, nao substituir. Quem mediu a cintura de manha e
  // volta a tarde so para acertar o peso nao pode perder a cintura: os
  // campos que ela deixou em branco agora sao os que ela nao quis mexer,
  // nao os que ela quis apagar.
  const doDia = (estado.medidas || []).filter((m) => m.data === nova.data)[0];
  const resto = (estado.medidas || []).filter((m) => m.data !== nova.data);
  const linha = doDia ? Object.assign({}, doDia, nova, { id: doDia.id }) : nova;
  copia.medidas = [linha].concat(resto).sort((x, y) => (x.data < y.data ? 1 : -1));
  return copia;
}

function apagar(estado, id) {
  const copia = Object.assign({}, estado);
  copia.medidas = (estado.medidas || []).filter((m) => m.id !== id);
  return copia;
}

function normalizarMedidas(bruto) {
  return (Array.isArray(bruto) ? bruto : [])
    .filter((m) => m && m.data)
    .map((m) => {
      const nova = { id: String(m.id || m.data), data: String(m.data) };
      CAMPOS.forEach((c) => {
        const v = limpar(m[c.id], c);
        if (v !== null) nova[c.id] = v;
      });
      return nova;
    })
    .filter((m) => CAMPOS.some((c) => m[c.id] !== undefined))
    .sort((x, y) => (x.data < y.data ? 1 : (x.data > y.data ? -1 : 0)));
}

/* ------------------------------------------------------------------ *
 * As contas                                                           *
 * ------------------------------------------------------------------ */
function imc(peso, alturaCm) {
  const p = Number(peso), a = Number(alturaCm) / 100;
  if (!p || !a) return null;
  return p / (a * a);
}

function faixaDoImc(valor) {
  if (valor === null || valor === undefined) return null;
  return FAIXAS.filter((f) => valor < f.ate)[0] || FAIXAS[FAIXAS.length - 1];
}

/* Peso que deixaria o IMC em 24,9 — o topo da faixa normal. Serve de
   referencia, nao de meta: quem treina pode ficar acima disso com saude. */
function pesoDeReferencia(alturaCm) {
  const a = Number(alturaCm) / 100;
  if (!a) return null;
  return { de: 18.5 * a * a, ate: 24.9 * a * a };
}

/* Cintura dividida por quadril. Numero solto, sem faixa de risco: as
   faixas mudam com sexo e etnia, e o app nao pergunta isso. O que interessa
   aqui e a direcao ao longo do tempo. */
function rcq(medida) {
  if (!medida || !medida.cintura || !medida.quadril) return null;
  return medida.cintura / medida.quadril;
}

function ultima(medidas, campo) {
  const l = medidas || [];
  for (let i = 0; i < l.length; i += 1) {
    if (l[i][campo] !== undefined) return l[i];
  }
  return null;
}

/* A serie de um campo, do mais antigo para o mais novo — o grafico. */
function serie(medidas, campo) {
  return (medidas || [])
    .filter((m) => m[campo] !== undefined)
    .map((m) => ({ data: m.data, valor: m[campo] }))
    .sort((a, b) => (a.data < b.data ? -1 : 1));
}

/* Quanto mudou, e em quanto tempo — olhando o ultimo mes.
 *
 * A janela e fixa de proposito. A primeira versao comparava com o ponto
 * mais recente que estivesse a pelo menos uma semana de distancia, e o
 * resultado dependia de quando a pessoa tinha subido na balanca: quem
 * pesou no dia 15 via "-0,9 kg", quem nao pesou via "-2,2 kg", com o mesmo
 * peso hoje e o mesmo peso no comeco. Janela fixa responde sempre a mesma
 * pergunta — "e no ultimo mes?" —, e o numero de dias aparece do lado
 * porque a primeira anotacao pode ser mais nova que a janela.
 *
 * Comparar com a anotacao de ontem seria pior ainda: mediria quanta agua a
 * pessoa bebeu, nao o treino. */
function variacao(medidas, campo, janela) {
  const s = serie(medidas, campo);
  if (s.length < 2) return null;
  const fim = s[s.length - 1];
  const dentroDe = janela === undefined ? 30 : janela;

  // O mais antigo que ainda cabe na janela; se nenhum couber (todas as
  // anotacoes sao velhas), usa o mais antigo que existir.
  let inicio = null;
  for (let i = 0; i < s.length - 1; i += 1) {
    if (F.diasEntre(s[i].data, fim.data) <= dentroDe) { inicio = s[i]; break; }
  }
  if (!inicio) inicio = s[s.length - 2];

  const dias = F.diasEntre(inicio.data, fim.data);
  if (dias <= 0) return null;
  return {
    de: inicio.valor, para: fim.valor, dias: dias,
    diferenca: fim.valor - inicio.valor,
    porSemana: ((fim.valor - inicio.valor) / dias) * 7,
  };
}

/* O retrato que a tela desenha. */
function retrato(medidas, alturaCm) {
  const l = medidas || [];
  const pesoAgora = ultima(l, 'peso');
  const valorImc = pesoAgora ? imc(pesoAgora.peso, alturaCm) : null;
  return {
    peso: pesoAgora,
    cintura: ultima(l, 'cintura'),
    quadril: ultima(l, 'quadril'),
    imc: valorImc,
    faixa: faixaDoImc(valorImc),
    referencia: pesoDeReferencia(alturaCm),
    rcq: rcq(l[0]),
    variacaoPeso: variacao(l, 'peso'),
    variacaoCintura: variacao(l, 'cintura'),
    anotacoes: l.length,
  };
}

      + (a.minutos === m) + '">' + m + '</button>').join('')
    + '</div>'
    + '<label>Foco</label><div class="opcoes">'
    + FOCOS.map(([id, nome]) => '<button type="button" data-foco="' + id + '" aria-pressed="'
      + (a.foco === id) + '">' + esc(nome) + '</button>').join('')
    + '</div></div>';

  h += '<div class="cartao">'
    + '<div class="bloco-cab"><b>O que você vai precisar</b>'
    + '<small>' + esc(nomeLocal(a.local)) + '</small></div>'
    + '<p class="ajuda" style="margin-top:4px">'
    + (precisa.length ? esc(F.maiuscula(F.listar(precisa.map(nomeEquip))))
      + '. O resto é peso do corpo.' : 'Nada além do seu corpo e um espaço de dois passos.')
    + '</p></div>';

  t.blocos.forEach((b) => {
    h += '<div class="cartao"><div class="bloco-cab"><b>' + esc(b.nome) + '</b>'
      + '<small>' + b.rodadas + 'x · ' + b.trabalho + 's / ' + b.descanso + 's</small></div>'
      + b.exercicios.map((id, i) => linhaEstacao(id, i + 1)).join('')
      + '</div>';
  });

  h += '<div class="cartao"><div class="bloco-cab"><b>Aquecimento e volta à calma</b>'
    + '<small>' + F.duracao((t.aquecimento.length * t.tempoAquecimento)
      + (t.solta.length * t.tempoSolta)) + '</small></div>'
    + t.aquecimento.concat(t.solta).map((id, i) => linhaEstacao(id, i + 1)).join('')
    + '</div>';

  h += '<div class="btn-linha" style="margin-top:6px">'
    + '<button class="btn pri bloco" data-acao="comecar">Começar o treino</button>'
    + '<button class="btn bloco" data-acao="sortear">Sortear outro circuito</button>'
    + '</div>';

  h += '<div class="rodape">Sequência de ' + esc(F.plural(r.sequencia, 'dia', 'dias'))
    + ' · recorde de ' + esc(F.plural(r.recorde, 'dia', 'dias')) + '</div>';

  const pane = $('pane-hoje');
  pane.innerHTML = h;
  pane.querySelectorAll('[data-tempo]').forEach((b) => {
    b.onclick = () => { estado.ajustes.minutos = Number(b.dataset.tempo); salvar(); desenhar(); };
  });
  pane.querySelectorAll('[data-foco]').forEach((b) => {
    b.onclick = () => { estado.ajustes.foco = b.dataset.foco; salvar(); desenhar(); };
  });
  pane.querySelectorAll('[data-local]').forEach((b) => {
    b.onclick = () => { estado.ajustes.local = b.dataset.local; salvar(); desenhar(); };
  });
  ligarFichas(pane);
  pane.querySelector('[data-acao="comecar"]').onclick = comecar;
  pane.querySelector('[data-acao="sortear"]').onclick = () => {
    sortearTreino((estado.doDia && estado.doDia.variacao || 0) + 1);
    desenhar();
    aviso('Outro circuito', 'Mesmo tempo, exercícios diferentes.');
  };
}

function telaExercicios() {
  const equips = X.equipamentosUsados();
  // Quem abre esta aba quer ver exercicio de treino. O aquecimento e o
  // alongamento continuam na lista — sao parte do app —, mas depois, e com
  // o nome do que sao.
  const ORDEM = { principal: 0, aquecimento: 1, solta: 2 };
  const lista = X.LISTA.slice().sort((a, b) => ORDEM[a.tipo] - ORDEM[b.tipo]).filter((e) => {
    if (filtro.grupo && e.grupo !== filtro.grupo) return false;
    if (filtro.equipamento === 'corpo' && e.equipamento.length) return false;
    if (filtro.equipamento && filtro.equipamento !== 'corpo'
      && e.equipamento.indexOf(filtro.equipamento) < 0) return false;
    if (filtro.texto) {
      const alvo = F.semAcento(e.nome + ' ' + (X.PADROES[e.padrao] || '') + ' ' + (X.GRUPOS[e.grupo] || ''));
      if (alvo.indexOf(F.semAcento(filtro.texto)) < 0) return false;
    }
    return true;
  });

  let h = '<h2>Exercícios</h2><p class="sub">'
    + F.plural(X.LISTA.length, 'movimento', 'movimentos') + ' no catálogo. Toque para ver como fazer.</p>';

  h += '<div class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
    + '<input id="buscaEx" type="search" placeholder="Buscar exercício" value="' + esc(filtro.texto) + '"></div>';

  h += '<div class="opcoes" style="margin-bottom:8px">'
    + '<button type="button" data-grupo="" aria-pressed="' + (!filtro.grupo) + '">Todos</button>'
    + Object.keys(X.GRUPOS).map((g) => '<button type="button" data-grupo="' + g + '" aria-pressed="'
      + (filtro.grupo === g) + '">' + esc(g === 'corpo-todo' ? 'Corpo todo'
        : (g === 'inferior' ? 'Pernas' : (g === 'superior' ? 'Superior' : 'Core'))) + '</button>').join('')
    + '</div>';

  h += '<div class="opcoes" style="margin-bottom:14px">'
    + '<button type="button" data-equip="" aria-pressed="' + (!filtro.equipamento) + '">Tudo</button>'
    + '<button type="button" data-equip="corpo" aria-pressed="' + (filtro.equipamento === 'corpo')
    + '">Só o corpo</button>'
    + equips.map((q) => '<button type="button" data-equip="' + q + '" aria-pressed="'
      + (filtro.equipamento === q) + '">' + esc(nomeEquip(q)) + '</button>').join('')
    + '</div>';

  h += '<div class="cartao">' + (lista.length ? lista.map((e) =>
    '<div class="item clicavel" data-ficha="' + esc(e.id) + '">'
    + '<div class="ico">' + boneco(e.id, false) + '</div>'
    + '<div class="txt"><b>' + esc(e.nome) + '</b><small>'
    + (e.tipo === 'aquecimento' ? 'Aquecimento · ' : (e.tipo === 'solta' ? 'Volta à calma · ' : ''))
    + esc(X.GRUPOS[e.grupo])
    + (e.equipamento.length ? ' · ' + esc(F.listar(e.equipamento.map(nomeEquip))) : ' · peso do corpo')
    + '</small></div>'
    + '<div class="val">nv ' + e.nivel + '</div></div>').join('')
    : '<div class="vazio">Nada com esse filtro.</div>') + '</div>';

  const pane = $('pane-exercicios');
  pane.innerHTML = h;
  const busca = $('buscaEx');
  busca.oninput = () => {
    filtro.texto = busca.value;
    telaExercicios();
    const b = $('buscaEx');
    b.focus();
    b.setSelectionRange(b.value.length, b.value.length);
  };
  pane.querySelectorAll('[data-grupo]').forEach((b) => {
    b.onclick = () => { filtro.grupo = b.dataset.grupo; telaExercicios(); };
  });
  pane.querySelectorAll('[data-equip]').forEach((b) => {
    b.onclick = () => { filtro.equipamento = b.dataset.equip; telaExercicios(); };
  });
  ligarFichas(pane);
}

/* A ficha do exercicio, que sobe de baixo. Ela existe para uma pergunta so
   — "como e que faz isso?" — e por isso comeca pelas dicas, nao pelos
   selos. */
function ligarFichas(pane) {
  pane.querySelectorAll('[data-ficha]').forEach((el) => {
    el.onclick = () => abrirFicha(el.dataset.ficha);

function abrirFicha(id) {
  const e = X.porId(id);
  if (!e) return;
  const facil = X.vizinho(id, 'facilita');
  const dificil = X.vizinho(id, 'dificulta');

  let h = '<div class="puxador"></div><h2>' + esc(e.nome) + '</h2>'
    + '<div class="boneco-caixa">' + boneco(id, true) + '</div>'
    + '<div class="selos">' + selo(X.GRUPOS[e.grupo]) + selo(X.PADROES[e.padrao])
    + selo('nível ' + e.nivel)
    + selo(e.equipamento.length ? F.listar(e.equipamento.map(nomeEquip)) : 'peso do corpo')
    + (e.impacto === 'alto' ? selo('faz barulho') : '')
    + (e.unilateral ? selo('um lado de cada vez') : '')
    + '</div>'
    + '<ul>' + e.dicas.map((d) => '<li>' + esc(d) + '</li>').join('') + '</ul>';

  if (facil || dificil) {
    h += '<div class="secao"><h3>Se precisar mudar</h3></div><div>';
    if (facil) h += '<div class="item clicavel" data-troca="' + esc(facil.id) + '"><div class="ico">−</div>'
      + '<div class="txt"><b>' + esc(facil.nome) + '</b><small>versão mais fácil</small></div></div>';
    if (dificil) h += '<div class="item clicavel" data-troca="' + esc(dificil.id) + '"><div class="ico">+</div>'
      + '<div class="txt"><b>' + esc(dificil.nome) + '</b><small>versão mais difícil</small></div></div>';
    h += '</div>';
  }
  h += '<button class="btn bloco" style="margin-top:16px" data-acao="fechar">Fechar</button>';

  const folha = $('folha');
  $('folhaDentro').innerHTML = h;
  folha.hidden = false;
  folha.onclick = (ev) => { if (ev.target === folha) fecharFicha(); };

    el.onclick = () => abrirFicha(el.dataset.troca);
  });
}

function fecharFicha() {
  $('folha').hidden = true;
}

/* Um gráfico de linha simples, em SVG.
 *
 * Sem biblioteca: são vinte linhas de regra de três, e uma biblioteca de
 * gráfico custaria mais que o app inteiro. A escala nunca começa no zero —
 * num gráfico de peso, o zero espreme oitenta quilos numa faixa de um
 * pixel e esconde justamente a variação que a pessoa quer ver. */
function graficoDeLinha(pontos, opcoes) {
  const o = opcoes || {};
  if (!pontos || pontos.length < 2) {
    return '<div class="vazio">' + esc(o.vazio || 'Duas anotações e o gráfico aparece.') + '</div>';
  }
  const larg = 300, alt = 108, pad = 14;
  const valores = pontos.map((p) => p.valor);
  let min = Math.min.apply(null, valores);
  let max = Math.max.apply(null, valores);
  if (max === min) { max += 1; min -= 1; }
  const folga = (max - min) * 0.18;
  min -= folga; max += folga;

  const x = (i) => pad + (i / (pontos.length - 1)) * (larg - pad * 2);
  const y = (v) => pad + (1 - (v - min) / (max - min)) * (alt - pad * 2);

  const linha = pontos.map((p, i) => x(i).toFixed(1) + ',' + y(p.valor).toFixed(1)).join(' ');
  const area = pad + ',' + (alt - pad) + ' ' + linha + ' ' + (larg - pad) + ',' + (alt - pad);
  const bolinhas = pontos.map((p, i) =>
    '<circle class="ponto" cx="' + x(i).toFixed(1) + '" cy="' + y(p.valor).toFixed(1) + '" r="2.6"/>').join('');

  const casas = o.casas === undefined ? 1 : o.casas;
  return '<svg class="linha-grafico" viewBox="0 0 ' + larg + ' ' + alt + '" preserveAspectRatio="none">'
    + '<polyline class="area" points="' + area + '"/>'
    + '<polyline class="traco" points="' + linha + '"/>' + bolinhas
    + '</svg>'
    + '<div class="eixo"><span>' + esc(F.dataCurta(pontos[0].data)) + '</span>'
    + '<span>' + valores[valores.length - 1].toFixed(casas).replace('.', ',')
    + ' ' + esc(o.unidade || '') + '</span>'
    + '<span>' + esc(F.dataCurta(pontos[pontos.length - 1].data)) + '</span></div>';
}

 * Aba: Evolução                                                       *

function telaHistorico() {
  const pane = $('pane-historico');
  const cabeca = '<h2>Evolução</h2><p class="sub">O que ficou registrado neste aparelho.</p>'
    + '<div class="seg">'
    + '<button type="button" data-evo="treinos" aria-selected="' + (abaEvolucao === 'treinos') + '">Treino</button>'
    + '<button type="button" data-evo="corpo" aria-selected="' + (abaEvolucao === 'corpo') + '">Corpo</button>'
    + '</div>';
  pane.innerHTML = cabeca + (abaEvolucao === 'corpo' ? ladoCorpo() : ladoTreinos());
  pane.querySelectorAll('[data-evo]').forEach((b) => {
    b.onclick = () => { abaEvolucao = b.dataset.evo; telaHistorico(); };
  });
  if (abaEvolucao === 'corpo') ligarCorpo(pane); else ligarTreinos(pane);
}

function ladoTreinos() {
  const r = P.resumo(estado.historico);
  const dias = P.ultimosDias(estado.historico, 14);
  const teto = Math.max(30, ...dias.map((d) => d.minutos));
  const meta = estado.ajustes.metaSemanal;

  let h = '<div class="linhas" style="margin-bottom:14px">'
    + '<div class="mini' + (r.sequencia ? ' viva' : '') + '"><b>' + r.sequencia + '</b><small>dias seguidos</small></div>'
    + '<div class="mini' + (r.semana.treinos >= meta ? ' bom' : '') + '"><b>' + r.semana.treinos + '/' + meta
    + '</b><small>na semana</small></div>'
    + '<div class="mini"><b>' + r.total.treinos + '</b><small>no total</small></div>'
    + '</div>';

  h += '<div class="cartao"><div class="bloco-cab"><b>Últimos 14 dias</b>'
    + '<small>' + F.plural(r.semana.minutos, 'min', 'min') + ' nesta semana</small></div>'
    + '<div class="barras">'
    + dias.map((d, i) => '<i class="' + (d.treinou ? 'tem' : '') + (i === dias.length - 1 ? ' hoje' : '')
      + '" style="height:' + Math.max(3, Math.round((d.minutos / teto) * 74)) + 'px"'
      + ' title="' + esc(F.dataCurta(d.data)) + '"></i>').join('')
    + '</div><div class="eixo"><span>' + esc(F.dataCurta(dias[0].data)) + '</span><span>hoje</span></div>'
    + '</div>';

  // --- carga das semanas ---
  const semanas = P.cargaPorSemana(estado.historico, 8);
  const tetoCarga = Math.max(10, ...semanas.map((x) => x.carga));
  h += '<div class="cartao"><div class="bloco-cab"><b>Carga das últimas 8 semanas</b>'
    + '<small>' + semanas[semanas.length - 1].carga + ' esta semana</small></div>'
    + '<div class="semanas">'
    + semanas.map((x) => '<i class="' + (x.carga ? 'tem' : '') + (x.atual ? ' agora' : '')
      + '" style="height:' + Math.max(3, Math.round((x.carga / tetoCarga) * 86)) + 'px"'
      + ' title="' + esc(F.dataCurta(x.inicio)) + ': ' + x.carga + '"></i>').join('')
    + '</div><div class="eixo"><span>' + esc(F.dataCurta(semanas[0].inicio))
    + '</span><span>esta semana</span></div>'
    + '<p class="ajuda">Carga é o tempo de esforço multiplicado pelo peso do nível. '
    + 'Serve para comparar semanas entre si, não com as de outra pessoa.</p></div>';

  // --- tendencia ---
  const t = P.tendencia(estado.historico);
  h += '<div class="cartao"><div class="bloco-cab"><b>Tendência</b></div>'
    + '<div class="tend" style="margin-top:10px"><div class="bolha ' + esc(t.faixa) + '">'
    + (t.razao === null ? '—' : t.razao.toFixed(2).replace('.', ','))
    + '</div><p>' + esc(t.recado) + '</p></div>'
    + (t.razao === null ? ''
      : '<p class="ajuda">' + t.aguda + ' nos últimos 7 dias contra ' + t.cronica
        + ' de média semanal no último mês. Perto de 1 é onde se progride sem susto.</p>')
    + '</div>';

  // --- projecao do mes ---
  const pj = P.projecaoDoMes(estado.historico);
  h += '<div class="cartao"><div class="bloco-cab"><b>Este mês</b>'
    + '<small>dia ' + pj.dia + ' de ' + pj.diasNoMes + '</small></div>';
  if (pj.cedo) {
    h += '<p class="ajuda" style="margin-top:6px">' + F.plural(pj.treinos, 'treino', 'treinos')
      + ' até agora. A projeção aparece a partir do dia 5 — antes disso ela só balança.</p>';
  } else {
    h += '<div class="linhas" style="margin-top:10px">'
      + '<div class="mini"><b>' + pj.treinos + '</b><small>treinos até agora</small></div>'
      + '<div class="mini viva"><b>' + pj.treinosProjetados + '</b><small>no ritmo de hoje</small></div>'
      + '<div class="mini"><b>' + pj.minutosProjetados + '</b><small>min projetados</small></div>'
      + '</div><p class="ajuda">Regra de três com o que já passou do mês. Nada além disso.</p>';
  }
  h += '</div>';

  const top = P.maisTreinados(estado.historico, 5);
  if (top.length) {
    h += '<div class="cartao"><div class="bloco-cab"><b>Mais treinados</b></div>'
      + top.map((x) => {
        const e = X.porId(x.id);
        return '<div class="estacao"><div class="n2">' + esc(e ? e.nome : x.id)
          + '</div><div class="val mono">' + F.plural(x.vezes, 'vez', 'vezes') + '</div></div>';
      }).join('') + '</div>';
  }

  h += '<div class="secao"><h3>Sessões</h3></div><div class="cartao">';
  if (!estado.historico.length) {
    h += '<div class="vazio">Nenhum treino ainda. O primeiro cabe em 10 minutos.</div>';
  } else {
    h += estado.historico.slice(0, 40).map((s) => '<div class="item">'
      + '<div class="ico">' + esc(F.SEMANA_CURTA[F.diaSemana(s.data)]) + '</div>'
      + '<div class="txt"><b>' + esc(F.maiuscula(F.dataAmigavel(s.data))) + '</b>'
      + '<small>' + F.plural(s.minutos, 'minuto', 'minutos') + ' · '
      + esc(s.foco === 'corpo-todo' ? 'corpo todo' : (X.GRUPOS[s.foco] || s.foco).toLowerCase())
      + (s.completo ? '' : ' · parou no meio') + '</small></div>'
      + '<div class="val"><button class="btn peq" data-apagar="' + esc(s.id) + '">apagar</button></div>'
      + '</div>').join('');
  }
  h += '</div>';
  return h;
}

function ligarTreinos(pane) {
  pane.querySelectorAll('[data-apagar]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.apagar;
      const copia = estado.historico.slice();
      estado = P.apagarSessao(estado, id);
      salvar();
      desenhar();
      aviso('Sessão apagada', '', '', {
        texto: 'Desfazer',
        fazer: () => { estado.historico = copia; salvar(); desenhar(); },
      });
    };
  });
}

/* ------------------------------------------------------------------ *
 * Evolução do corpo                                                   *
 * ------------------------------------------------------------------ */
function ladoCorpo() {
  const altura = estado.ajustes.altura;
  const r = C.retrato(estado.medidas, altura);
  let h = '';

  // --- o cartão do IMC ---
  if (!altura) {
    h += '<div class="cartao"><div class="bloco-cab"><b>Sua altura</b></div>'
      + '<p class="ajuda" style="margin:2px 0 10px">Ela quase não muda, então fica guardada '
      + 'e você não digita de novo. Sem ela o app não calcula o IMC.</p>'
      + '<div class="campo"><input id="campoAltura" type="number" inputmode="numeric" '
      + 'placeholder="Altura em cm, ex. 178" min="100" max="250"></div>'
      + '<button class="btn pri bloco" data-acao="salvar-altura">Guardar altura</button></div>';
  } else if (r.imc) {
    const marca = Math.max(0, Math.min(100, ((r.imc - 15) / 25) * 100));
    h += '<div class="cartao destaque hero" style="padding-bottom:14px">'
      + '<div class="rotulo">IMC</div>'
      + '<div class="valor">' + r.imc.toFixed(1).replace('.', ',') + '</div>'
      + '<div class="apoio">' + esc(F.maiuscula(r.faixa.nome)) + '</div>'
      + '<div class="imc-faixa"><b style="left:calc(' + marca.toFixed(1) + '% - 2px)"></b></div>'
      + '<div class="eixo"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div>'
      + '</div>'
      + '<div class="cartao"><p class="ajuda" style="margin:0">'
      + 'O IMC divide peso por altura e <b>não sabe o que é músculo</b>. Quem começa a treinar '
      + 'às vezes ganha peso e “piora” no IMC enquanto melhora de verdade. '
      + (r.referencia ? 'Para ' + altura + ' cm, a faixa normal vai de '
        + r.referencia.de.toFixed(0) + ' a ' + r.referencia.ate.toFixed(0)
        + ' kg — referência, não meta. ' : '')
      + 'A cintura responde melhor à pergunta que você está fazendo.</p></div>';
  } else {
    h += '<div class="cartao"><div class="bloco-cab"><b>Anote seu peso</b></div>'
      + '<p class="ajuda" style="margin-top:4px">Com a altura já guardada (' + altura
      + ' cm), o IMC aparece assim que houver um peso.</p></div>';
  }

  // --- anotar ---
  h += '<div class="cartao"><div class="bloco-cab"><b>Anotar hoje</b>'
    + '<small>' + esc(F.dataCurta(F.hoje())) + '</small></div>'
    + '<p class="ajuda" style="margin:2px 0 10px">Preencha só o que mediu. '
    + 'Anotar de novo hoje corrige a anotação de hoje, não cria outra.</p>'
    + '<div class="medida-linha">'
    // `type="text"` de proposito, com teclado decimal. O `type="number"` do
    // navegador RECUSA a virgula: no teclado brasileiro a pessoa digita
    // "84,2", o campo devolve vazio e a anotacao some sem nenhum aviso.
    // Aqui o texto entra como veio e o modulo do corpo troca a virgula por
    // ponto, que e onde essa conversao tem que morar.
    + C.CAMPOS.map((c) => '<div class="campo"><label>' + esc(c.nome) + ' (' + c.unidade + ')</label>'
      + '<input type="text" inputmode="decimal" autocomplete="off" data-medida="' + c.id + '" '
      + 'placeholder="' + (r[c.id] ? String(r[c.id][c.id]).replace('.', ',') : '—') + '"></div>').join('')
    + '</div>'
    + '<button class="btn pri bloco" data-acao="anotar">Anotar</button></div>';

  // --- o gráfico ---
  const serie = C.serie(estado.medidas, campoGrafico);
  const campo = C.campoPorId(campoGrafico);
  h += '<div class="cartao"><div class="bloco-cab"><b>Evolução</b></div>'
    + '<div class="opcoes chips" style="margin:8px 0 6px">'
    + C.CAMPOS.map((c) => '<button type="button" data-campo="' + c.id + '" aria-pressed="'
      + (campoGrafico === c.id) + '">' + esc(c.nome) + '</button>').join('')
    + '</div>'
    + graficoDeLinha(serie, { unidade: campo.unidade, casas: campo.casas,
      vazio: 'Duas anotações de ' + campo.nome.toLowerCase() + ' e a linha aparece.' });

  const v = campoGrafico === 'cintura' ? r.variacaoCintura
    : (campoGrafico === 'peso' ? r.variacaoPeso : C.variacao(estado.medidas, campoGrafico));
  if (v) {
    const sinal = v.diferenca > 0 ? '+' : '';
    h += '<p class="ajuda">' + sinal + v.diferenca.toFixed(campo.casas).replace('.', ',') + ' '
      + campo.unidade + ' em ' + F.plural(v.dias, 'dia', 'dias') + ' — '
      + sinal + (v.porSemana).toFixed(1).replace('.', ',') + ' ' + campo.unidade + ' por semana.</p>';
  }
  h += '</div>';

  // --- a lista ---
  h += '<div class="secao"><h3>Anotações</h3></div><div class="cartao">';
  if (!(estado.medidas || []).length) {
    h += '<div class="vazio">Nada anotado ainda.</div>';
  } else {
    h += estado.medidas.slice(0, 40).map((m) => '<div class="item">'
      + '<div class="txt"><b>' + esc(F.maiuscula(F.dataAmigavel(m.data))) + '</b><small>'
      + esc(C.CAMPOS.filter((c) => m[c.id] !== undefined)
        .map((c) => c.nome.toLowerCase() + ' ' + String(m[c.id]).replace('.', ',') + ' ' + c.unidade)
        .join(' · ')) + '</small></div>'
      + '<div class="val"><button class="btn peq" data-apagar-medida="' + esc(m.id) + '">apagar</button></div>'
      + '</div>').join('');
  }
  h += '</div>';

  if (altura) {
    h += '<div class="cartao"><div class="troca"><div class="txt"><b>Altura</b>'
      + '<small>Usada só para o IMC</small></div>'
      + '<div style="width:110px"><input id="campoAltura" type="number" inputmode="numeric" '
      + 'value="' + altura + '" min="100" max="250"></div></div>'
      + '<button class="btn peq" data-acao="salvar-altura" style="margin-top:10px">Guardar altura</button>'
      + '</div>';
  }
  return h;
}

function ligarCorpo(pane) {
  const botaoAltura = pane.querySelector('[data-acao="salvar-altura"]');
  if (botaoAltura) {
    botaoAltura.onclick = () => {
      const v = Math.round(Number($('campoAltura').value));
      if (!(v >= 100 && v <= 250)) { aviso('Altura fora do esperado', 'Entre 100 e 250 cm.', 'ruim'); return; }
      estado.ajustes.altura = v;
      salvar();
      desenhar();
      aviso('Altura guardada', 'Agora o IMC aparece com o peso.', 'bom');
    };
  }
  pane.querySelectorAll('[data-campo]').forEach((b) => {
    b.onclick = () => { campoGrafico = b.dataset.campo; telaHistorico(); };
  });
  const anotar = pane.querySelector('[data-acao="anotar"]');
  if (anotar) {
    anotar.onclick = () => {
      const bruta = { data: F.hoje() };
      pane.querySelectorAll('[data-medida]').forEach((i) => { bruta[i.dataset.medida] = i.value; });
      const novo = C.anotar(estado, bruta);
      if (!novo) { aviso('Nada para anotar', 'Preencha ao menos um campo com um número plausível.', 'ruim'); return; }
      estado = novo;
      salvar();
      desenhar();
      aviso('Anotado', F.dataCurta(F.hoje()) + ' guardado.', 'bom');
    };
  }
  pane.querySelectorAll('[data-apagar-medida]').forEach((b) => {
    b.onclick = () => {
      const antes = (estado.medidas || []).slice();
      estado = C.apagar(estado, b.dataset.apagarMedida);
      salvar();
      desenhar();
      aviso('Anotação apagada', '', '', {
        texto: 'Desfazer',
        fazer: () => { estado.medidas = antes; salvar(); desenhar(); },
      });
    };
  });
}

function exportar() {
  const nome = 'circuito-' + F.hoje() + '.json';
  const texto = JSON.stringify(estado, null, 2);
  const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function importar(ev) {
  const arq = ev.target.files && ev.target.files[0];
  if (!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      estado = P.normalizar(JSON.parse(String(leitor.result)));
      estado.medidas = C.normalizarMedidas(estado.medidas);
      salvar();
      desenhar();
      aviso('Dados importados', F.plural(estado.historico.length, 'treino', 'treinos') + ' no histórico.', 'bom');
    } catch (e) {
      aviso('Arquivo inválido', 'Esperava o JSON exportado pelo próprio app.', 'ruim');
    }
  };
  leitor.readAsText(arq);
  ev.target.value = '';
}

/* ------------------------------------------------------------------ *
 * Instalar na tela de inicio                                          *
 * ------------------------------------------------------------------ */

/* O Android avisa que da para instalar disparando `beforeinstallprompt` —
 * uma vez so, e antes de a tela existir. Por isso o convite e guardado
 * assim que chega, e o botao dos Ajustes so o usa depois. Perder esse
 * evento significa nunca mais poder oferecer a instalacao nesta visita.
 *
 * O iPhone nao dispara nada: la a instalacao e manual, pelo botao de
 * compartilhar. Entao o app detecta o Safari e ensina o caminho em vez de
 * mostrar um botao que nao faria nada.
 */
let convite = null;

function instalado() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  } catch (e) { return false; }
}

/* Navegador embutido dentro de outro aplicativo (WhatsApp, Gmail, app de
 * conversa) — o que abre quando se toca num link sem sair do app.
 *
 * Ele NUNCA instala aplicativo: nao dispara o convite de instalacao e nao
 * tem menu para isso. E o Chrome de verdade sempre responde alguma coisa
 * em `display-mode` (num aba normal, "browser"); quando NENHUM dos modos
 * responde, e porque o motor nem implementa a consulta — assinatura de
 * WebView.
 *
 * Isto custou quatro rodadas para ser descoberto: o app dizia "va em
 * Ajustes e toque em Instalar", e o botao nunca existia porque a pagina
 * nem estava no Chrome. Diagnosticar isso a distancia sem perguntar ao
 * proprio navegador era impossivel.
 */
function navegadorLimitado() {
  try {
    if (!window.matchMedia) return true;
    return !['browser', 'standalone', 'minimal-ui', 'fullscreen']
      .some((m) => window.matchMedia('(display-mode: ' + m + ')').matches);
  } catch (e) {
    return true;
  }
}

function noIphone() {
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
}

function ligarInstalacao() {
  window.addEventListener('beforeinstallprompt', (ev) => {
    ev.preventDefault();
    convite = ev;
    // A faixa aparece na hora, em qualquer aba: quem chegou aqui atras de
    // instalar nao deveria precisar procurar o botao nos Ajustes.
    alertaFechado = false;
    pintarAlerta();
    if (aba === 'ajustes') desenhar();
  });
  window.addEventListener('appinstalled', () => {
    convite = null;
    desenhar();
    aviso('Instalado', 'Agora ele abre pelo ícone, em tela cheia.', 'bom');
  });
}

/* Instalar de verdade, e saber se deu certo.
 *
 * O Android faz DUAS coisas parecidas e o resultado nao e o mesmo:
 *
 * - APP de verdade (WebAPK): janela propria, icone sem selo do navegador,
 *   aparece na lista de aplicativos do sistema. So o evento `appinstalled`
 *   confirma que foi este o caso.
 * - ATALHO: um icone com o selo do navegador, que abre uma aba. A pessoa
 *   pediu um app e recebeu um marcador de pagina.
 *
 * O navegador aceita o pedido nos dois casos e responde "accepted" igual.
 * A diferenca so aparece no `appinstalled` que nao chega. Entao o app
 * espera por ele e, se nao vier, diz o que aconteceu em vez de deixar a
 * pessoa achando que instalou. */
let saiuAtalho = false;

function instalar() {
  if (!convite) return;
  let confirmou = false;
  const marcar = () => { confirmou = true; };
  window.addEventListener('appinstalled', marcar);

  convite.prompt();
  convite.userChoice.then((escolha) => {
    if (!escolha || escolha.outcome !== 'accepted') {
      window.removeEventListener('appinstalled', marcar);
      return;
    }
    convite = null;
    desenhar();
    // O `appinstalled` chega em um ou dois segundos quando e app de
    // verdade. Cinco segundos e folga suficiente para nao acusar errado.
    setTimeout(() => {
      window.removeEventListener('appinstalled', marcar);
      if (confirmou || instalado()) return;
      saiuAtalho = true;
      alertaFechado = false;
      desenhar();
    }, 5000);
  }).catch(() => { window.removeEventListener('appinstalled', marcar); });
}

/* Onde o app mora publicado. Fica escrito aqui porque a pessoa que abriu o
   arquivo baixado precisa saber para onde ir — mandar "abra pelo endereco
   publicado" sem dizer qual endereco nao ajuda ninguem. */
/* O que o navegador responde sobre a instalacao, neste aparelho.
 *
 * Existe porque adivinhar a distancia nao funcionou. "Instalei e nao criou
 * icone" tem meia duzia de causas que dao exatamente a mesma tela — app
 * aberto dentro da janela de OUTRO app instalado, arquivo sem endereco,
 * navegador que nao mandou o convite, app ja instalado e so sem atalho na
 * tela inicial. Cada uma tem uma saida diferente, e o navegador sabe
 * distinguir. Entao ele que responda.
 */
function diagnostico() {
  const linhas = [];
  const modo = ['standalone', 'minimal-ui', 'fullscreen', 'browser']
    .filter((m) => { try { return window.matchMedia('(display-mode: ' + m + ')').matches; } catch (e) { return false; } });
  let moldura = false;
  try { moldura = window.self !== window.top; } catch (e) { moldura = true; }

  linhas.push(['Endereço', String(window.location.href)]);
  linhas.push(['Modo de exibição', modo.length ? modo.join(', ') : 'desconhecido']);
  linhas.push(['Dentro de outra janela', moldura ? 'SIM' : 'não']);
  linhas.push(['Convite de instalação', convite ? 'RECEBIDO' : 'não recebido']);
  linhas.push(['Instala aplicativos?', navegadorLimitado()
    ? 'NÃO — navegador dentro de outro app' : 'sim']);
  linhas.push(['Versão', (document.querySelector('meta[name="circuito-versao"]') || {}).content || '—']);
  return linhas;
}

function pintarDiagnostico(alvo) {
  const linhas = diagnostico();
  const escopo = document.querySelector('link[rel="manifest"]');
  const mostra = (extra) => {
    alvo.innerHTML = linhas.concat(extra || []).map(([n, v]) =>
      '<div class="conta-fila"><div class="n">' + esc(n) + '</div>'
      + '<div class="v mono" style="max-width:60%;word-break:break-all;text-align:right">'
      + esc(v) + '</div></div>').join('')
      + '<button class="btn peq bloco" style="margin-top:10px" data-acao="copiar">'
      + 'Copiar este diagnóstico</button>';
    alvo.querySelector('[data-acao="copiar"]').onclick = () => {
      const texto = linhas.concat(extra || []).map(([n, v]) => n + ': ' + v).join('\n');
      try {
        navigator.clipboard.writeText(texto);
        aviso('Copiado', 'Cole na conversa para eu ver o que seu celular está dizendo.', 'bom');
      } catch (e) {
        aviso('Não consegui copiar', 'Tire um print desta lista.', 'ruim');
      }
    };
  };
  mostra([]);

  if (!escopo) return;
  // O service worker responde depois; a lista se completa quando ele volta.
  const extra = [];
  (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
    .then((rs) => {
      // Quem CONTROLA a pagina, nao o primeiro da lista: com dois apps no
      // mesmo endereco a lista traz os dois, e mostrar o primeiro fazia
      // parecer que o app errado estava no comando.
      const dono = navigator.serviceWorker && navigator.serviceWorker.controller;
      extra.push(['Service worker', dono ? 'ativo, controlando esta página'
        : (rs.length ? 'registrado, ainda não assumiu' : 'NENHUM')]);
      if (rs.length) {
        extra.push(['Escopos registrados', rs.map((r) => r.scope).join(' · ')]);
      }
      mostra(extra);
    })
    .catch(() => {});
}

  } else if (navegadorLimitado()) {
    h += '<p class="ajuda" style="margin-top:4px">Você está num <b>navegador embutido dentro de '
