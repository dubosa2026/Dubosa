# Nossa Casa — gera o APK Android instalável.
#
# Roda sozinho a cada mudança em nossa-casa/ (e também pelo botão "Run workflow").
# Passos: instala, confere tipos, roda todos os testes (inclusive o do banco,
# num Postgres de verdade), gera o projeto Android e compila o APK.
#
# Onde pegar o APK depois que terminar:
#   * Aba "Releases" do repositório → "Nossa Casa (Android)" → NossaCasa.apk
#     (link fixo: .../releases/download/nossa-casa-latest/NossaCasa.apk)
#   * ou na própria execução, em "Artifacts".
#
# Opcional (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY
#       → o APK já vem conectado ao Supabase da família (sem colar nada no celular).
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#       → usa a sua chave de assinatura. Sem eles, o workflow gera uma chave na primeira
#         vez e reaproveita (cache), para as atualizações instalarem por cima.
name: Nossa Casa — APK Android

on:
  push:
    paths:
      - 'nossa-casa/**'
      - '.github/workflows/nossa-casa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nossa-casa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: nossa-casa
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nossa-casa/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos
        run: npx tsc --noEmit

      - name: Subir a API do Supabase (PostgREST) para o teste ponta a ponta
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database nc_e2e"
          psql -h localhost -U postgres -d nc_e2e -v ON_ERROR_STOP=1 -q -f tests/sql/supabase_stub.sql -f supabase/migrations/001_nossa_casa.sql
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C /tmp
          cat > /tmp/pgrst.conf <<'EOF'
          db-uri = "postgres://postgres:postgres@localhost:5432/nc_e2e"
          db-schemas = "public"
          db-anon-role = "anon"
          jwt-secret = "segredo-so-do-ci-com-pelo-menos-32-caracteres"
          server-port = 3999
          EOF
          /tmp/postgrest /tmp/pgrst.conf > /tmp/pgrst.log 2>&1 &
          for i in $(seq 30); do curl -s -o /dev/null localhost:3999/ && break; sleep 1; done
          curl -s -o /dev/null -w "PostgREST: %{http_code}\n" localhost:3999/

      - name: Testes (regras, divisão, sincronização, banco com RLS e API ponta a ponta)
        run: npm test
        env:
          NC_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          NC_REST_URL: http://localhost:3999
          NC_JWT_SECRET: segredo-so-do-ci-com-pelo-menos-32-caracteres

      - name: Conferir o servidor da família (Supabase)
        continue-on-error: true
        run: |
          URL=$(sed -n "s/.*url: '\(.*\)'.*/\1/p" src/data/familyServer.ts)
          KEY=$(sed -n "s/.*anonKey: '\(.*\)'.*/\1/p" src/data/familyServer.ts)
          if [ -z "$URL" ]; then echo "Sem servidor embutido."; exit 0; fi
          echo "Servidor: $URL"
          echo "--- Banco (espera 401/permission denied = tabelas criadas; 404 = falta rodar o SQL):"
          curl -s -w "  [HTTP %{http_code}]\n" "$URL/rest/v1/households?select=id&limit=1" -H "apikey: $KEY"
          echo "--- Função de criar a casa (espera 401 = existe; 404 = falta rodar o SQL):"
          curl -s -w "  [HTTP %{http_code}]\n" -X POST "$URL/rest/v1/rpc/invite_members" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_code":"TESTE123"}'
          echo "--- Login (espera disable_signup=false e mailer_autoconfirm=true):"
          curl -s "$URL/auth/v1/settings" -H "apikey: $KEY" | python3 -c "import sys,json; s=json.load(sys.stdin); print('  disable_signup =', s.get('disable_signup'), '| mailer_autoconfirm (Confirm email DESLIGADO) =', s.get('mailer_autoconfirm'))"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install

      # Mesma chave de assinatura em todos os builds: assim cada APK novo instala POR CIMA
      # do anterior, sem desinstalar. Usa os segredos ANDROID_* se existirem; senão gera
      # uma chave uma única vez e a guarda no cache do GitHub Actions.
      - name: Chave de assinatura guardada
        uses: actions/cache@v4
        with:
          path: ~/.nossa-casa-assinatura
          key: nossa-casa-assinatura-v1

      - name: Assinatura fixa
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/nossa-casa.keystore
          else
            mkdir -p ~/.nossa-casa-assinatura
            if [ ! -f ~/.nossa-casa-assinatura/nossa-casa.keystore ]; then
              echo "Gerando a chave de assinatura (só na primeira vez)."
              keytool -genkeypair -noprompt -keystore ~/.nossa-casa-assinatura/nossa-casa.keystore -alias nossacasa \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass nossacasa -keypass nossacasa -dname "CN=Nossa Casa, O=Familia, C=BR"
            fi
            cp ~/.nossa-casa-assinatura/nossa-casa.keystore android/app/nossa-casa.keystore
            KEYSTORE_PASSWORD=nossacasa; KEY_ALIAS=nossacasa; KEY_PASSWORD=nossacasa
          fi
          keytool -list -keystore android/app/nossa-casa.keystore -storepass "$KEYSTORE_PASSWORD" | grep -i "fingerprint" || true
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  nossaCasa {
                      storeFile file('nossa-casa.keystore')
                      storePassword '$KEYSTORE_PASSWORD'
                      keyAlias '$KEY_ALIAS'
                      keyPassword '$KEY_PASSWORD'
                  }
              }
              buildTypes { release { signingConfig signingConfigs.nossaCasa } }
          }
          EOF

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nossa-casa/package-lock.json') }}

      - name: Compilar APK
        working-directory: nossa-casa/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Preparar arquivo
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/NossaCasa.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NossaCasa-apk
          path: nossa-casa/out/NossaCasa.apk

      - name: Publicar em Releases (link fixo para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nossa-casa-latest
          name: Nossa Casa (Android)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: nossa-casa/out/NossaCasa.apk
          body: |
            APK do aplicativo **Nossa Casa** gerado automaticamente a partir do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Instalar:** abra este link no celular Android, baixe `NossaCasa.apk`, toque no arquivo e permita "instalar apps desta fonte".
            Instruções completas em `nossa-casa/README.md`.
