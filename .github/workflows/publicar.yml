# Publica a Bússola no GitHub Pages sozinho, a cada envio para esta branch.
#
# Existe para tirar a publicação do colo de alguém: sem isto é preciso entrar
# em Settings -> Pages e ligar na mão, e depois lembrar de repetir. Com isto,
# mexeu no app, enviou, está no ar em dois minutos.
#
# `configure-pages` com `enablement: true` liga o Pages do repositório na
# primeira vez, se ele ainda estiver desligado — é o passo que substitui os
# cliques na tela de configurações.

name: Publicar a Bússola

on:
  push:
    branches: [claude/financial-advisor-voice-recognition-jxuqfw]
  workflow_dispatch:

# O mínimo necessário: ler o código e publicar a página. Nada de escrever no
# repositório.
permissions:
  contents: read
  pages: write
  id-token: write

# Duas publicações ao mesmo tempo se atropelam. A segunda espera a primeira.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A pasta docs/ já vai versionada e pronta. Gerar de novo aqui é só
      # garantia de que ela corresponde ao que está em app/src/ — se alguém
      # editar o código e esquecer de rodar o build, a publicação corrige.
      - name: Gerar o app a partir de app/src/
        run: python3 app/build_app.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: publicacao
        uses: actions/deploy-pages@v4
