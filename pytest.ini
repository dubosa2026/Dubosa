[pytest]
# Só `tests/` tem testes de pytest. Os roteiros em `netlify/testes/` e
# `app/testes_*.py` sobem um navegador e um servidor local: rodam à mão,
# como está escrito no README de cada um. Sem esta linha o pytest tentava
# importá-los na coleta e o `raise SystemExit` deles derrubava a execução.
testpaths = tests
