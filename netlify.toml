# Publicacao do app de distribuicao no Netlify.
#
# O site e estatico: um unico HTML, sem servidor por tras. Cada push na
# branch conectada dispara o build abaixo e publica a versao nova.
#
# Se o build falhar por falta de Python na imagem do Netlify, apague a linha
# "command": o arquivo app/dist/index.html ja vai versionado no repositorio
# e a publicacao funciona sem gerar nada.

[build]
  command = "python3 app/build_app.py"
  publish = "app/dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# As funcoes que servem a carteira de cada vendedor por link secreto.
# Precisam da variavel ADMIN_TOKEN (a senha de publicacao), definida em
# Site settings -> Environment variables. Sem ela a publicacao e recusada.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # A pagina e um app de uso interno: nao deve aparecer em buscador.
    X-Robots-Tag = "noindex, nofollow"

# O HTML e regerado a cada deploy, entao nao pode ficar em cache: senao o
# time continua vendo a versao antiga depois de uma correcao.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
