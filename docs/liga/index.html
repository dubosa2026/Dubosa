<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liga Comercial</title>
  <meta name="description" content="Competição comercial diária por pedidos e faturamento, com resultado individual privado.">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
  <meta name="liga-versao" content="4acb4ca1a599">
</head>
<body>
  <div id="app" role="main">
    <div class="view view-login">
      <div class="login-card">
        <div class="login-logo" aria-hidden="true">🏆</div>
        <h1 class="login-title">Liga Comercial</h1>
        <p class="login-sub">Carregando…</p>
      </div>
    </div>
  </div>

  <noscript>
    <div class="view">
      <div class="card">
        <h1>JavaScript desativado</h1>
        <p>Este aplicativo calcula ranking, ritmo e projeções no próprio navegador. Ative o JavaScript para usá-lo.</p>
      </div>
    </div>
  </noscript>

  <script type="module">
    import { startApp } from './src/app.js';
    window.ligaComercial = startApp(document.getElementById('app'));

    // O navegador avisa UMA vez que a instalação é possível, e o aviso morre se
    // ninguém o guardar. Guardado aqui, o aplicativo pode oferecer o botão na
    // hora certa — em vez de mandar a pessoa procurar um item de menu.
    window.__ligaInstalar = null;
    window.addEventListener('beforeinstallprompt', (evento) => {
      evento.preventDefault();
      window.__ligaInstalar = evento;
      window.dispatchEvent(new CustomEvent('liga:instalavel'));
    });
    window.addEventListener('appinstalled', () => {
      window.__ligaInstalar = null;
      window.dispatchEvent(new CustomEvent('liga:instalavel'));
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      // Quando uma versão nova assume o comando, esta página já é a antiga:
      // o código dela está carregado na memória desde antes. Recarregar aqui é
      // o que faz a correção aparecer sem depender de ninguém saber que
      // precisa recarregar — e sem isso a atualização fica esperando a próxima
      // vez que a pessoa abrir o aplicativo, que pode ser dias.
      let recarregando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (recarregando) return;
        recarregando = true;
        location.reload();
      });

      window.addEventListener('load', async () => {
        try {
          const registro = await navigator.serviceWorker.register('sw.js');
          // Um aplicativo aberto o dia inteiro nunca navegaria de novo, e é
          // justamente nele que a correção precisa entrar durante o dia.
          setInterval(() => registro.update().catch(() => {}), 15 * 60 * 1000);
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) registro.update().catch(() => {});
          });
        } catch { /* offline é opcional */ }
      });
    }
  </script>
</body>
</html>
