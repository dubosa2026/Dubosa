/* Um app de celular, nao um site que encolheu. Tudo aqui parte do polegar:
   o que se toca fica embaixo, o que se le fica em cima, e nada depende de
   passar o mouse por cima porque nao existe mouse. */
:root{
  --bg:#0A0A0B; --panel:#131316; --panel-2:#1A1A1E; --panel-3:#232329;
  --line:#2A2A31; --line-2:#3A3A43;
  --text:#F4F4F1; --text-2:#9E9EA0; --text-3:#6B6B70;
  --y:#FFC72C; --y-hi:#FFD966; --y-dim:#8A6A12; --y-wash:#241D07;
  --ok:#42C98B; --ok-wash:#0F2A1E;
  --no:#FF6B6B; --no-wash:#2C1414;
  --at:#FFA24C; --at-wash:#2A1C0D;
  --ia:#7FB2FF; --ia-wash:#111A2B;
  --radius:14px;
  --ui:'PlexSans',system-ui,-apple-system,sans-serif;
  --dp:'Archivo',system-ui,sans-serif;
  --mono:'PlexMono',ui-monospace,Menlo,monospace;
  --safe:env(safe-area-inset-bottom,0px);
  --nav:calc(62px + var(--safe));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
::selection{background:var(--y);color:#000;}
.mono{font-family:var(--mono);}
.tnum{font-variant-numeric:tabular-nums;}
[hidden]{display:none !important;}

/* O app inteiro cabe numa coluna de celular. No computador ele nao estica:
   fica no meio, do tamanho de um telefone, porque foi para o telefone que
   ele foi desenhado — esticar so faria a tela mentir sobre o uso real. */
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);position:relative;}
@media(min-width:560px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);}
}

/* ---------------- topo ---------------- */
.topo{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  display:flex;align-items:center;gap:10px;}
.marca{display:flex;align-items:center;gap:9px;min-width:0;}
.marca svg{display:block;flex:none;}
.nome{font-family:var(--dp);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1;}
.nome span{color:var(--y);}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px;}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:5px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--text-2);
  background:var(--panel-2);white-space:nowrap;}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-wash);}
.chip.no{border-color:var(--no);color:var(--no);background:var(--no-wash);}
.icone-btn{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--text-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  cursor:pointer;flex:none;}
.icone-btn:active{background:var(--panel-3);}

/* ---------------- conteudo ---------------- */
main{flex:1;padding:16px 16px calc(var(--nav) + 26px);}
.pane{animation:entra .18s ease-out;}
@keyframes entra{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

h2{font-family:var(--dp);font-weight:700;font-size:1.28rem;letter-spacing:-.02em;margin:0 0 4px;}
h3{font-family:var(--dp);font-weight:600;font-size:1rem;margin:0 0 3px;}
.sub{color:var(--text-2);margin:0 0 16px;font-size:.9rem;}
.kicker{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);margin:0 0 8px;}
.secao{margin:26px 0 10px;display:flex;align-items:baseline;gap:8px;}
.secao h3{margin:0;}
.mais{font-size:.82rem;color:var(--y);cursor:pointer;background:none;border:0;padding:2px 0;
  font-family:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;}
.secao .mais{margin-left:auto;text-decoration:none;}

.cartao{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.cartao.destaque{background:linear-gradient(160deg,var(--panel-2),var(--panel));border-color:var(--line-2);}

/* O numero do dia. E a unica coisa que a pessoa abre o app para ver, entao
   e a unica coisa grande da tela. */
.hero{text-align:center;padding:22px 16px 18px;}
.hero .rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-3);}
.hero .valor{font-family:var(--dp);font-weight:800;font-size:clamp(2.6rem,13vw,3.4rem);
  letter-spacing:-.04em;line-height:1.02;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
.hero .valor.bom{color:var(--y);}
.hero .valor.ruim{color:var(--no);}
.hero .apoio{color:var(--text-2);font-size:.88rem;}
.barra{height:7px;border-radius:99px;background:var(--panel-3);margin:14px 0 8px;overflow:hidden;}
.barra i{display:block;height:100%;background:var(--y);border-radius:99px;transition:width .3s;}
.barra i.estourou{background:var(--no);}

.linhas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 10px;text-align:center;}
.mini b{display:block;font-family:var(--dp);font-size:1rem;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;}
.mini small{display:block;color:var(--text-3);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.07em;font-family:var(--mono);margin-top:3px;line-height:1.3;}
.mini.bom b{color:var(--ok);} .mini.ruim b{color:var(--no);}

/* ---------------- lista de lancamentos ---------------- */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.item .ico{width:38px;height:38px;border-radius:11px;background:var(--panel-2);display:grid;
  place-items:center;font-size:17px;flex:none;border:1px solid var(--line);}
.item .txt{min-width:0;flex:1;}
.item .txt b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.item .txt small{color:var(--text-3);font-size:.76rem;}
.item .val{font-family:var(--dp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.item .val.entrada{color:var(--ok);}
.item .apagar{appearance:none;background:none;border:0;color:var(--text-3);padding:8px;cursor:pointer;font-size:15px;}
.vazio{color:var(--text-3);text-align:center;padding:24px 10px;font-size:.9rem;}

/* ---------------- botoes ---------------- */
.btn{appearance:none;cursor:pointer;border-radius:11px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);font-size:.92rem;font-weight:500;
  padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;transition:background .14s,transform .06s;}
.btn:active:not(:disabled){transform:translateY(1px);background:var(--panel-3);}
.btn:disabled{opacity:.45;}
.btn.pri{background:var(--y);color:#0A0A0B;border-color:var(--y);font-weight:700;}
.btn.ia{background:var(--ia-wash);border-color:var(--ia);color:var(--ia);font-weight:600;}
.btn.perigo{border-color:var(--no);color:var(--no);background:transparent;}
.btn.bloco{width:100%;}
.btn.peq{min-height:38px;padding:8px 12px;font-size:.84rem;border-radius:9px;}
.btn-linha{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------------- formularios ---------------- */
label{display:block;font-size:.76rem;color:var(--text-2);margin:0 0 5px;
  font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:11px;padding:12px 13px;min-height:46px;}
input:focus,select:focus{outline:2px solid var(--y);outline-offset:1px;border-color:var(--y);}
.campo{margin-bottom:12px;}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ajuda{font-size:.78rem;color:var(--text-3);margin:6px 0 0;line-height:1.45;}
.troca{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.troca:last-child{border-bottom:0;}
.troca .txt{flex:1;min-width:0;}
.troca .txt b{display:block;font-size:.94rem;font-weight:600;}
.troca .txt small{color:var(--text-3);font-size:.78rem;}
.switch{position:relative;width:50px;height:29px;flex:none;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.switch i{position:absolute;inset:0;background:var(--panel-3);border-radius:99px;
  border:1px solid var(--line-2);transition:background .18s;}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--text-3);transition:transform .18s,background .18s;}
.switch input:checked + i{background:var(--y-wash);border-color:var(--y);}
.switch input:checked + i::after{transform:translateX(21px);background:var(--y);}

/* ---------------- abas + microfone ---------------- */
.abas{position:fixed;bottom:0;left:0;right:0;z-index:35;display:flex;
  background:rgba(10,10,11,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe);max-width:520px;margin:0 auto;}
.aba{flex:1;appearance:none;background:none;border:0;color:var(--text-3);cursor:pointer;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.66rem;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
.aba svg{display:block;}
.aba[aria-selected="true"]{color:var(--y);}
.aba .ponto{position:absolute;top:6px;margin-left:18px;width:6px;height:6px;border-radius:50%;background:var(--no);}

/* O microfone e o centro da barra, levantado. Ele ficava flutuando por
   cima da lista e escondia justamente o valor que a pessoa queria ler —
   dentro da barra ele continua no alcance do polegar e nao tapa nada. */
.mic-slot{width:78px;flex:none;display:flex;justify-content:center;align-items:flex-start;}
.mic{appearance:none;width:56px;height:56px;border-radius:50%;cursor:pointer;margin-top:-19px;
  border:4px solid var(--bg);background:var(--panel-3);color:var(--text);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.6);transition:transform .12s;}
.mic:active{transform:scale(.93);}
.mic[data-estado="ouvindo"]{background:var(--y);color:#0A0A0B;animation:pulso 1.5s ease-in-out infinite;}
.mic[data-estado="indisponivel"]{opacity:.45;}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,199,44,.45),0 6px 18px rgba(0,0,0,.6);}
  55%{box-shadow:0 0 0 13px rgba(255,199,44,0),0 6px 18px rgba(0,0,0,.6);}}

/* O que o microfone ouviu aparece logo acima da barra, onde o olho ja esta. */
.mic-fala{position:fixed;left:14px;right:14px;bottom:calc(var(--nav) + 14px);z-index:37;
  max-width:492px;margin:0 auto;background:rgba(19,19,22,.97);border:1px solid var(--line-2);
  border-radius:13px;padding:10px 14px;font-size:.86rem;color:var(--text-2);text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.55);}
.mic-fala b{color:var(--text);font-weight:600;}

/* ---------------- avisos ---------------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 72px);z-index:60;
  max-width:496px;margin:0 auto;background:var(--panel-3);border:1px solid var(--line-2);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);animation:sobe .2s ease-out;}
@keyframes sobe{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.toast .txt{flex:1;font-size:.88rem;min-width:0;}
.toast .txt b{display:block;font-weight:600;}
.toast .txt small{color:var(--text-2);}
.toast.bom{border-color:var(--ok);} .toast.ruim{border-color:var(--no);}
.toast button{appearance:none;background:none;border:1px solid var(--line-2);color:var(--y);
  border-radius:9px;padding:8px 11px;font-size:.82rem;cursor:pointer;font-weight:600;flex:none;}

/* ---------------- conselhos ---------------- */
.conselho{border-left:3px solid var(--line-2);}
.conselho.alerta{border-left-color:var(--no);background:linear-gradient(90deg,var(--no-wash),var(--panel) 55%);}
.conselho.atencao{border-left-color:var(--at);background:linear-gradient(90deg,var(--at-wash),var(--panel) 55%);}
.conselho.acao{border-left-color:var(--y);}
.conselho.bom{border-left-color:var(--ok);}
.conselho.ia{border-left-color:var(--ia);background:linear-gradient(90deg,var(--ia-wash),var(--panel) 60%);}
.conselho h3{margin-bottom:6px;}
.conselho p{margin:0;font-size:.9rem;color:var(--text-2);line-height:1.55;}
.conselho .selo{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);display:block;margin-bottom:7px;}
.corte{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;}
.corte-linha{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.86rem;}
.corte-linha .n{flex:1;}
.corte-linha .de{color:var(--text-3);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.corte-linha .pra{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums;}

/* ---------------- projecoes ---------------- */
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:16px;}
.seg button{flex:1;appearance:none;background:none;border:0;color:var(--text-3);cursor:pointer;
  padding:9px 4px;border-radius:8px;font-size:.84rem;font-weight:600;}
.seg button[aria-selected="true"]{background:var(--y);color:#0A0A0B;}
.grafico{width:100%;height:132px;display:block;margin:6px 0 2px;overflow:visible;}
.grafico .zero{stroke:var(--no);stroke-width:1;stroke-dasharray:3 3;opacity:.6;}
.grafico .hoje{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 4;}
.grafico .linha{fill:none;stroke:var(--y);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
.grafico .area{fill:url(#gY);opacity:.5;}
.grafico .neg{stroke:var(--no);}
.grafico .marca-neg{fill:var(--no);}
.eixo{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--text-3);margin-top:2px;}
.conta-fila{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);
  font-size:.88rem;}
.conta-fila:last-child{border-bottom:0;}
.conta-fila .dia{font-family:var(--mono);font-size:.76rem;color:var(--text-3);width:44px;flex:none;}
.conta-fila .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conta-fila .v{font-variant-numeric:tabular-nums;font-weight:600;}
.conta-fila .v.entrada{color:var(--ok);}

/* ---------------- trava ---------------- */
.trava{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px;}
.trava .pontos{display:flex;gap:12px;}
.trava .pontos i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line-2);}
.trava .pontos i.cheio{background:var(--y);border-color:var(--y);}
.teclado{display:grid;grid-template-columns:repeat(3,74px);gap:12px;}
.teclado button{appearance:none;height:64px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--panel-2);font-family:var(--dp);font-size:1.4rem;font-weight:600;cursor:pointer;}
.teclado button:active{background:var(--panel-3);}
.teclado button.vazio{border:0;background:none;}

.rodape{color:var(--text-3);font-size:.76rem;text-align:center;padding:26px 10px 4px;line-height:1.6;}
</style>
</head>

<div class="app">

<script>
/* ==== formato.js ==== */
(function(){
/* Dinheiro, datas e numeros por extenso — em portugues do Brasil.
 *
 * Este arquivo e a base de tudo: a voz cai aqui para virar numero, as
 * projecoes caem aqui para virar texto na tela. Ele nao conhece o resto do
 * app de proposito, entao da para testar sozinho no node.
 *
 * Uma decisao que vale explicar: data e sempre a string 'AAAA-MM-DD', e a
 * conta e sempre feita com `new Date(ano, mes-1, dia)`, que e horario
 * LOCAL. Se usasse `new Date('2026-08-26')` o navegador leria como UTC e,
 * no fuso do Brasil, "hoje" viraria "ontem" depois das 21h — o app diria
 * que o gasto de agora a pouco foi de ontem.
 */

const MOEDA = new Intl.NumberFormat('pt-BR', {
  style: 'currency', currency: 'BRL', minimumFractionDigits: 2,
});
const MOEDA_SECA = new Intl.NumberFormat('pt-BR', {
  style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0,
});

function dinheiro(v, seca) {
  const n = Number(v) || 0;
  return (seca ? MOEDA_SECA : MOEDA).format(n);
}

/* Numero curto para caber em cartao de celular: R$ 12,4 mil.
   Acima de mil a casa dos centavos nao ajuda ninguem a decidir nada. */
function dinheiroCurto(v) {
  const n = Number(v) || 0;
  const abs = Math.abs(n);
  const sinal = n < 0 ? '-' : '';
  if (abs >= 1000000) return sinal + 'R$ ' + (abs / 1000000).toFixed(abs >= 10000000 ? 0 : 1).replace('.', ',') + ' mi';
  if (abs >= 10000) return sinal + 'R$ ' + (abs / 1000).toFixed(abs >= 100000 ? 0 : 1).replace('.', ',') + ' mil';
  if (abs >= 1000) return dinheiro(n, true);
  return dinheiro(n);
}

function porcento(v, casas) {
  const n = Number(v) || 0;
  return (n * 100).toFixed(casas == null ? 0 : casas).replace('.', ',') + '%';
}

/* ------------------------------------------------------------------ *
 * Ler numero escrito em digitos: "1.234,56", "1234.56", "45", "R$ 9"  *
 * ------------------------------------------------------------------ */
function lerNumero(txt) {
  if (typeof txt === 'number') return Number.isFinite(txt) ? txt : null;
  let s = String(txt == null ? '' : txt).trim();
  if (!s) return null;
  s = s.replace(/r\$/gi, '').replace(/\s/g, '');
  const negativo = /^-/.test(s);
  s = s.replace(/-/g, '');
  if (!/[0-9]/.test(s)) return null;

  const temPonto = s.includes('.');
  const temVirgula = s.includes(',');
  if (temPonto && temVirgula) {
    // "1.234,56" — o ponto e milhar, a virgula e decimal.
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (temVirgula) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (temPonto) {
    // So ponto: pode ser milhar ("1.500") ou decimal ("12.50"). Se o padrao
    // for grupos de tres depois do primeiro ponto, e milhar.
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return null;
  return negativo ? -n : n;
}

/* ------------------------------------------------------------------ *
 * Ler numero FALADO: "quarenta e cinco reais e noventa centavos".     *
 *                                                                     *
 * O reconhecimento de voz do celular as vezes devolve digito          *
 * ("45 reais") e as vezes devolve palavra ("quarenta e cinco reais"). *
 * Sem esta parte, metade do que a pessoa fala vira lancamento sem     *
 * valor — e um app de financas que perde o valor nao serve para nada. *
 * ------------------------------------------------------------------ */
const UNIDADES = {
  zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5,
  seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13,
  catorze: 14, quatorze: 14, quinze: 15, dezesseis: 16, dezasseis: 16,
  dezessete: 17, dezoito: 18, dezenove: 19,
};
const DEZENAS = {
  vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60,
  setenta: 70, oitenta: 80, noventa: 90,
};
const CENTENAS = {
  cem: 100, cento: 100, duzentos: 200, duzentas: 200, trezentos: 300,
  trezentas: 300, quatrocentos: 400, quatrocentas: 400, quinhentos: 500,
  quinhentas: 500, seiscentos: 600, seiscentas: 600, setecentos: 700,
  setecentas: 700, oitocentos: 800, oitocentas: 800, novecentos: 900,
  novecentas: 900,
};
const ESCALAS = { mil: 1000, milhao: 1000000, milhoes: 1000000, milhao_: 1000000 };

function semAcento(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

/* Converte uma sequencia de palavras em numero. Devolve null se nenhuma
   palavra da sequencia for numero — assim quem chama sabe que nao achou. */
function numeroPorExtenso(texto) {
  const palavras = semAcento(texto).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  let total = 0, parcial = 0, achou = false;
  for (const p of palavras) {
    if (p === 'e') continue;
    if (/^\d+$/.test(p)) { parcial += parseInt(p, 10); achou = true; continue; }
    if (p in UNIDADES) { parcial += UNIDADES[p]; achou = true; continue; }
    if (p in DEZENAS) { parcial += DEZENAS[p]; achou = true; continue; }
    if (p in CENTENAS) { parcial += CENTENAS[p]; achou = true; continue; }
    if (p === 'mil') { parcial = (parcial || 1) * 1000; total += parcial; parcial = 0; achou = true; continue; }
    if (p === 'milhao' || p === 'milhoes') {
      parcial = (parcial || 1) * 1000000; total += parcial; parcial = 0; achou = true; continue;
    }
    // Palavra que nao e numero encerra a leitura: "cinco no mercado" nao
    // pode virar cinco-mercado. Mas so encerra se ja tinha comecado.
    if (achou) break;
  }
  if (!achou) return null;
  return total + parcial;
}

/* O valor falado inteiro, ja com centavos: "trinta reais e cinquenta
   centavos", "quarenta e cinco reais e noventa", "mil e duzentos".

   O corte entre reais e centavos nao pode ser no primeiro "e" da frase:
   "quarenta e cinco reais e noventa centavos" tem dois. O corte certo e o
   ULTIMO "e" — ou a palavra "reais", quando ela aparece, que e um
   separador melhor ainda porque a pessoa costuma dize-la no meio. */
function lerValorFalado(texto) {
  const t = semAcento(texto).replace(/\s+/g, ' ').trim();

  const comCentavos = t.match(/^(.*?)\s*centavos?\b/);
  if (comCentavos) {
    const parte = comCentavos[1].trim();
    let inteiro = null, centavos = null;
    const porReais = parte.match(/^(.*)\b(?:reais|real)\b\s*(?:e\s+)?(.*)$/);
    if (porReais && numeroPorExtenso(porReais[2]) != null) {
      inteiro = numeroPorExtenso(porReais[1]);
      centavos = numeroPorExtenso(porReais[2]);
    } else {
      const ultimoE = parte.lastIndexOf(' e ');
      if (ultimoE > 0) {
        inteiro = numeroPorExtenso(parte.slice(0, ultimoE));
        centavos = numeroPorExtenso(parte.slice(ultimoE + 3));
      } else {
        // "cinquenta centavos" — so a parte dos centavos.
        const so = numeroPorExtenso(parte);
        if (so != null) return so / 100;
      }
    }
    if (inteiro != null && centavos != null) {
      return inteiro + (centavos >= 100 ? centavos / 1000 : centavos / 100);
    }
    if (inteiro != null) return inteiro;
  }

  // "quarenta reais e noventa" (sem dizer "centavos" no fim) e comum na
  // fala. Só vale quando o "e" vem depois de "reais": senao "mil e
  // duzentos" viraria 1000,20.
  const semDizerCentavos = t.match(/^(.*)\b(?:reais|real)\b\s+e\s+([a-z0-9 ]+)$/);
  if (semDizerCentavos) {
    const inteiro = numeroPorExtenso(semDizerCentavos[1]);
    const centavos = numeroPorExtenso(semDizerCentavos[2]);
    if (inteiro != null && centavos != null) return inteiro + centavos / 100;
  }

  return numeroPorExtenso(t);
}

/* ------------------------------------------------------------------ *
 * Datas                                                               *
 * ------------------------------------------------------------------ */
function hoje() { return diaISO(new Date()); }

function diaISO(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function deISO(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function somarDias(iso, n) {
  const d = deISO(iso);
  if (!d) return iso;
  d.setDate(d.getDate() + n);
  return diaISO(d);
}

/* Somar mes preservando "o dia 31 de um mes de 30". O dia 31 vira o dia 30:
   e o que o boleto faz, e o que a pessoa espera ver. */
function somarMeses(iso, n) {
  const d = deISO(iso);
  if (!d) return iso;
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dia, diasNoMes(d.getFullYear(), d.getMonth() + 1)));
  return diaISO(d);
}

function diasNoMes(ano, mes) { return new Date(ano, mes, 0).getDate(); }

function fimDoMes(iso) {
  const d = deISO(iso);
  if (!d) return iso;
  return diaISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}

function fimDoAno(iso) {
  const d = deISO(iso);
  if (!d) return iso;
  return diaISO(new Date(d.getFullYear(), 11, 31));
}

/* Quantos dias de `a` ate `b`, contando os dois? Nao: contando o intervalo.
   Usa meio-dia para nao tropecar no horario de verao. */
function diasEntre(a, b) {
  const da = deISO(a), db = deISO(b);
  if (!da || !db) return 0;
  da.setHours(12, 0, 0, 0); db.setHours(12, 0, 0, 0);
  return Math.round((db - da) / 86400000);
}

const MESES = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho',
  'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESES_ACENTO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
  'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
const SEMANA_ACENTO = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira',
  'quinta-feira', 'sexta-feira', 'sábado'];

function diaSemana(iso) { const d = deISO(iso); return d ? d.getDay() : 0; }

/* Data de outro ano leva o ano junto. Sem isso a projecao de 12 meses diz
   "25 de agosto" e a pessoa le como se fosse daqui a uma semana. */
function outroAno(d) { return d.getFullYear() !== new Date().getFullYear(); }

function dataCurta(iso) {
  const d = deISO(iso);
  if (!d) return '';
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0')
    + (outroAno(d) ? '/' + String(d.getFullYear()).slice(2) : '');
}

function dataPorExtenso(iso) {
  const d = deISO(iso);
  if (!d) return '';
  return d.getDate() + ' de ' + MESES_ACENTO[d.getMonth()]
    + (outroAno(d) ? ' de ' + d.getFullYear() : '');
}

/* "hoje", "ontem", "sexta-feira", "12 de agosto" — o rotulo que a pessoa
   entende sem precisar contar nos dedos. */
function dataAmigavel(iso, refIso) {
  const ref = refIso || hoje();
  const d = diasEntre(iso, ref);
  if (d === 0) return 'hoje';
  if (d === 1) return 'ontem';
  if (d === -1) return 'amanhã';
  if (d === 2) return 'anteontem';
  if (d > 2 && d <= 6) return SEMANA_ACENTO[diaSemana(iso)];
  if (d < -1 && d >= -6) return SEMANA_ACENTO[diaSemana(iso)];
  return dataPorExtenso(iso);
}

const Formato = {
  dinheiro, dinheiroCurto, porcento, lerNumero, numeroPorExtenso, lerValorFalado,
  semAcento, hoje, diaISO, deISO, somarDias, somarMeses, diasNoMes, fimDoMes,
  fimDoAno, diasEntre, diaSemana, dataCurta, dataPorExtenso, dataAmigavel,
  MESES, MESES_ACENTO, SEMANA, SEMANA_ACENTO,
};

if (typeof module !== 'undefined' && module.exports) module.exports = Formato;
else window.Formato = Formato;

})();

/* ==== nucleo.js ==== */
(function(){
/* O nucleo: o que entrou, o que sai todo mes, e para onde isso leva.
 *
 * Nao toca na tela nem no microfone — so numero. Isso e de proposito: a
 * projecao e a unica parte do app em que um erro custa dinheiro de
 * verdade, entao ela roda tambem fora do navegador, nos testes.
 *
 * Tres ideias sustentam a projecao:
 *
 * 1. O SALDO E INFORMADO, nao adivinhado. A pessoa olha o banco e digita.
 *    A partir dai o app soma e subtrai o que ela lanca. Ninguem precisa
 *    conectar conta nenhuma — e o app tambem nao teria como.
 * 2. O QUE E FIXO E CALENDARIO, nao media. Aluguel, salario e assinatura
 *    caem em dia certo; projetar isso como "media diaria" borraria o
 *    unico pedaco do futuro que se conhece com certeza.
 * 3. O QUE E VARIAVEL E MEDIA, e a media diz de quantos dias ela veio. Uma
 *    media de tres dias de historico nao merece a mesma confianca de uma
 *    de trinta, e a tela precisa poder dizer isso.
 */

/* eslint-disable no-undef */
var F = (typeof require !== 'undefined' && typeof module !== 'undefined')
  ? require('./formato.js') : window.Formato;

const CATEGORIAS = [
  { id: 'mercado', nome: 'Mercado', emoji: '🛒', tipo: 'saida' },
  { id: 'comida', nome: 'Comida fora', emoji: '🍽️', tipo: 'saida' },
  { id: 'transporte', nome: 'Transporte', emoji: '🚗', tipo: 'saida' },
  { id: 'moradia', nome: 'Moradia', emoji: '🏠', tipo: 'saida' },
  { id: 'contas', nome: 'Contas de casa', emoji: '💡', tipo: 'saida' },
  { id: 'saude', nome: 'Saúde', emoji: '💊', tipo: 'saida' },
  { id: 'educacao', nome: 'Educação', emoji: '📚', tipo: 'saida' },
  { id: 'lazer', nome: 'Lazer', emoji: '🎬', tipo: 'saida' },
  { id: 'assinatura', nome: 'Assinaturas', emoji: '📺', tipo: 'saida' },
  { id: 'roupa', nome: 'Roupa', emoji: '👕', tipo: 'saida' },
  { id: 'pet', nome: 'Pet', emoji: '🐾', tipo: 'saida' },
  { id: 'divida', nome: 'Dívida', emoji: '🧾', tipo: 'saida' },
  { id: 'imposto', nome: 'Imposto', emoji: '🏛️', tipo: 'saida' },
  { id: 'presente', nome: 'Presente', emoji: '🎁', tipo: 'saida' },
  { id: 'outros', nome: 'Outros', emoji: '•', tipo: 'saida' },
  { id: 'salario', nome: 'Salário', emoji: '💼', tipo: 'entrada' },
  { id: 'extra', nome: 'Renda extra', emoji: '➕', tipo: 'entrada' },
  { id: 'rendimento', nome: 'Rendimento', emoji: '📈', tipo: 'entrada' },
  { id: 'entrada', nome: 'Entrada', emoji: '↓', tipo: 'entrada' },
];

function categoria(id) {
  return CATEGORIAS.find((c) => c.id === id)
    || { id: 'outros', nome: 'Outros', emoji: '•', tipo: 'saida' };
}

function novoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function estadoNovo() {
  return {
    versao: 1,
    saldo: { valor: 0, data: F.hoje(), definidoEm: 0 },
    lancamentos: [],
    fixos: [],
    dividas: [],
    ajustes: {
      reserva: 0,          // piso que a pessoa quer manter na conta
      reservaMeses: 3,     // meta de reserva de emergencia, em meses de fixo
      taxaAno: null,       // rendimento anual informado POR ELA, nunca chutado
      janelaMedia: 30,     // dias de historico que alimentam a media variavel
      falar: true,         // responder em voz alta
      pin: '',             // trava do app (opcional)
      iaSenha: '',         // senha do endereco publicado da analise por IA
      iaEndereco: '',      // vazio = /api/conselho no mesmo endereco do app
    },
  };

/* Estado vindo do armazenamento pode estar velho ou torto. Aqui ele volta a
   ter todos os campos, sem derrubar o app com um `undefined` no meio. */
function normalizar(bruto) {
  const base = estadoNovo();
  const e = Object.assign(base, bruto && typeof bruto === 'object' ? bruto : {});
  e.saldo = Object.assign(base.saldo, e.saldo || {});
  e.saldo.valor = Number(e.saldo.valor) || 0;
  if (!F.deISO(e.saldo.data)) e.saldo.data = F.hoje();
  e.ajustes = Object.assign(base.ajustes, e.ajustes || {});
  e.lancamentos = (Array.isArray(e.lancamentos) ? e.lancamentos : [])
    .filter((l) => l && F.deISO(l.data) && Number.isFinite(Number(l.valor)))
    .map((l) => ({
      id: l.id || novoId(),
      data: l.data,
      valor: Math.abs(Number(l.valor)),
      tipo: l.tipo === 'entrada' ? 'entrada' : 'saida',
      categoria: categoria(l.categoria).id,
      descricao: String(l.descricao || ''),
      fixoId: l.fixoId || '',
      foraDaMedia: !!l.foraDaMedia,
      origem: l.origem || 'manual',
      criadoEm: Number(l.criadoEm) || 0,
    }))
    .sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : b.criadoEm - a.criadoEm));
  e.fixos = (Array.isArray(e.fixos) ? e.fixos : [])
    .filter((f) => f && Number.isFinite(Number(f.valor)))
    .map((f) => ({
      id: f.id || novoId(),
      nome: String(f.nome || 'Conta fixa'),
      valor: Math.abs(Number(f.valor)),
      tipo: f.tipo === 'entrada' ? 'entrada' : 'saida',
      ciclo: ['mensal', 'semanal', 'diario'].includes(f.ciclo) ? f.ciclo : 'mensal',
      dia: Math.min(31, Math.max(1, Number(f.dia) || 1)),
      diaSemana: Math.min(6, Math.max(0, Number(f.diaSemana) || 0)),
      inicio: F.deISO(f.inicio) ? f.inicio : '',
      fim: F.deISO(f.fim) ? f.fim : '',
      categoria: categoria(f.categoria).id,
      dividaId: f.dividaId || '',
      ativo: f.ativo !== false,
    }));
  e.dividas = (Array.isArray(e.dividas) ? e.dividas : [])
    .filter((d) => d && Number.isFinite(Number(d.saldo)))
    .map((d) => ({
      id: d.id || novoId(),
      nome: String(d.nome || 'Dívida'),
      saldo: Math.abs(Number(d.saldo)),
      jurosMes: Math.max(0, Number(d.jurosMes) || 0),
      parcela: Math.max(0, Number(d.parcela) || 0),
    }));
  return e;
}

/* ------------------------------------------------------------------ *
 * Saldo                                                               *
 * ------------------------------------------------------------------ */

/* O saldo informado vale para o INSTANTE em que foi informado. Por isso o
   lancamento do mesmo dia so entra na conta se foi criado depois disso: o
   cafe que voce pagou de manha ja estava descontado no extrato que voce
   olhou ao meio-dia. Lancamento de data anterior nunca entra — o banco ja
   sabe dele. */
function saldoEm(estado, ate) {
  const ref = ate || F.hoje();
  let s = Number(estado.saldo.valor) || 0;
  const marco = Number(estado.saldo.definidoEm) || 0;
  for (const l of estado.lancamentos) {
    if (l.data > ref) continue;
    if (l.data < estado.saldo.data) continue;
    if (l.data === estado.saldo.data && (Number(l.criadoEm) || 0) <= marco) continue;
    s += l.tipo === 'entrada' ? l.valor : -l.valor;
  }
  return arredondar(s);
}

function arredondar(v) { return Math.round((Number(v) || 0) * 100) / 100; }

/* ------------------------------------------------------------------ *
 * Contas fixas viram datas no calendario                              *
 * ------------------------------------------------------------------ */

/* Todas as ocorrencias de um fixo dentro do intervalo, ja pulando as que
   ja foram lancadas. Sem essa checagem o aluguel pago no dia 10 apareceria
   duas vezes na projecao do mes: uma como lancamento, outra como previsao. */
function ocorrencias(estado, de, ate) {
  const fora = [];
  const dias = F.diasEntre(de, ate);
  if (dias < 0) return fora;

  for (const f of estado.fixos) {
    if (!f.ativo) continue;
    const inicio = f.inicio && f.inicio > de ? f.inicio : de;
    const fim = f.fim && f.fim < ate ? f.fim : ate;
    if (F.diasEntre(inicio, fim) < 0) continue;

    if (f.ciclo === 'diario') {
      for (let d = inicio; d <= fim; d = F.somarDias(d, 1)) {
        fora.push(ocorrencia(f, d));
      }
    } else if (f.ciclo === 'semanal') {
      for (let d = inicio; d <= fim; d = F.somarDias(d, 1)) {
        if (F.diaSemana(d) === f.diaSemana) fora.push(ocorrencia(f, d));
      }
    } else {
      // Mensal: o dia 31 num mes de 30 cai no ultimo dia, como o boleto faz.
      let cursor = inicio;
      while (cursor <= fim) {
        const d = new Date(F.deISO(cursor).getFullYear(), F.deISO(cursor).getMonth(), 1);
        const ultimo = F.diasNoMes(d.getFullYear(), d.getMonth() + 1);
        const data = F.diaISO(new Date(d.getFullYear(), d.getMonth(), Math.min(f.dia, ultimo)));
        if (data >= inicio && data <= fim) fora.push(ocorrencia(f, data));
        cursor = F.somarMeses(F.diaISO(new Date(d.getFullYear(), d.getMonth(), 1)), 1);
      }
    }
  }

  return fora
    .filter((o) => !jaLancado(estado, o))
    .sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
}

function ocorrencia(f, data) {
  return {
    data, valor: f.valor, tipo: f.tipo, nome: f.nome,
    categoria: f.categoria, fixoId: f.id, ciclo: f.ciclo,
  };
}

/* Ja foi pago? Para conta mensal, basta ter um lancamento do mesmo fixo no
   mesmo mes; para semanal, na mesma semana; para diaria, no mesmo dia. */
function jaLancado(estado, o) {
  return estado.lancamentos.some((l) => {
    if (l.fixoId !== o.fixoId) return false;
    if (o.ciclo === 'diario') return l.data === o.data;
    if (o.ciclo === 'semanal') return Math.abs(F.diasEntre(l.data, o.data)) < 7;
    return l.data.slice(0, 7) === o.data.slice(0, 7);
  });
}

/* ------------------------------------------------------------------ *
 * O gasto variavel: a media que sustenta a projecao                   *
 * ------------------------------------------------------------------ */

/* Media diaria do que NAO e conta fixa, na janela dos ultimos N dias.
 *
 * O divisor e o numero de dias observados, nao o numero de dias com gasto:
 * quem passa tres dias sem gastar tem media menor, e e isso mesmo. Mas o
 * divisor tambem nao passa do historico que existe — quem usa o app ha
 * dois dias nao tem media de trinta. */
function mediaVariavel(estado, ref, janela) {
  const fim = ref || F.hoje();
  const dias = Math.max(1, Number(janela) || estado.ajustes.janelaMedia || 30);
  const inicio = F.somarDias(fim, -(dias - 1));

  const usados = estado.lancamentos.filter(
    (l) => l.tipo === 'saida' && !l.fixoId && !l.foraDaMedia && l.data >= inicio && l.data <= fim,
  );
  const primeiro = estado.lancamentos.length
    ? estado.lancamentos[estado.lancamentos.length - 1].data : fim;
  const observados = Math.max(1, Math.min(dias, F.diasEntre(primeiro, fim) + 1));
  const total = usados.reduce((s, l) => s + l.valor, 0);

  return {
    media: arredondar(total / observados),
    total: arredondar(total),
    dias: observados,
    lancamentos: usados.length,
    // Uma media de menos de uma semana ainda e palpite. A tela avisa.
    confianca: observados >= 21 ? 'alta' : observados >= 7 ? 'media' : 'baixa',
  };
}

function gastoVariavelDoDia(estado, dia) {
  const d = dia || F.hoje();
  return arredondar(estado.lancamentos
    .filter((l) => l.data === d && l.tipo === 'saida' && !l.fixoId)
    .reduce((s, l) => s + l.valor, 0));
}

/* ------------------------------------------------------------------ *
 * Projecao                                                            *
 * ------------------------------------------------------------------ */

/* Caminha dia a dia de hoje ate `ate`, somando o que e certo (fixos) e
   descontando o que e provavel (media). Devolve a serie inteira porque o
   grafico da tela e a resposta em si: importa mais QUANDO o saldo fura o
   chao do que o numero do ultimo dia. */
function projetar(estado, ate, opcoes) {
  const o = opcoes || {};
  const inicio = o.de || F.hoje();
  const fimIso = ate;
  const dias = Math.max(0, F.diasEntre(inicio, fimIso));
  const mv = mediaVariavel(estado, inicio);
  const mediaDia = o.mediaDia != null ? o.mediaDia : mv.media;

  let saldo = saldoEm(estado, inicio);
  const inicial = saldo;
  const eventos = ocorrencias(estado, F.somarDias(inicio, 1), fimIso);
  const porDia = new Map();
  for (const ev of eventos) {
    if (!porDia.has(ev.data)) porDia.set(ev.data, []);
    porDia.get(ev.data).push(ev);
  }

  // Hoje ja rendeu gasto? Entao o que sobra de "media" para hoje e o
  // que falta ate a media — nunca negativo, senao o dia gastado viraria
  // credito no futuro.
  const gastoHoje = gastoVariavelDoDia(estado, inicio);
  const restoDeHoje = Math.max(0, mediaDia - gastoHoje);

  let entradas = 0, saidasFixas = 0, saidasVariaveis = 0;
  // Um ponto por dia, e o ponto e o saldo NO FIM daquele dia. Ja houve aqui
  // um ponto extra no comeco, com o saldo de agora: como o eixo x anda por
  // indice, dois pontos na mesma data viravam um degrau reto ocupando um
  // dia inteiro de largura no grafico, dizendo que nada acontecia.
  const serie = [];
  let piorDia = null;

  for (let i = 0; i <= dias; i++) {
    const d = F.somarDias(inicio, i);
    if (i > 0) {
      for (const ev of (porDia.get(d) || [])) {
        if (ev.tipo === 'entrada') { saldo += ev.valor; entradas += ev.valor; }
        else { saldo -= ev.valor; saidasFixas += ev.valor; }
      }
    }
    const variavel = i === 0 ? restoDeHoje : mediaDia;
    saldo -= variavel;
    saidasVariaveis += variavel;
    if (!piorDia || saldo < piorDia.saldo) piorDia = { data: d, saldo: arredondar(saldo) };
    serie.push({ data: d, saldo: arredondar(saldo), evento: (porDia.get(d) || [])[0] || null });
  }

  const zeraEm = serie.find((p) => p.saldo < 0);

  return {
    de: inicio,
    ate: fimIso,
    dias,
    saldoInicial: arredondar(inicial),
    saldoFinal: arredondar(saldo),
    entradas: arredondar(entradas),
    saidasFixas: arredondar(saidasFixas),
    saidasVariaveis: arredondar(saidasVariaveis),
    mediaDia: arredondar(mediaDia),

   mesma ordem: dia, semana, mes, ano. */
function horizontes(estado, ref) {
  const hoje = ref || F.hoje();
  return {
    dia: projetar(estado, hoje),
    semana: projetar(estado, F.somarDias(hoje, 6)),
    mes: projetar(estado, F.fimDoMes(hoje)),
    ano: projetar(estado, F.somarDias(hoje, 364)),
  };
}

/* ------------------------------------------------------------------ *
 * Quanto posso gastar hoje                                            *
 * ------------------------------------------------------------------ */

/* A pergunta que o app existe para responder.
 *
 *   (o que tenho + o que ainda entra − o que ainda sai de fixo − a reserva)
 *   ---------------------------------------------------------------------
 *                       dias ate o dinheiro ser reposto
 *
 * O divisor NAO e "dias que faltam no mes". Fosse assim, dia 28 o app
 * mandaria torrar tudo em quatro dias e no dia 2 a pessoa estaria no
 * vermelho esperando o salario do dia 5. O que importa e quantos dias
 * faltam ate a proxima entrada — o dinheiro na conta precisa durar ate la.
 * Quando a proxima entrada cai antes do fim do mes, vale o fim do mes: e o
 * horizonte mais longo dos dois que manda, para o teto nunca ser otimista.
 *
 * Nao entra media nenhuma nesta conta: media e para prever o futuro, e este
 * numero e um limite, nao uma previsao. */
function limiteDoDia(estado, ref) {
  const hoje = ref || F.hoje();
  const fimMes = F.fimDoMes(hoje);

  const adiante = ocorrencias(estado, F.somarDias(hoje, 1), F.somarDias(hoje, 70));
  const proxima = adiante.find((e) => e.tipo === 'entrada') || null;
  let ate = fimMes;
  if (proxima) {
    const vespera = F.somarDias(proxima.data, -1);
    if (vespera > ate) ate = vespera;
  }
  // Teto duro: uma entrada anual (13o, restituicao) nao pode esticar a
  // janela para meio ano e fazer o limite do dia virar trocado.
  if (F.diasEntre(hoje, ate) > 45) ate = F.somarDias(hoje, 45);

  const diasRestantes = Math.max(1, F.diasEntre(hoje, ate) + 1);
  const saldo = saldoEm(estado, hoje);
  const evs = ocorrencias(estado, F.somarDias(hoje, 1), ate);

  let entram = 0, saem = 0;
  for (const e of evs) {
    if (e.tipo === 'entrada') entram += e.valor; else saem += e.valor;
  }
  const reserva = Math.max(0, Number(estado.ajustes.reserva) || 0);
  const disponivel = saldo + entram - saem - reserva;
  const limite = disponivel / diasRestantes;
  const gasto = gastoVariavelDoDia(estado, hoje);

  return {
    dia: hoje,
    ate,
    limite: arredondar(limite),
    gasto,
    resta: arredondar(limite - gasto),
    disponivel: arredondar(disponivel),
    diasRestantes,
    saldo,
    entram: arredondar(entram),
    saem: arredondar(saem),
    reserva,
    proxima,
    apertado: limite <= 0,
  };
}

/* ------------------------------------------------------------------ *
 * Recortes para as telas e para os conselhos                          *
 * ------------------------------------------------------------------ */
function porCategoria(estado, de, ate, tipo) {
  const mapa = new Map();
  for (const l of estado.lancamentos) {
    if (l.data < de || l.data > ate) continue;
    if (tipo && l.tipo !== tipo) continue;
    const c = mapa.get(l.categoria) || { id: l.categoria, total: 0, n: 0 };
    c.total += l.valor; c.n += 1;
    mapa.set(l.categoria, c);
  }
  return [...mapa.values()]
    .map((c) => ({ ...c, total: arredondar(c.total), ...categoria(c.id) }))
    .sort((a, b) => b.total - a.total);
}

/* Quanto de fixo por mes — a conta que decide se a vida cabe no salario. */
function mensalFixo(estado) {
  let entra = 0, sai = 0;
  for (const f of estado.fixos) {
    if (!f.ativo) continue;
    const porMes = f.ciclo === 'mensal' ? f.valor
      : f.ciclo === 'semanal' ? f.valor * 52 / 12
        : f.valor * 365 / 12;
    if (f.tipo === 'entrada') entra += porMes; else sai += porMes;
  }
  return { entra: arredondar(entra), sai: arredondar(sai), sobra: arredondar(entra - sai) };
}

/* Sobra media do mes ja contando o gasto variavel observado. E o numero que
   diz se da para investir — e quanto. */
function sobraMensal(estado, ref) {
  const fixo = mensalFixo(estado);
  const mv = mediaVariavel(estado, ref || F.hoje());
  return {
    entra: fixo.entra,
    saiFixo: fixo.sai,
    saiVariavel: arredondar(mv.media * 30.4),
    sobra: arredondar(fixo.entra - fixo.sai - mv.media * 30.4),
    confianca: mv.confianca,
  };
}

/* ------------------------------------------------------------------ *
 * Render: simulacao de juros compostos                                *
 * ------------------------------------------------------------------ */

/* A taxa vem da pessoa, sempre. O app nao sabe quanto rende o CDI hoje e
   nao vai inventar: chutar 1% ao mes numa tela de dinheiro e mentira com
   cara de numero. Sem taxa informada, a simulacao nao aparece. */
function simularRendimento(aporteMensal, taxaAno, meses, inicial) {
  const a = Math.max(0, Number(aporteMensal) || 0);
  const t = Number(taxaAno);
  if (!Number.isFinite(t) || t <= 0) return null;
  const i = Math.pow(1 + t, 1 / 12) - 1;
  const n = Math.max(1, Math.round(meses));
  let saldo = Math.max(0, Number(inicial) || 0);
  const serie = [];
  for (let m = 1; m <= n; m++) {
    saldo = saldo * (1 + i) + a;
    serie.push({ mes: m, saldo: arredondar(saldo) });
  }
  const aportado = (Number(inicial) || 0) + a * n;
  return {
    taxaAno: t, taxaMes: i, meses: n,
    saldo: arredondar(saldo),
    aportado: arredondar(aportado),
    juros: arredondar(saldo - aportado),
    serie,
  };
}

/* Quitacao de divida pelo metodo avalanche: paga primeiro a de juro maior,
   que e o que economiza mais dinheiro (nao o que economiza mais tempo). */
function planoDividas(dividas, sobraMes) {
  const lista = (dividas || []).filter((d) => d.saldo > 0)
    .map((d) => ({ ...d }))
    .sort((a, b) => b.jurosMes - a.jurosMes);
  if (!lista.length) return null;

  const total = arredondar(lista.reduce((s, d) => s + d.saldo, 0));
  const jurosMes = arredondar(lista.reduce((s, d) => s + d.saldo * d.jurosMes, 0));
  const parcelas = arredondar(lista.reduce((s, d) => s + d.parcela, 0));
  const extra = Math.max(0, arredondar((Number(sobraMes) || 0)));

  // Quanto tempo para zerar pagando parcela + sobra, sempre jogando o extra
  // na de maior juro. Trava em 600 meses para nao girar para sempre quando
  // o pagamento nao cobre nem o juro.
  let meses = 0, jurosPagos = 0;
  const saldos = lista.map((d) => ({ ...d }));
  while (saldos.some((d) => d.saldo > 0.01) && meses < 600) {
    meses++;
    let disponivel = extra;
    for (const d of saldos) {
      if (d.saldo <= 0) continue;
      const j = d.saldo * d.jurosMes;
      jurosPagos += j;
      d.saldo += j;
      const pago = Math.min(d.saldo, d.parcela);
      d.saldo -= pago;
    }
    for (const d of saldos) {
      if (disponivel <= 0) break;
      if (d.saldo <= 0) continue;
      const pago = Math.min(d.saldo, disponivel);
      d.saldo -= pago; disponivel -= pago;
    }
  }

  return {
    total, jurosMes, parcelas,
    alvo: lista[0],
    ordem: lista,
    meses: meses >= 600 ? null : meses,
    jurosPagos: arredondar(jurosPagos),
    naoFecha: meses >= 600,
  };
}

  'de', 'do', 'da', 'dos', 'das', 'no', 'na', 'nos', 'nas', 'em', 'com', 'pra',
  'para', 'por', 'o', 'a', 'os', 'as', 'ao', 'aos', 'e', 'que', 'me', 'meu',
  'minha', 'foi', 'era', 'hoje', 'ontem', 'anteontem', 'agora', 'todo', 'toda',
  'todos', 'todas', 'cada', 'dia', 'dias', 'mes', 'meses', 'semana', 'semanas',
  'mensal', 'semanal', 'diario', 'diaria', 'la', 'ali', 'aqui', 'um', 'uma',
]));

function descricao(cru) {
  const palavras = String(cru || '').split(/\s+/).filter(Boolean);
  const mantidas = [];
  for (const p of palavras) {
    const s = Fv.semAcento(p).replace(/[^a-z0-9]/g, '');
    if (!s) continue;
    if (/\d/.test(s)) continue;
    if (SUPERFLUAS.has(s) || NUMEROS_FALADOS.has(s)) continue;
    mantidas.push(p.replace(/[.,;:!?]+$/, ''));
  }
  const d = mantidas.join(' ').trim();
  if (d.length < 2) return '';
  return d.charAt(0).toUpperCase() + d.slice(1);
}

function interpretar(texto, ctx) {
  const opcoes = ctx || {};
  const hoje = opcoes.hoje || Fv.hoje();
  const cru = String(texto == null ? '' : texto).trim();
  const t = limpar(cru);
  if (!t) return { tipo: 'nada', motivo: 'vazio', texto: cru };

  /* 1. Comandos. Vem primeiro porque sao curtos e nao podem ser confundidos
        com lancamento ("apaga o ultimo" nao tem valor, mas "cancela 50" tem). */
  if (/\b(desfaz|desfazer|apaga|apagar|cancela|cancelar|remove|remover)\b.*\b(ultimo|ultima|isso|esse|essa)\b/.test(t)
      || /^(desfazer|desfaz|apaga isso|cancela isso)$/.test(t)) {
    return { tipo: 'comando', comando: 'desfazer', texto: cru };
  }
  if (/\b(para de ouvir|pode parar|parar de ouvir|desliga o microfone|chega)\b/.test(t)) {
    return { tipo: 'comando', comando: 'parar', texto: cru };
  }

  /* 2. Informar saldo: "meu saldo e 2400", "tenho 2400 na conta". */
  const ehSaldo = /\b(meu )?saldo (e|eh|esta|de|hoje e)\b/.test(t)
    || /\b(tenho|tem|ficou|sobrou)\b.*\b(na conta|no banco|de saldo)\b/.test(t)
    || /\b(na conta|no banco) (tem|tenho|ha)\b/.test(t)
    || /\batualiza(r)? (o )?saldo\b/.test(t);
  if (ehSaldo) {
    const v = extrairValor(t).valor;
    if (v != null) return { tipo: 'saldo', valor: v, texto: cru };
    return { tipo: 'nada', motivo: 'saldo sem valor', texto: cru };
  }

  /* 3. Perguntas. Antes do lancamento: "quanto gastei com mercado" tem
        cara de lancamento e nao e. */
  const pergunta = classificarPergunta(t);
  if (pergunta) return Object.assign({ tipo: 'pergunta', texto: cru }, pergunta);

  /* 4. Lancamento (ou conta fixa, quando tem recorrencia). */
  const comData = extrairData(t, hoje);
  const comRec = extrairRecorrencia(comData.resto, hoje);
  const comValor = extrairValor(comRec.resto);
  if (comValor.valor == null) {
    return { tipo: 'nada', motivo: 'sem valor', texto: cru };
  }
  const achada = acharCategoria(comRec.resto);
  const cat = achada ? achada.cat : null;
  const tipo = acharTipo(t, cat);

  const base = {
    valor: comValor.valor,
    tipo,
    categoria: cat || (tipo === 'entrada' ? 'entrada' : 'outros'),
    descricao: descricao(cru),
    data: comData.data,
    origem: 'voz',
    certeza: achada ? 'alta' : 'media',
  };

  if (comRec.recorrencia) {
    return {
      tipo: 'fixo',
      fixo: Object.assign({
        nome: base.descricao || nomePadrao(base.categoria, tipo),
        valor: base.valor, tipo: base.tipo, categoria: base.categoria,
      }, comRec.recorrencia),
      texto: cru,
    };
  }

  return { tipo: 'lancamento', lancamento: base, texto: cru };
}

function nomePadrao(cat, tipo) {
  if (tipo === 'entrada') return 'Entrada';
  const nomes = {
    moradia: 'Moradia', contas: 'Conta de casa', assinatura: 'Assinatura',
    transporte: 'Transporte', saude: 'Saúde', educacao: 'Educação', divida: 'Dívida',
  };
  return nomes[cat] || 'Conta fixa';
}

function classificarPergunta(t) {
  // A ordem das palavras muda muito na fala — "quanto posso gastar",
  // "da pra gastar quanto", "sobra quanto pra hoje". Exigir a ordem exata
  // fazia o app responder "nao entendi" para a pergunta que ele mais existe
  // para responder. Basta o verbo no infinitivo mais uma marca de pergunta.
  if ((/\bgastar\b/.test(t) && /\b(quanto|posso|da pra|da para|sobra|resta|teto|limite)\b/.test(t))
      || /\bquanto (eu )?tenho (para|pra) hoje\b/.test(t)) {
    return { pergunta: 'limite' };
  }
  if (/\b(conselho|dica|sugest|o que (eu )?faco|como (eu )?economizo|como economizar|me ajuda|sair do (negativo|vermelho|buraco)|melhorar)\b/.test(t)) {
    return { pergunta: 'conselho' };
  }
  const gastei = t.match(/\bquanto\b.*\b(gastei|gasto|torrei|paguei)\b(?:.*\b(com|em|no|na|de)\b\s+([a-z0-9 ]+))?/);
  if (gastei) {
    const alvo = gastei[3] ? acharCategoria(gastei[3].trim()) : null;
    return {
      pergunta: 'gasto',
      categoria: alvo ? alvo.cat : null,
      periodo: /\bhoje\b/.test(t) ? 'dia' : /\bsemana\b/.test(t) ? 'semana'
        : /\bano\b/.test(t) ? 'ano' : 'mes',
    };
  }
  if (/\b(fim|final) do ano\b|\bno ano\b|\bem 12 meses\b|\bum ano\b/.test(t)) {
    return { pergunta: 'projecao', horizonte: 'ano' };
  }
  if (/\b(fim|final) do mes\b|\bfecho o mes\b|\bmes que vem\b|\bneste mes\b|\besse mes\b/.test(t)) {
    return { pergunta: 'projecao', horizonte: 'mes' };
  }
  if (/\bsemana\b/.test(t) && /\b(quanto|como|vou ter|termino|fecho)\b/.test(t)) {
    return { pergunta: 'projecao', horizonte: 'semana' };
  }
  if (/\b(qual|quanto).*(saldo)\b|\bquanto (eu )?tenho\b|\bquanto tem na conta\b/.test(t)) {
    return { pergunta: 'saldo' };
  }
  if (/\bcomo (eu )?(estou|to|ando)\b|\bresumo\b|\bsituacao\b|\bcomo (estao|estao as) (contas|financas)\b|\bme da (um )?resumo\b/.test(t)) {
    return { pergunta: 'resumo' };
  }
  if (/\b(estou|to)\b.*\b(negativo|vermelho|apertado|no buraco)\b/.test(t)) {
    return { pergunta: 'conselho' };
  }
  return null;
}

/* --------------------------------------------------------------- *
 * A escuta                                                         *
 * --------------------------------------------------------------- */

/* Cria o ouvinte. Tudo que vem de fora e injetavel (`motor`, `doc`, `win`)
   porque os testes precisam simular o celular bloqueando a tela — coisa que
   nenhum navegador de teste faz de verdade. */
function criarEscuta(op) {
  const o = op || {};
  const win = o.win || (typeof window !== 'undefined' ? window : null);
  const doc = o.doc || (typeof document !== 'undefined' ? document : null);
  const Motor = o.motor
    || (win && (win.SpeechRecognition || win.webkitSpeechRecognition)) || null;

  const SILENCIO_MS = o.silencioMs || 9000;   // sem falar nada, desliga
  const TETO_MS = o.tetoMs || 120000;         // teto duro de sessao

  let rec = null;
  let ligado = false;      // o microfone esta aberto agora?
  let desejado = false;    // voce pediu para ouvir?
  let motivoFim = '';
  let tSilencio = null, tTeto = null;

  const avisar = (estado, extra) => { if (o.onEstado) o.onEstado(estado, extra || {}); };

  function telaVisivel() {
    if (o.telaVisivel) return !!o.telaVisivel();
    if (!doc) return false;
    // `hidden` cobre tela bloqueada, app em segundo plano e aba trocada.
    return doc.visibilityState === 'visible' && !doc.hidden;
  }

  function disponivel() { return !!Motor; }

  function limparRelogios() {
    if (tSilencio) { clearTimeout(tSilencio); tSilencio = null; }
    if (tTeto) { clearTimeout(tTeto); tTeto = null; }
  }

  function armarSilencio() {
    if (tSilencio) clearTimeout(tSilencio);
    tSilencio = setTimeout(() => desligar('silencio'), SILENCIO_MS);
  }

  function ligar() {
    if (!disponivel()) { avisar('indisponivel'); return false; }
    if (ligado) return true;
    // A trava, no unico lugar que importa: a porta de entrada.
    if (!telaVisivel()) { avisar('bloqueado', { motivo: 'tela' }); return false; }

    rec = new Motor();
    rec.lang = o.idioma || 'pt-BR';
    /* Modo continuo DESLIGADO, de proposito.
     *
     * Com `continuous = true` o Chrome do Android acumula os resultados da
     * sessao inteira e reentrega os antigos a cada evento — e e dai que
     * saem os lancamentos repetidos. Desligado, cada sessao devolve UM
     * resultado final e acaba; a escuta continua porque o `onend` abaixo
     * reinicia sozinho enquanto voce quiser ouvir e a tela estiver acesa.
     * Para quem usa, nao muda nada: o microfone segue aberto. Muda que cada
     * frase chega uma vez. */
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    /* Uma fala, um lancamento.
     *
     * O motor do Android manda, a CADA evento, a lista INTEIRA de
     * resultados da sessao — e com `resultIndex` em zero, sem apontar para
     * o pedaco novo. Quem percorre a lista a partir desse indice processa
     * tudo de novo a cada palavra reconhecida: um "gastei 50 no uber" virou
     * quatro lancamentos de R$ 50 num celular de verdade.
     *
     * A saida e nao percorrer lista nenhuma. So o ULTIMO resultado
     * interessa: os anteriores, se ja eram finais, ja viraram lancamento no
     * evento em que apareceram. Isso vale para os dois tipos de motor — o
     * que empilha os resultados e o que manda so o novo.
     *
     * A frase repetida em menos de tres segundos e eco do reconhecimento,
     * nao um gasto novo: ninguem fala a mesma conta duas vezes nesse
     * intervalo. */
    let ultimaFrase = '', ultimaHora = 0;

    rec.onresult = (ev) => {
      armarSilencio();
      const r = ev.results[ev.results.length - 1];
      if (!r) return;
      const texto = ((r[0] && r[0].transcript) || '').trim();
      if (!texto) return;

      if (!r.isFinal) {
        if (o.onParcial) o.onParcial(texto);
        return;
      }

      const agora = Date.now();
      // Vale entre sessoes tambem: ao reiniciar, ha motor que reentrega o
      // final da sessao anterior.
      if (texto === ultimaFrase && agora - ultimaHora < 4000) return;
      ultimaFrase = texto;
      ultimaHora = agora;
      if (o.onTexto) o.onTexto(texto, { confianca: r[0] && r[0].confidence });
    };

    rec.onerror = (ev) => {
      const erro = (ev && ev.error) || 'desconhecido';
      // "no-speech" e "aborted" sao rotina, nao falha: nao vale assustar
      // ninguem com mensagem vermelha porque ficou dois segundos calado.
      if (erro === 'no-speech' || erro === 'aborted') return;
      motivoFim = erro;
      if (o.onErro) o.onErro(erro);
    };

    rec.onend = () => {
      ligado = false;
      limparRelogios();
      // O motor do celular encerra sozinho a cada frase. Se voce ainda quer
      // ouvir E a tela continua acesa, ele volta. Se a tela apagou, nao:
      // essa e a diferenca entre uma escuta continua e um microfone que
      // acorda no bolso.
      if (desejado && telaVisivel() && !motivoFim) {
        try { rec.start(); ligado = true; armarSilencio(); avisar('ouvindo'); return; } catch (e) { /* cai fora */ }
      }
      desejado = false;
      avisar('parado', { motivo: motivoFim || 'fim' });
      motivoFim = '';
    };

    try {
      rec.start();
    } catch (e) {
      avisar('parado', { motivo: 'falha ao iniciar' });
      return false;
    }
    ligado = true; desejado = true;
    armarSilencio();
    tTeto = setTimeout(() => desligar('teto'), TETO_MS);
    avisar('ouvindo');
    return true;
  }

  function desligar(motivo) {
    desejado = false;
    motivoFim = motivo || '';
    limparRelogios();
    if (rec && ligado) {
      try { rec.stop(); } catch (e) { try { rec.abort(); } catch (e2) { /* ja morreu */ } }
    }
    ligado = false;
    avisar('parado', { motivo: motivo || 'voce' });
  }

  function alternar() { return ligado ? (desligar('voce'), false) : ligar(); }

  /* As portas por onde a pagina sai da frente. Todas fecham o microfone. */
  function aoEsconder() { if (ligado) desligar('tela'); }

  if (doc && doc.addEventListener) {
    doc.addEventListener('visibilitychange', () => { if (!telaVisivel()) aoEsconder(); });
    doc.addEventListener('freeze', aoEsconder);
  }
  if (win && win.addEventListener) {
    win.addEventListener('pagehide', aoEsconder);
    win.addEventListener('blur', aoEsconder);
  }

  return {
    ligar, desligar, alternar, disponivel, telaVisivel,
    ligado: () => ligado,
    aoEsconder,   // exposto para os testes simularem a tela apagando
  };
}

/* Falar de volta. Util de verdade quando a pessoa esta dirigindo ou
   cozinhando — que e quando ela lembra do gasto e nao pode digitar. */
function falar(texto, ligado, win) {
  const w = win || (typeof window !== 'undefined' ? window : null);
  if (!ligado || !w || !w.speechSynthesis) return false;
  try {
    w.speechSynthesis.cancel();
    const f = new w.SpeechSynthesisUtterance(String(texto || ''));
    f.lang = 'pt-BR';
    f.rate = 1.05;
    const voz = (w.speechSynthesis.getVoices() || []).find((v) => /pt[-_]BR/i.test(v.lang));
    if (voz) f.voice = voz;
    w.speechSynthesis.speak(f);
    return true;
  } catch (e) { return false; }
}

const Voz = {
  interpretar, criarEscuta, falar, acharCategoria, extrairValor, extrairData,
  extrairRecorrencia, classificarPergunta, PALAVRAS,
};

if (typeof module !== 'undefined' && module.exports) module.exports = Voz;
else window.Voz = Voz;

})();

/* ==== conselhos.js ==== */
(function(){
/* Conselhos que nascem da conta, nao de frase pronta.
 *
 * Este arquivo e o "assessor" do app quando nao ha internet, chave de IA,
 * nem vontade de esperar. Cada conselho aqui e uma regra fechada sobre os
 * SEUS numeros, e todo conselho carrega a conta que o gerou — dizer
 * "corte no delivery" sem mostrar quanto e a mais e horoscopo.
 *
 * Tres coisas que ele nunca faz:
 *
 * - Nao inventa taxa de mercado. Se voce nao disser quanto rende a sua
 *   aplicacao, ele nao simula rendimento nenhum. Um numero chutado numa
 *   tela de dinheiro vira decisao errada.
 * - Nao recomenda produto, corretora, banco nem investimento especifico.
 *   Ele mostra quanto sobra e o que a sua propria taxa faria com isso.
 * - Nao da bronca. Gasto acima da media vira numero e caminho de volta,
 *   nao sermao.
 */

/* eslint-disable no-undef */
var Fc = (typeof require !== 'undefined' && typeof module !== 'undefined')
  ? require('./formato.js') : window.Formato;
var Nc = (typeof require !== 'undefined' && typeof module !== 'undefined')
  ? require('./nucleo.js') : window.Nucleo;

/* De onde da para cortar, e quanto de cada uma — porque nem todo gasto
   cede igual. Delivery e assinatura cedem quase tudo; mercado e transporte
   cedem alguma coisa (marca mais barata, menos desperdicio, uma carona),
   mas mandar cortar 40% da comida da casa nao e conselho, e desaforo.
   Aluguel, escola, saude e divida nao entram: nenhum deles se resolve
   apertando o mes, e sim renegociando — que e o que os outros conselhos
   dizem, cada um na sua vez. */
const CORTAVEIS = {
  comida: 0.4, lazer: 0.4, assinatura: 0.4, roupa: 0.4, presente: 0.4, outros: 0.4,
  mercado: 0.2, transporte: 0.2,
};

function pct(a, b) { return b > 0 ? a / b : 0; }

/* "1 mês" / "3 meses". Sem isto sai "3 mêses", que estraga a frase toda. */
function plural(n, um, muitos) { return Math.abs(n) === 1 ? um : muitos; }
function numero(n, casas) { return Number(n).toFixed(casas == null ? 1 : casas).replace('.', ','); }

/* ------------------------------------------------------------------ *
 * O plano para fechar um buraco                                       *
 * ------------------------------------------------------------------ */

/* Quanto falta e de onde tirar. Distribui o corte entre as categorias
   cortaveis na proporcao do que cada uma pesa, com teto de 40% em cada:
   plano que exige zerar uma categoria inteira nao e cumprido por ninguem. */
function planoDeCorte(estado, falta, ref) {
  const hoje = ref || Fc.hoje();
  const de = Fc.somarDias(hoje, -29);
  const gastos = Nc.porCategoria(estado, de, hoje, 'saida')
    .filter((c) => CORTAVEIS[c.id] && c.total > 0);
  if (!gastos.length || falta <= 0) return null;

  const disponivel = gastos.reduce((s, c) => s + c.total * CORTAVEIS[c.id], 0);
  const cobre = disponivel >= falta;
  // Quando o corte possivel passa do buraco, aperta so o quanto precisa —
  // um plano que tira mais do que falta some com a confianca de quem segue.
  const fator = Math.min(1, falta / Math.max(0.01, disponivel));
  const linhas = gastos.map((c) => {
    const corte = Nc.arredondar(c.total * CORTAVEIS[c.id] * fator);
    return {
      id: c.id, nome: c.nome, emoji: c.emoji,
      gasta: c.total, corte, fica: Nc.arredondar(c.total - corte),
      porcento: pct(corte, c.total), teto: CORTAVEIS[c.id],
    };
  }).filter((l) => l.corte >= 1);

  return {
    falta: Nc.arredondar(falta),
    cobre,
    total: Nc.arredondar(linhas.reduce((s, l) => s + l.corte, 0)),
    linhas,
    // O que sobra do buraco depois do corte possivel: e o numero que diz
    // se da para resolver so apertando, ou se precisa de renda extra ou de
    // renegociar uma conta fixa.
    restante: cobre ? 0 : Nc.arredondar(falta - disponivel),
  };
}

/* ------------------------------------------------------------------ *
 * Comparacao de categoria com o proprio historico                     *
 * ------------------------------------------------------------------ */
function fugiuDoNormal(estado, ref) {
  const hoje = ref || Fc.hoje();
  const inicioMes = hoje.slice(0, 8) + '01';
  const diaDoMes = Number(hoje.slice(8, 10));
  // Comparar no dia 2 do mes e ruido puro: um almoco caro vira "300% acima".
  if (diaDoMes < 5) return [];

  const primeiro = estado.lancamentos.length
    ? estado.lancamentos[estado.lancamentos.length - 1].data : hoje;
  const janelaIni = Fc.somarMeses(inicioMes, -3);
  const de = primeiro > janelaIni ? primeiro : janelaIni;
  const ate = Fc.somarDias(inicioMes, -1);
  const diasJanela = Fc.diasEntre(de, ate) + 1;
  // O "normal" precisa vir de historico de verdade. Dividir tres meses de
  // gaveta por tres quando so existe um mes de dados faz o app acusar
  // "acima do normal" em quem nao mudou nada — e ele perde a confianca da
  // pessoa logo na primeira semana de uso.
  if (diasJanela < 21) return [];

  const atual = Nc.porCategoria(estado, inicioMes, hoje, 'saida');
  const antes = Nc.porCategoria(estado, de, ate, 'saida');
  const mapaAntes = new Map(antes.map((c) => [c.id, c.total / diasJanela]));

  const fora = [];
  for (const c of atual) {
    const normalDia = mapaAntes.get(c.id);
    if (!normalDia || normalDia * 30.4 < 20) continue;
    const normalAteAgora = normalDia * diaDoMes;
    if (normalAteAgora <= 0) continue;
    const razao = c.total / normalAteAgora;
    if (razao >= 1.35 && c.total - normalAteAgora >= 30) {
      fora.push({
        id: c.id, nome: c.nome, emoji: c.emoji,
        gasto: c.total,
        normal: Nc.arredondar(normalAteAgora),
        aMais: Nc.arredondar(c.total - normalAteAgora),
        razao,
      });
    }
  }
  return fora.sort((a, b) => b.aMais - a.aMais);
}

/* ------------------------------------------------------------------ *
 * Os conselhos                                                        *
 * ------------------------------------------------------------------ */
function gerar(estado, ref) {
  const hoje = ref || Fc.hoje();
  const cartas = [];
  const limite = Nc.limiteDoDia(estado, hoje);
  const mes = Nc.projetar(estado, Fc.fimDoMes(hoje), { de: hoje });
  const ano = Nc.projetar(estado, Fc.somarDias(hoje, 364), { de: hoje });
  const fixo = Nc.mensalFixo(estado);
  const sobra = Nc.sobraMensal(estado, hoje);
  const mv = Nc.mediaVariavel(estado, hoje);
  const reservaAlvo = Nc.arredondar(fixo.sai * (Number(estado.ajustes.reservaMeses) || 3));

  const por = (id, tom, titulo, texto, extra) => cartas.push(
    Object.assign({ id, tom, titulo, texto }, extra || {}),
  );

  /* 1. Pouco historico: qualquer conselho aqui seria chute. */
  if (mv.confianca === 'baixa' && estado.lancamentos.length < 5) {
    por('comeco', 'neutro', 'Me conte os gastos de alguns dias',
      'Com uns 7 dias de lançamentos eu já consigo projetar o mês com alguma '
      + 'firmeza. Por enquanto o que eu mostrar é chute — e chute em conta de '
      + 'dinheiro não ajuda ninguém.');
  }

  /* 2. O buraco: a conta mais importante da tela. */
  if (mes.zeraEm) {
    const falta = Math.abs(Math.min(0, mes.saldoFinal)) + (Number(estado.ajustes.reserva) || 0);
    const plano = planoDeCorte(estado, Math.max(falta, 1), hoje);
    por('negativo', 'alerta', 'Do jeito que está, o saldo zera dia ' + Fc.dataCurta(mes.zeraEm),
      'No ritmo atual — contas fixas nas datas delas e ' + Fc.dinheiro(mes.mediaDia)
      + ' por dia de gasto variável — o dinheiro acaba antes do fim do mês. '
      + 'Faltam ' + Fc.dinheiro(Math.max(falta, 0)) + ' para chegar no dia '
      + Fc.dataCurta(Fc.fimDoMes(hoje)) + '.',
      { plano, valor: Math.max(falta, 0), quando: mes.zeraEm });
  } else if (mes.saldoFinal < reservaAlvo * 0.2 && fixo.sai > 0) {
    por('raspando', 'atencao', 'O mês fecha raspando',
      'A projeção termina em ' + Fc.dinheiro(mes.saldoFinal) + '. Dá, mas não sobra '
      + 'margem para imprevisto — e imprevisto é a única coisa garantida.');
  }

  /* 3. O teto do dia. Duas conversas diferentes: passou do teto (acontece,
        o mes se recompoe) ou nao ha teto nenhum (o mes ja esta comprometido). */
  if (limite.apertado && !mes.zeraEm) {
    por('sem-teto', 'alerta', 'Não sobra teto para hoje',
      'O que está na conta mais o que ainda entra não cobre as contas fixas que '
      + 'faltam até dia ' + Fc.dataCurta(Fc.fimDoMes(hoje)) + '. Enquanto isso não '
      + 'mudar, qualquer gasto novo entra no vermelho — o caminho é adiar ou '
      + 'renegociar o que é fixo, não cortar o dia a dia.',
      { valor: limite.disponivel });
  } else if (limite.resta < 0) {
    const amanha = Nc.arredondar((limite.disponivel - limite.gasto)
      / Math.max(1, limite.diasRestantes - 1));
    por('limite', 'atencao', 'Hoje já passou do limite',
      'O teto de hoje era ' + Fc.dinheiro(limite.limite) + ' e já saíram '
      + Fc.dinheiro(limite.gasto) + '. Não é o fim do mundo: '
      + (amanha > 0
        ? 'de amanhã até o fim do mês o teto passa a ser ' + Fc.dinheiro(amanha)
          + ' por dia e a conta se recompõe.'
        : 'mas a partir de amanhã não sobra mais teto nenhum no mês.'),
      { valor: Math.abs(limite.resta) });
  }

  /* 4. Peso do fixo. Acima de 60% da renda, o problema nao e o cafezinho. */
  if (fixo.entra > 0) {
    const peso = pct(fixo.sai, fixo.entra);
    if (peso >= 0.6) {
      const maiores = estado.fixos.filter((f) => f.ativo && f.tipo === 'saida')
        .sort((a, b) => b.valor - a.valor).slice(0, 3);
      por('fixo-alto', peso >= 0.8 ? 'alerta' : 'atencao',
        'Suas contas fixas comem ' + Fc.porcento(peso) + ' do que entra',
        'Sobram ' + Fc.dinheiro(fixo.entra - fixo.sai) + ' por mês para tudo o mais. '
        + 'Quando o fixo passa de 60%, cortar gasto do dia a dia não resolve: o que '
        + 'muda o jogo é renegociar as três maiores — '
        + maiores.map((f) => f.nome + ' (' + Fc.dinheiro(f.valor) + ')').join(', ') + '.',
        { valor: fixo.sai, peso });
    }
  }

  /* 5. Assinatura: o gasto que ninguem lembra de ter. */
  const assinaturas = estado.fixos.filter((f) => f.ativo && f.tipo === 'saida' && f.categoria === 'assinatura');
  if (assinaturas.length >= 2) {
    const mesTotal = assinaturas.reduce((s, f) => s + (f.ciclo === 'mensal' ? f.valor : f.valor * 4.3), 0);
    por('assinaturas', 'neutro', assinaturas.length + ' assinaturas: '
      + Fc.dinheiro(mesTotal) + ' por mês',
      'Dá ' + Fc.dinheiro(mesTotal * 12) + ' no ano. É o corte mais fácil que existe, '
      + 'porque não muda nada na sua rotina: só some o que você não abre há semanas.',
      { valor: Nc.arredondar(mesTotal), itens: assinaturas.map((f) => f.nome) });
  }

  /* 6. Categoria que fugiu do proprio normal. */
  for (const f of fugiuDoNormal(estado, hoje).slice(0, 2)) {
    por('fuga-' + f.id, 'atencao', f.emoji + ' ' + f.nome + ' está '
      + Fc.porcento(f.razao - 1) + ' acima do seu normal',
      'Você já gastou ' + Fc.dinheiro(f.gasto) + ' este mês; no mesmo ponto dos '
      + 'últimos três meses estaria em ' + Fc.dinheiro(f.normal) + '. São '
      + Fc.dinheiro(f.aMais) + ' a mais — e o mês ainda não acabou.',
      { valor: f.aMais, categoria: f.id });
  }

  /* 7. Dividas: o juro que corre enquanto voce dorme. */
  const plano = Nc.planoDividas(estado.dividas, Math.max(0, sobra.sobra));
  if (plano) {
    const taxa = Number(estado.ajustes.taxaAno);
    let comparacao = '';
    if (Number.isFinite(taxa) && taxa > 0) {
      const rendeMes = Math.pow(1 + taxa, 1 / 12) - 1;
      if (plano.alvo.jurosMes > rendeMes) {
        comparacao = ' Sua dívida mais cara cobre ' + Fc.porcento(plano.alvo.jurosMes, 1)
          + ' ao mês e sua aplicação rende ' + Fc.porcento(rendeMes, 2)
          + ': cada real que você usar para quitar rende mais que investir.';
      }
    }
    por('dividas', plano.jurosMes > 0 ? 'alerta' : 'neutro',
      'Você paga ' + Fc.dinheiro(plano.jurosMes) + ' de juros por mês',
      'São ' + Fc.dinheiro(plano.total) + ' de dívida. Comece pela de juro maior — '
      + plano.alvo.nome + ', ' + Fc.porcento(plano.alvo.jurosMes, 1) + ' ao mês — e só '
      + 'depois passe para a seguinte: essa ordem é a que economiza mais dinheiro.'
      + (plano.meses ? ' No ritmo atual ela zera em ' + plano.meses + ' meses.'
        : ' Atenção: no pagamento atual essa dívida não fecha — a parcela não cobre o juro.')
      + comparacao,
      { valor: plano.jurosMes, plano });
  }

  /* 8. Reserva antes de render. Nesta ordem, sempre — e so quando o mes
        fecha de pe: mandar guardar dinheiro para quem vai furar o saldo dia
        20 e conselho que ninguem consegue seguir. */
  const saldoAgora = Nc.saldoEm(estado, hoje);
  if (sobra.sobra > 0 && !mes.zeraEm) {
    if (saldoAgora <= 0) {
      por('conta-negativa', 'alerta', 'A conta está negativa hoje',
        'Sobram ' + Fc.dinheiro(sobra.sobra) + ' por mês no seu ritmo atual, então '
        + 'a saída existe: ' + Math.ceil(Math.abs(saldoAgora) / sobra.sobra) + ' '
        + plural(Math.ceil(Math.abs(saldoAgora) / sobra.sobra), 'mês', 'meses')
        + ' nesse ritmo devolvem a conta ao zero. Antes disso, juro de cheque '
        + 'especial é a despesa mais cara que existe: vale priorizar.',
        { valor: Math.abs(saldoAgora) });
    } else if (reservaAlvo > 0 && saldoAgora < reservaAlvo) {
      const cobre = fixo.sai > 0 ? saldoAgora / fixo.sai : 0;
      const faltam = Nc.arredondar(reservaAlvo - saldoAgora);
      const meses = Math.ceil(faltam / Math.max(1, sobra.sobra));
      por('reserva', 'acao', 'Sua reserva cobre ' + numero(cobre) + ' '
        + plural(Math.round(cobre * 10) / 10, 'mês', 'meses') + ' de contas',
        'A meta são ' + estado.ajustes.reservaMeses + ' meses ('
        + Fc.dinheiro(reservaAlvo) + '). Faltam ' + Fc.dinheiro(faltam) + '. '
        + 'Guardando a sobra de ' + Fc.dinheiro(sobra.sobra) + ' por mês, você chega lá em '
        + meses + ' ' + plural(meses, 'mês', 'meses') + '. Reserva vem antes de '
        + 'investimento: é ela que impede que o próximo imprevisto vire dívida de cartão.',
        { valor: faltam, meses });
    } else {
      /* 9. Render. So com taxa informada por voce. */
      const taxa = Number(estado.ajustes.taxaAno);
      if (Number.isFinite(taxa) && taxa > 0) {
        const s12 = Nc.simularRendimento(sobra.sobra, taxa, 12, 0);
        const s60 = Nc.simularRendimento(sobra.sobra, taxa, 60, 0);
        por('render', 'acao', 'Sobram ' + Fc.dinheiro(sobra.sobra) + ' por mês para render',
          'Aplicando essa sobra a ' + Fc.porcento(taxa, 1) + ' ao ano — a taxa que você '
          + 'informou —, em 12 meses viram ' + Fc.dinheiro(s12.saldo) + ' ('
          + Fc.dinheiro(s12.juros) + ' de juros) e em 5 anos, ' + Fc.dinheiro(s60.saldo)
          + '. O mesmo dinheiro parado na conta corrente não faz nada disso.',
          { valor: sobra.sobra, simulacao: s12 });
      } else {
        por('taxa', 'acao', 'Sobram ' + Fc.dinheiro(sobra.sobra) + ' por mês parados',
          'Me diga em Ajustes quanto a sua aplicação rende por ano e eu simulo o que '
          + 'essa sobra vira em 1, 5 e 10 anos. Eu não chuto essa taxa: ela muda toda '
          + 'semana e um número errado aqui vira decisão errada aí.',
          { valor: sobra.sobra, pedeTaxa: true });
      }
    }
  }

  /* 10. O ano, para quem so olha o mes. */
  if (estado.lancamentos.length >= 5 && mv.confianca !== 'baixa') {
    por('ano', ano.saldoFinal >= 0 ? 'bom' : 'atencao',
      'Em 12 meses, no ritmo de hoje: ' + Fc.dinheiro(ano.saldoFinal),
      'Isso mantendo tudo como está — as mesmas contas fixas e '
      + Fc.dinheiro(ano.mediaDia) + ' por dia de gasto variável. '
      + (ano.saldoFinal >= 0
        ? 'Cada real cortado por dia hoje vale ' + Fc.dinheiro(365)
          + ' no fim dessa conta.'
        : 'A conta não fecha no ano. Vale mexer no que é fixo, não no cafezinho.'),
      { valor: ano.saldoFinal });
  }

  const ordem = { alerta: 0, atencao: 1, acao: 2, neutro: 3, bom: 4 };
  return cartas.sort((a, b) => ordem[a.tom] - ordem[b.tom]);
}

/* ------------------------------------------------------------------ *
 * O retrato que vai para a IA                                         *
 * ------------------------------------------------------------------ */

/* So numero e nome de categoria. Nao vai descricao de lancamento (que e
   texto livre e pode ter nome de gente), nem data de nada. O suficiente
   para um conselho bom, e nada alem disso. */
function retrato(estado, ref) {
  const hoje = ref || Fc.hoje();
  const fixo = Nc.mensalFixo(estado);
  const mv = Nc.mediaVariavel(estado, hoje);
  const mes = Nc.projetar(estado, Fc.fimDoMes(hoje), { de: hoje });
  const ano = Nc.projetar(estado, Fc.somarDias(hoje, 364), { de: hoje });
  const limite = Nc.limiteDoDia(estado, hoje);
  const cats = Nc.porCategoria(estado, Fc.somarDias(hoje, -29), hoje, 'saida')
    .slice(0, 8).map((c) => ({ categoria: c.nome, total: c.total }));

  return {
    saldo: Nc.saldoEm(estado, hoje),
    entra_mes: fixo.entra,
    fixo_mes: fixo.sai,
    media_dia_variavel: mv.media,
    dias_de_historico: mv.dias,
    confianca: mv.confianca,
    limite_do_dia: limite.limite,
    projecao_fim_do_mes: mes.saldoFinal,
    projecao_12_meses: ano.saldoFinal,
    zera_em: mes.zeraEm ? Fc.diasEntre(hoje, mes.zeraEm) : null,
    gastos_30_dias: cats,
    contas_fixas: estado.fixos.filter((f) => f.ativo)
      .map((f) => ({ nome: f.nome, valor: f.valor, tipo: f.tipo, ciclo: f.ciclo })),
    dividas: estado.dividas.map((d) => ({
      nome: d.nome, saldo: d.saldo, juros_mes: d.jurosMes, parcela: d.parcela,
    })),
    reserva_meta_meses: estado.ajustes.reservaMeses,
    taxa_ano_informada: estado.ajustes.taxaAno,
  };
}

const Conselhos = { gerar, planoDeCorte, fugiuDoNormal, retrato, CORTAVEIS };

if (typeof module !== 'undefined' && module.exports) module.exports = Conselhos;
else window.Conselhos = Conselhos;

  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

  el.className = 'toast' + (tom ? ' ' + tom : '');

  el.innerHTML = '<div class="txt"><b>' + esc(titulo) + '</b>'
