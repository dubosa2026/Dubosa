<title>Bússola — assessor financeiro de bolso</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 800;font-display:swap;
src:url(data:font/woff2;base64,__ARCHIVO__) format('woff2');}
@font-face{font-family:'PlexSans';font-style:normal;font-weight:400 600;font-display:swap;
src:url(data:font/woff2;base64,__PLEXSANS__) format('woff2');}
@font-face{font-family:'PlexMono';font-style:normal;font-weight:400;font-display:swap;
src:url(data:font/woff2;base64,__PLEXMONO400__) format('woff2');}
@font-face{font-family:'PlexMono';font-style:normal;font-weight:600;font-display:swap;
src:url(data:font/woff2;base64,__PLEXMONO600__) format('woff2');}

/* Um app de celular, nao um site que encolheu. Tudo aqui parte do polegar:
   o que se toca fica embaixo, o que se le fica em cima, e nada depende de
   passar o mouse por cima porque nao existe mouse. */
:root{
  --bg:#0A0A0B; --panel:#131316; --panel-2:#1A1A1E; --panel-3:#232329;
  --line:#2A2A31; --line-2:#3A3A43;
  --text:#F4F4F1; --text-2:#9E9EA0; --text-3:#6B6B70;
  --y:#FFC72C; --y-hi:#FFD966; --y-dim:#8A6A12; --y-wash:#241D07;
  --ok:#42C98B; --ok-wash:#0F2A1E;
  --no:#FF6B6B; --no-wash:#2C1414;
  --at:#FFA24C; --at-wash:#2A1C0D;
  --ia:#7FB2FF; --ia-wash:#111A2B;
  --radius:14px;
  --ui:'PlexSans',system-ui,-apple-system,sans-serif;
  --dp:'Archivo',system-ui,sans-serif;
  --mono:'PlexMono',ui-monospace,Menlo,monospace;
  --safe:env(safe-area-inset-bottom,0px);
  --nav:calc(62px + var(--safe));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
::selection{background:var(--y);color:#000;}
.mono{font-family:var(--mono);}
.tnum{font-variant-numeric:tabular-nums;}
[hidden]{display:none !important;}

/* O app inteiro cabe numa coluna de celular. No computador ele nao estica:
   fica no meio, do tamanho de um telefone, porque foi para o telefone que
   ele foi desenhado — esticar so faria a tela mentir sobre o uso real. */
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);position:relative;}
@media(min-width:560px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);}
}

/* ---------------- topo ---------------- */
.topo{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  display:flex;align-items:center;gap:10px;}
.marca{display:flex;align-items:center;gap:9px;min-width:0;}
.marca svg{display:block;flex:none;}
.nome{font-family:var(--dp);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1;}
.nome span{color:var(--y);}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px;}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:5px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--text-2);
  background:var(--panel-2);white-space:nowrap;}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-wash);}
.chip.no{border-color:var(--no);color:var(--no);background:var(--no-wash);}
.icone-btn{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--text-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  cursor:pointer;flex:none;}
.icone-btn:active{background:var(--panel-3);}

/* ---------------- conteudo ---------------- */
main{flex:1;padding:16px 16px calc(var(--nav) + 26px);}
.pane{animation:entra .18s ease-out;}
@keyframes entra{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

h2{font-family:var(--dp);font-weight:700;font-size:1.28rem;letter-spacing:-.02em;margin:0 0 4px;}
h3{font-family:var(--dp);font-weight:600;font-size:1rem;margin:0 0 3px;}
.sub{color:var(--text-2);margin:0 0 16px;font-size:.9rem;}
.kicker{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);margin:0 0 8px;}
.secao{margin:26px 0 10px;display:flex;align-items:baseline;gap:8px;}
.secao h3{margin:0;}
.mais{font-size:.82rem;color:var(--y);cursor:pointer;background:none;border:0;padding:2px 0;
  font-family:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;}
.secao .mais{margin-left:auto;text-decoration:none;}

.cartao{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.cartao.destaque{background:linear-gradient(160deg,var(--panel-2),var(--panel));border-color:var(--line-2);}

/* O numero do dia. E a unica coisa que a pessoa abre o app para ver, entao
   e a unica coisa grande da tela. */
.hero{text-align:center;padding:22px 16px 18px;}
.hero .rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-3);}
.hero .valor{font-family:var(--dp);font-weight:800;font-size:clamp(2.6rem,13vw,3.4rem);
  letter-spacing:-.04em;line-height:1.02;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
.hero .valor.bom{color:var(--y);}
.hero .valor.ruim{color:var(--no);}
.hero .apoio{color:var(--text-2);font-size:.88rem;}
.barra{height:7px;border-radius:99px;background:var(--panel-3);margin:14px 0 8px;overflow:hidden;}
.barra i{display:block;height:100%;background:var(--y);border-radius:99px;transition:width .3s;}
.barra i.estourou{background:var(--no);}

.linhas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 10px;text-align:center;}
.mini b{display:block;font-family:var(--dp);font-size:1rem;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;}
.mini small{display:block;color:var(--text-3);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.07em;font-family:var(--mono);margin-top:3px;line-height:1.3;}
.mini.bom b{color:var(--ok);} .mini.ruim b{color:var(--no);}

/* ---------------- lista de lancamentos ---------------- */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.item .ico{width:38px;height:38px;border-radius:11px;background:var(--panel-2);display:grid;
  place-items:center;font-size:17px;flex:none;border:1px solid var(--line);}
.item .txt{min-width:0;flex:1;}
.item .txt b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.item .txt small{color:var(--text-3);font-size:.76rem;}
.item .val{font-family:var(--dp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.item .val.entrada{color:var(--ok);}
.item .apagar{appearance:none;background:none;border:0;color:var(--text-3);padding:8px;cursor:pointer;font-size:15px;}
.vazio{color:var(--text-3);text-align:center;padding:24px 10px;font-size:.9rem;}

/* ---------------- botoes ---------------- */
.btn{appearance:none;cursor:pointer;border-radius:11px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);font-size:.92rem;font-weight:500;
  padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;transition:background .14s,transform .06s;}
.btn:active:not(:disabled){transform:translateY(1px);background:var(--panel-3);}
.btn:disabled{opacity:.45;}
.btn.pri{background:var(--y);color:#0A0A0B;border-color:var(--y);font-weight:700;}
.btn.ia{background:var(--ia-wash);border-color:var(--ia);color:var(--ia);font-weight:600;}
.btn.perigo{border-color:var(--no);color:var(--no);background:transparent;}
.btn.bloco{width:100%;}
.btn.peq{min-height:38px;padding:8px 12px;font-size:.84rem;border-radius:9px;}
.btn-linha{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------------- formularios ---------------- */
label{display:block;font-size:.76rem;color:var(--text-2);margin:0 0 5px;
  font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:11px;padding:12px 13px;min-height:46px;}
input:focus,select:focus{outline:2px solid var(--y);outline-offset:1px;border-color:var(--y);}
.campo{margin-bottom:12px;}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ajuda{font-size:.78rem;color:var(--text-3);margin:6px 0 0;line-height:1.45;}
.troca{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.troca:last-child{border-bottom:0;}
.troca .txt{flex:1;min-width:0;}
.troca .txt b{display:block;font-size:.94rem;font-weight:600;}
.troca .txt small{color:var(--text-3);font-size:.78rem;}
.switch{position:relative;width:50px;height:29px;flex:none;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.switch i{position:absolute;inset:0;background:var(--panel-3);border-radius:99px;
  border:1px solid var(--line-2);transition:background .18s;}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--text-3);transition:transform .18s,background .18s;}
.switch input:checked + i{background:var(--y-wash);border-color:var(--y);}
.switch input:checked + i::after{transform:translateX(21px);background:var(--y);}

/* ---------------- abas + microfone ---------------- */
.abas{position:fixed;bottom:0;left:0;right:0;z-index:35;display:flex;
  background:rgba(10,10,11,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe);max-width:520px;margin:0 auto;}
.aba{flex:1;appearance:none;background:none;border:0;color:var(--text-3);cursor:pointer;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.66rem;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
.aba svg{display:block;}
.aba[aria-selected="true"]{color:var(--y);}
.aba .ponto{position:absolute;top:6px;margin-left:18px;width:6px;height:6px;border-radius:50%;background:var(--no);}

/* O microfone e o centro da barra, levantado. Ele ficava flutuando por
   cima da lista e escondia justamente o valor que a pessoa queria ler —
   dentro da barra ele continua no alcance do polegar e nao tapa nada. */
.mic-slot{width:78px;flex:none;display:flex;justify-content:center;align-items:flex-start;}
.mic{appearance:none;width:56px;height:56px;border-radius:50%;cursor:pointer;margin-top:-19px;
  border:4px solid var(--bg);background:var(--panel-3);color:var(--text);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.6);transition:transform .12s;}
.mic:active{transform:scale(.93);}
.mic[data-estado="ouvindo"]{background:var(--y);color:#0A0A0B;animation:pulso 1.5s ease-in-out infinite;}
.mic[data-estado="indisponivel"]{opacity:.45;}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,199,44,.45),0 6px 18px rgba(0,0,0,.6);}
  55%{box-shadow:0 0 0 13px rgba(255,199,44,0),0 6px 18px rgba(0,0,0,.6);}}

/* O que o microfone ouviu aparece logo acima da barra, onde o olho ja esta. */
.mic-fala{position:fixed;left:14px;right:14px;bottom:calc(var(--nav) + 14px);z-index:37;
  max-width:492px;margin:0 auto;background:rgba(19,19,22,.97);border:1px solid var(--line-2);
  border-radius:13px;padding:10px 14px;font-size:.86rem;color:var(--text-2);text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.55);}
.mic-fala b{color:var(--text);font-weight:600;}

/* ---------------- avisos ---------------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 72px);z-index:60;
  max-width:496px;margin:0 auto;background:var(--panel-3);border:1px solid var(--line-2);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);animation:sobe .2s ease-out;}
@keyframes sobe{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.toast .txt{flex:1;font-size:.88rem;min-width:0;}
.toast .txt b{display:block;font-weight:600;}
.toast .txt small{color:var(--text-2);}
.toast.bom{border-color:var(--ok);} .toast.ruim{border-color:var(--no);}
.toast button{appearance:none;background:none;border:1px solid var(--line-2);color:var(--y);
  border-radius:9px;padding:8px 11px;font-size:.82rem;cursor:pointer;font-weight:600;flex:none;}

/* ---------------- conselhos ---------------- */
.conselho{border-left:3px solid var(--line-2);}
.conselho.alerta{border-left-color:var(--no);background:linear-gradient(90deg,var(--no-wash),var(--panel) 55%);}
.conselho.atencao{border-left-color:var(--at);background:linear-gradient(90deg,var(--at-wash),var(--panel) 55%);}
.conselho.acao{border-left-color:var(--y);}
.conselho.bom{border-left-color:var(--ok);}
.conselho.ia{border-left-color:var(--ia);background:linear-gradient(90deg,var(--ia-wash),var(--panel) 60%);}
.conselho h3{margin-bottom:6px;}
.conselho p{margin:0;font-size:.9rem;color:var(--text-2);line-height:1.55;}
.conselho .selo{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);display:block;margin-bottom:7px;}
.corte{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;}
.corte-linha{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.86rem;}
.corte-linha .n{flex:1;}
.corte-linha .de{color:var(--text-3);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.corte-linha .pra{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums;}

/* ---------------- projecoes ---------------- */
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:16px;}
.seg button{flex:1;appearance:none;background:none;border:0;color:var(--text-3);cursor:pointer;
  padding:9px 4px;border-radius:8px;font-size:.84rem;font-weight:600;}
.seg button[aria-selected="true"]{background:var(--y);color:#0A0A0B;}
.grafico{width:100%;height:132px;display:block;margin:6px 0 2px;overflow:visible;}
.grafico .zero{stroke:var(--no);stroke-width:1;stroke-dasharray:3 3;opacity:.6;}
.grafico .hoje{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 4;}
.grafico .linha{fill:none;stroke:var(--y);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
.grafico .area{fill:url(#gY);opacity:.5;}
.grafico .neg{stroke:var(--no);}
.grafico .marca-neg{fill:var(--no);}
.eixo{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--text-3);margin-top:2px;}
.conta-fila{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);
  font-size:.88rem;}
.conta-fila:last-child{border-bottom:0;}
.conta-fila .dia{font-family:var(--mono);font-size:.76rem;color:var(--text-3);width:44px;flex:none;}
.conta-fila .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conta-fila .v{font-variant-numeric:tabular-nums;font-weight:600;}
.conta-fila .v.entrada{color:var(--ok);}

/* ---------------- trava ---------------- */
.trava{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px;}
.trava .pontos{display:flex;gap:12px;}
.trava .pontos i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line-2);}
.trava .pontos i.cheio{background:var(--y);border-color:var(--y);}
.teclado{display:grid;grid-template-columns:repeat(3,74px);gap:12px;}
.teclado button{appearance:none;height:64px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--panel-2);font-family:var(--dp);font-size:1.4rem;font-weight:600;cursor:pointer;}
.teclado button:active{background:var(--panel-3);}
.teclado button.vazio{border:0;background:none;}

.rodape{color:var(--text-3);font-size:.76rem;text-align:center;padding:26px 10px 4px;line-height:1.6;}
</style>
<div class="app">
  <header class="topo">
    <div class="marca">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="#3A3A43" stroke-width="2"/>
        <path d="M21.5 10.5 L13 13 L10.5 21.5 L19 19 Z" fill="#FFC72C"/>
        <circle cx="16" cy="16" r="1.9" fill="#0A0A0B"/>
      </svg>
      <div class="nome">Bús<span>sola</span></div>
    </div>
    <div class="topo-dir">
      <span class="chip" id="chipSaldo">R$ 0,00</span>
      <button class="icone-btn" id="btnTrancar" title="Trancar o app" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="pane" id="pane-hoje"></section>
    <section class="pane" id="pane-futuro" hidden></section>
    <section class="pane" id="pane-conselhos" hidden></section>
    <section class="pane" id="pane-ajustes" hidden></section>
  </main>

  <div class="mic-fala" id="micFala" hidden></div>

  <nav class="abas" role="tablist">
    <button class="aba" role="tab" data-pane="hoje" aria-selected="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoje</button>
    <button class="aba" role="tab" data-pane="futuro" aria-selected="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M15 6h4v4"/></svg>Futuro</button>
    <div class="mic-slot">
      <button class="mic" id="mic" data-estado="parado" aria-label="Falar um gasto ou uma pergunta">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
        </svg>
      </button>
    </div>
    <button class="aba" role="tab" data-pane="conselhos" aria-selected="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M9 18h6"/><path d="M10 21h4"/>
        <path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .9 1.6h5.4c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg>Conselhos</button>
    <button class="aba" role="tab" data-pane="ajustes" aria-selected="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>Ajustes</button>
  </nav>
</div>

<div class="trava" id="trava" hidden>
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="1.7">
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
  </svg>
  <div id="travaAviso" style="color:var(--text-2);font-size:.9rem;text-align:center">Digite seu PIN</div>
  <div class="pontos" id="travaPontos"></div>
  <div class="teclado" id="travaTeclado"></div>
</div>
