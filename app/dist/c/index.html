  function trocarTipo(novo) {
    if (tipo === novo) return;
    tipo = novo;
    var botoes = document.querySelectorAll('[data-rttipo]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].setAttribute('aria-pressed',
        botoes[i].getAttribute('data-rttipo') === novo ? 'true' : 'false');
    }
    desenharCards();
  }

  /* ---------- anotacoes ----------
     O painel nao guarda nada: pede tudo ao dono (carteira.js), que fala com
     o servidor. Aqui so existe o desenho e o que o vendedor digitou. */

  var ponte = {};   // funcoes injetadas por carteira.js

  function hojeBR() {
    var h = new Date();
    return String(h.getDate()).padStart(2, '0') + '/' +
           String(h.getMonth() + 1).padStart(2, '0') + '/' + h.getFullYear();
  }

  function trocarAba(qual) {
    var abas = document.querySelectorAll('[data-rtaba]');
    for (var k = 0; k < abas.length; k++) {
      abas[k].setAttribute('aria-selected',
        abas[k].getAttribute('data-rtaba') === qual ? 'true' : 'false');
    }
    document.getElementById('rtAbrir').hidden = qual !== 'abrir';
    document.getElementById('rtObj').hidden = qual !== 'obj';
    document.getElementById('rtNotas').hidden = qual !== 'notas';
    document.getElementById('rtAgenda').hidden = qual !== 'agenda';

    /* Nas anotacoes o cartao do cliente sai de cena. Nas outras abas ele
       serve -- a fala usa a cidade, a ultima compra, o faturado. Aqui nao:
       enquanto nao houver anotacao escrita, este espaco fica em branco, sem
       nenhum dado da lista de distribuicao. */
    var cartao = document.getElementById('rtEscolhido');
    if (cartao) cartao.hidden = qual === 'notas';
  }

  /* A aba fica sempre no cabecalho. O numero ao lado e o do cliente
     escolhido quando ha um; sem cliente, e quantos clientes ja tem
     anotacao. Zero nao mostra numero nenhum. */
  function contarNotas() {
    var t = document.getElementById('rtTabNotas');
    if (!t) return;
    var n = (atual && atual.cliente && ponte.notasDe)
      ? ponte.notasDe(atual.cliente).length
      : (ponte.notasTodas ? ponte.notasTodas().length : 0);
    t.innerHTML = 'Anotações' + (n ? '<span class="rt-pip">' + n + '</span>' : '');
  }

  /* Sem cliente escolhido, a aba e o caderno do vendedor: so os clientes em
     que ele ja escreveu alguma coisa. Enquanto nao escrever nada, nao ha
     nada para mostrar -- e a aba abre em branco de proposito, sem lista de
     cliente nenhum. */
  function desenharCaderno(alvo) {
    var tudo = ponte.notasTodas ? ponte.notasTodas() : [];
    if (!tudo.length) return;

    alvo.appendChild(el('p', 'rt-dica',
      'Clientes em que você já escreveu. Toque para abrir.'));

    var caixa = el('div', 'rt-caderno');
    tudo.forEach(function (item) {
      var ultima = item.notas[item.notas.length - 1] || {};
      var linha = el('button', 'rt-caderno-item',
        '<span class="rt-cad-nome">' + rtEsc(item.nome) + '</span>' +
        '<span class="rt-cad-quantas">' + item.notas.length +
          (item.notas.length === 1 ? ' anotação' : ' anotações') + '</span>' +
        '<span class="rt-cad-ultima">' + rtEsc(ultima.data || '') + ' · ' +
          rtEsc(String(ultima.texto || '').slice(0, 90)) + '</span>');
      linha.addEventListener('click', function () {
        if (ponte.irParaCliente) ponte.irParaCliente(item.cliente);
      });
      caixa.appendChild(linha);
    });
    alvo.appendChild(caixa);
  }

  /* ---------- agenda ----------
     Mesma divisao do caderno: com um cliente escolhido, marca o retorno dele;
     sem cliente, e a lista do que vem pela frente. */

  var agenda = { itens: [], avisa: false };

  function contarAgenda() {
    var t = document.getElementById('rtTabAgenda');
    if (!t) return;
    var n = agenda.itens.length;
    t.innerHTML = 'Agenda' + (n ? '<span class="rt-pip">' + n + '</span>' : '');
  }

  /* "quinta, 26/03 às 14:30" -- o dia da semana ajuda a perceber engano na
     hora de marcar mais do que a data sozinha. */
  function quandoBonito(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || '');
    var dia = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
    var hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return dia + ' às ' + hora;
  }

  function faltaQuanto(iso) {
    var min = Math.round((Date.parse(iso) - Date.now()) / 60000);
    if (min < 0) return 'passou';
    if (min < 60) return 'em ' + min + ' min';
    if (min < 60 * 24) return 'em ' + Math.round(min / 60) + 'h';
    return 'em ' + Math.round(min / 1440) + ' dias';
  }

  /* Valor para <input type="datetime-local">: hora LOCAL, sem fuso. Usar
     toISOString aqui jogaria a sugestao para UTC e o vendedor veria uma hora
     que nao e a dele. */
  function paraCampo(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function desenharAgenda() {
    var alvo = document.getElementById('rtAgenda');
    if (!alvo) return;
    alvo.innerHTML = '';

    if (atual && atual.cliente) {
      var caixa = el('div', 'rt-ag-novo');
      var amanha = new Date(Date.now() + 24 * 3600 * 1000);
      amanha.setMinutes(0, 0, 0);

      caixa.innerHTML =
        '<label class="rt-ag-rot" for="rtAgQuando">Marcar retorno para</label>' +
        '<input class="rt-ag-quando" id="rtAgQuando" type="datetime-local" value="' +
          paraCampo(amanha) + '">' +
        '<input class="rt-ag-obs" id="rtAgObs" maxlength="300" ' +
          'placeholder="O que combinaram (opcional)">';
      alvo.appendChild(caixa);

      var linha = el('div', 'btn-row');
      linha.style.marginTop = '12px';
      var marcar = el('button', 'btn btn-sm btn-primary', 'Agendar');
      var recado = el('span', 'rt-salvo', '');
      marcar.addEventListener('click', function () {
        var campo = document.getElementById('rtAgQuando');
        if (!campo.value) { recado.textContent = 'Escolha a data e a hora.'; return; }
        var quando = new Date(campo.value);
        if (isNaN(quando) || quando <= new Date()) {
          recado.textContent = 'Escolha um horário no futuro.'; return;
        }
        marcar.disabled = true;
        recado.textContent = 'salvando…';
        ponte.agendar(atual.cliente, atual.rotulo, quando.toISOString(),
                      document.getElementById('rtAgObs').value)
          .then(function () {
            marcar.disabled = false;
            desenharAgenda(); contarAgenda();
          }, function (e) {
            marcar.disabled = false;
            recado.textContent = (e && e.message) || 'Não consegui agendar.';
          });
      });
      linha.append(marcar, recado);
      alvo.appendChild(linha);
    }

    if (!agenda.itens.length) {
      if (!atual || !atual.cliente) {
        alvo.appendChild(el('p', 'rt-dica',
          'Escolha um cliente na lista para marcar um retorno.'));
      }
      return;
    }

    /* Enquanto o lembrete por e-mail nao estiver ligado, a tela nao fala
       dele. Nada de explicar ao vendedor um recurso que ele ainda nao tem e
       nem sabe que existe -- a agenda funciona sozinha como lista do dia. A
       frase aparece por conta propria no dia em que o e-mail for ligado e o
       endereco dele estiver cadastrado. */
    if (agenda.avisa) {
      alvo.appendChild(el('p', 'rt-dica',
        'Você recebe um e-mail 30 minutos antes de cada um.'));
    }

    var lista = el('div', 'rt-ag-lista');
    agenda.itens.forEach(function (a) {
      var item = el('div', 'rt-ag-item',
        '<div class="rt-ag-topo"><span class="rt-ag-hora">' + rtEsc(quandoBonito(a.quando)) +
          '</span><span class="rt-ag-falta">' + rtEsc(faltaQuanto(a.quando)) + '</span></div>' +
        '<div class="rt-ag-quem">' + rtEsc(a.nome || a.cliente) + '</div>' +
        (a.obs ? '<div class="rt-ag-obs-txt">' + rtEsc(a.obs) + '</div>' : ''));

      var acoes = el('div', 'btn-row');
      acoes.style.marginTop = '7px';
      var feito = el('button', 'btn btn-sm btn-ghost', 'Já liguei');
      var fora = el('button', 'btn btn-sm btn-ghost', 'Cancelar');
      feito.addEventListener('click', function () {
        feito.disabled = true;
        ponte.mudarAgenda('concluir', a.id).then(function () {
          desenharAgenda(); contarAgenda();
        }, function () { feito.disabled = false; });
      });
      fora.addEventListener('click', function () {
        if (!window.confirm('Cancelar este agendamento?')) return;
        fora.disabled = true;
        ponte.mudarAgenda('apagar', a.id).then(function () {
          desenharAgenda(); contarAgenda();
        }, function () { fora.disabled = false; });
      });
      acoes.append(feito, fora);
      item.appendChild(acoes);
      lista.appendChild(item);
    });
    alvo.appendChild(lista);
  }

  function desenharNotas() {
    var alvo = document.getElementById('rtNotas');
    if (!alvo) return;
    alvo.innerHTML = '';

    if (!atual || !atual.cliente) { desenharCaderno(alvo); return; }

    var cliente = atual.cliente;
    var lista = ponte.notasDe ? ponte.notasDe(cliente) : [];

    /* Cliente sem anotacao abre em branco: so a linha de escrever. Nem o
       nome do cliente aparece aqui -- ele ja esta no cartao logo acima, e
       repetido dentro da aba so ocupa espaco. Nome, cabecalho de tabela e
       aviso de privacidade entram junto com a primeira anotacao salva. */
    if (lista.length) {
      alvo.appendChild(el('p', 'rt-dica',
        'Anotações de <b>' + rtEsc(atual.rotulo) + '</b>'));
    }

    var tabela = el('table', 'rt-notas', lista.length
      ? '<thead><tr><th style="width:96px">Data</th><th>Anotação</th>' +
        '<th style="width:34px"></th></tr></thead>'
      : '');
    var corpo = document.createElement('tbody');

    // Mais recente primeiro: e a conversa que interessa antes de ligar.
    lista.slice().reverse().forEach(function (n, ordem) {
      var indice = lista.length - 1 - ordem;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="dt"><input class="rt-nota-data" value="' + rtEsc(n.data) + '"></td>' +
        '<td><textarea class="rt-nota-txt" rows="2">' + rtEsc(n.texto) + '</textarea></td>' +
        '<td><button class="rt-apagar" title="Apagar esta anotação" aria-label="Apagar">✕</button></td>';

      var campoData = tr.querySelector('.rt-nota-data');
      var campoTxt = tr.querySelector('.rt-nota-txt');
      var original = { data: n.data, texto: n.texto };

      function guardar() {
        var d = campoData.value.trim(), t = campoTxt.value.trim();
        if (!t) { campoTxt.value = original.texto; return; }
        if (d === original.data && t === original.texto) return;
        campoTxt.disabled = campoData.disabled = true;
        ponte.editarNota(cliente, indice, d, t).then(function () {
          original = { data: d, texto: t };
          campoTxt.disabled = campoData.disabled = false;
          avisar(tr, 'salvo');
        }, function () {
          campoData.value = original.data; campoTxt.value = original.texto;
          campoTxt.disabled = campoData.disabled = false;
          avisar(tr, 'não salvou');
        });
      }
      campoTxt.addEventListener('blur', guardar);
      campoData.addEventListener('blur', guardar);

      tr.querySelector('.rt-apagar').addEventListener('click', function () {
        if (!window.confirm('Apagar esta anotação?')) return;
        ponte.apagarNota(cliente, indice).then(function () {
          desenharNotas(); contarNotas();
        }, function () { avisar(tr, 'não apagou'); });
      });

      corpo.appendChild(tr);
    });

    // Linha em branco, sempre pronta para a proxima conversa.
    var nova = document.createElement('tr');
    nova.setAttribute('data-rtnova', '1');
    nova.innerHTML =
      '<td class="dt"><input class="rt-nota-data" value="' + hojeBR() + '"></td>' +
      '<td><textarea class="rt-nota-txt" rows="2" ' +
        'placeholder="O que aconteceu nessa conversa…"></textarea></td>' +
      '<td></td>';
    corpo.appendChild(nova);
    tabela.appendChild(corpo);
    alvo.appendChild(tabela);

    var linha = el('div', 'btn-row');
    linha.style.marginTop = '14px';
    var salvar = el('button', 'btn btn-sm btn-primary', 'Salvar anotação');
    var recado = el('span', 'rt-salvo', '');
    salvar.addEventListener('click', function () {
      var t = nova.querySelector('.rt-nota-txt').value.trim();
      var d = nova.querySelector('.rt-nota-data').value.trim();
      if (!t) { recado.textContent = 'Escreva alguma coisa antes de salvar.'; return; }
      salvar.disabled = true;
      recado.textContent = 'salvando…';
      ponte.salvarNota(cliente, d, t).then(function () {
        salvar.disabled = false;
        desenharNotas(); contarNotas();
      }, function (e) {
        salvar.disabled = false;
        recado.textContent = (e && e.message) || 'Não consegui salvar.';
      });
    });
    linha.append(salvar, recado);
    alvo.appendChild(linha);

    /* A explicacao inteira so depois que existir o que proteger.
       Ela fala do que continua verdade: nenhum outro vendedor le, e a
       anotacao nao viaja com o cliente. Nao afirma mais nada sobre o gestor
       -- ele passou a ler pelo painel dele, e uma promessa que deixou de
       valer nao pode ficar escrita na tela. */
    if (!lista.length) return;
    alvo.appendChild(el('div', 'rt-privado',
      '<b>Nenhum outro vendedor lê isto.</b> Suas anotações ficam guardadas com o seu ' +
      'nome e o código do cliente: se ele passar para outro vendedor numa próxima ' +
      'distribuição, o que você escreveu não vai junto — e se voltar para você, tudo ' +
      'reaparece.'));
  }

  function avisar(tr, texto) {
    var marca = tr.querySelector('.rt-salvo-linha');
    if (!marca) {
      marca = el('span', 'rt-salvo-linha', '');
      tr.querySelector('td:nth-child(2)').appendChild(marca);
    }
    marca.textContent = texto;
    setTimeout(function () { if (marca) marca.textContent = ''; }, 1800);
  }

  /* ---------- pergunta a IA ---------- */

  function desenharSaldo(dados) {
    var conta = document.getElementById('rtIaConta');
    var bloco = document.getElementById('rtIa');
    if (!conta || !bloco) return;
    if (!dados || !dados.ligado) { bloco.hidden = true; return; }
    bloco.hidden = false;
    var restam = Number(dados.restantes) || 0;
    conta.textContent = restam + ' de ' + dados.limite + ' perguntas restantes hoje';
    conta.setAttribute('data-baixo', restam <= 3 ? '1' : '0');
    document.getElementById('rtIaPerguntar').disabled = restam <= 0;
  }

  function desenharResposta(r, restantes) {
    var saida = document.getElementById('rtIaSaida');
    saida.innerHTML = '';
    var cx = el('div', 'rt-ia-resposta');
    cx.appendChild(el('div', 'rt-etapa', 'Por trás disso'));
    cx.appendChild(el('p', 'rt-portras', rtEsc(r.porTras)));
    cx.appendChild(el('div', 'rt-etapa', 'O que dizer'));
    cx.appendChild(el('div', 'rt-fala', rtEsc(r.fala)));
    if (r.porQue) {
      cx.appendChild(el('div', 'rt-etapa', 'Por que funciona'));
      cx.appendChild(el('p', 'rt-porque', rtEsc(r.porQue)));
    }
    if (r.cuidado) cx.appendChild(el('div', 'rt-cuidado', '<b>Cuidado:</b> ' + rtEsc(r.cuidado)));

    var linha = el('div', 'btn-row');
    linha.style.marginTop = '12px';
    var b = el('button', 'btn btn-sm btn-ghost', 'Copiar resposta');
    b.addEventListener('click', function () { copiar(r.fala, b); });
    linha.appendChild(b);
    cx.appendChild(linha);

    cx.appendChild(el('p', 'rt-rodape-ia',
      'Resposta gerada agora. <strong>Ela não sabe preço, prazo, estoque nem condição do ' +
      'mês</strong> — quando a pergunta depende disso, manda confirmar com o gestor.'));

    if (restantes === 0) {
      cx.appendChild(el('div', 'rt-cuidado',
        '<b>Acabaram suas perguntas de hoje.</b> Volta amanhã. Os 17 cenários prontos e a ' +
        'busca continuam funcionando.'));
    }
    saida.appendChild(cx);
  }

  function perguntar() {
    var campo = document.getElementById('rtIaTxt');
    var botao = document.getElementById('rtIaPerguntar');
    var saida = document.getElementById('rtIaSaida');
    var texto = campo.value.trim();
    if (texto.length < 5) { campo.focus(); return; }

    botao.disabled = true;
    saida.innerHTML = '';
    saida.appendChild(el('div', 'rt-pensando',
      '<span class="rt-ponto"></span><span class="rt-ponto"></span>' +
      '<span class="rt-ponto"></span><span>Pensando na melhor resposta…</span>'));

    ponte.perguntarIa('perguntar', texto).then(function (dados) {
      botao.disabled = false;
      desenharResposta(dados.resposta, dados.restantes);
      var conta = document.getElementById('rtIaConta');
      if (conta && typeof dados.restantes === 'number') {
        conta.textContent = dados.restantes + ' perguntas restantes hoje';
        conta.setAttribute('data-baixo', dados.restantes <= 3 ? '1' : '0');
        botao.disabled = dados.restantes <= 0;
      }
    }, function (e) {
      botao.disabled = false;
      saida.innerHTML = '';
      saida.appendChild(el('div', 'rt-cuidado', rtEsc((e && e.message) || 'Não consegui responder.')));
    });
  }

  /* ---------- API ---------- */

  return {
    html: html,
    daLinha: daLinha,
    /* Abrir o caderno tem que ser VISIVEL. No celular o roteiro fica acima
       das listas, entao o vendedor que rolou ate o cliente 20 e deu o toque
       duplo abria a aba a mil pixels de distancia -- a tela nao mexia e
       parecia que o duplo clique nao funcionava. Aqui a pagina vai junto, e
       o cursor cai direto na linha de escrever. */
    abrirNotas: function () {
      trocarAba('notas');
      var painel = document.getElementById('rtNotas');
      if (!painel) return;
      var caixa = document.querySelector('.rt-painel') || painel;
      var r = caixa.getBoundingClientRect();
      var jaNaTela = r.top >= 0 && r.top < (window.innerHeight || 0) * 0.6;
      if (!jaNaTela) {
        try { caixa.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        catch (e) { caixa.scrollIntoView(); }
      }
      var campo = painel.querySelector('tr[data-rtnova="1"] .rt-nota-txt');
      if (campo) {
        setTimeout(function () {
          try { campo.focus({ preventScroll: true }); } catch (e) { campo.focus(); }
        }, jaNaTela ? 0 : 420);
      }
    },

    saldoIa: function () {
      if (!ponte.perguntarIa) return;
      ponte.perguntarIa('saldo').then(desenharSaldo, function () {
        var bloco = document.getElementById('rtIa');
        if (bloco) bloco.hidden = true;
      });
    },

    iniciar: function (nomeVendedor, funcoes) {
      VEND = String(nomeVendedor || '').trim();
      ponte = funcoes || {};

      var abas = document.querySelectorAll('[data-rtaba]');
      for (var i = 0; i < abas.length; i++) {
        abas[i].addEventListener('click', function () {
          trocarAba(this.getAttribute('data-rtaba'));
        });
      }

      var perguntarBtn = document.getElementById('rtIaPerguntar');
      if (perguntarBtn) perguntarBtn.addEventListener('click', perguntar);

      var segs = document.querySelectorAll('[data-rttipo]');
      for (var j = 0; j < segs.length; j++) {
        segs[j].addEventListener('click', function () {
          trocarTipo(this.getAttribute('data-rttipo'));
        });
      }

      var busca = document.getElementById('rtBusca');
      if (busca) {
        busca.addEventListener('input', function () { desenharObjs(this.value); });
      }

      desenharEscolhido();
      desenharCards();
      desenharObjs('');
      desenharNotas();
      contarNotas();
      desenharAgenda();
      contarAgenda();
    },

    /* carteira.js avisa quando a agenda muda no servidor. */
    agendaMudou: function (itens, avisa) {
      agenda.itens = itens || [];
      if (avisa !== undefined) agenda.avisa = !!avisa;
      desenharAgenda();
      contarAgenda();
    },

    /* Cliente escolhido na tabela: as falas passam a usar os dados dele, e o
       conjunto de aberturas segue o tipo da lista de onde ele veio. */
    selecionar: function (cliente) {
      atual = cliente;
      if (cliente && cliente.modo && ABERTURAS[cliente.modo]) trocarTipo(cliente.modo);
      desenharEscolhido();
      desenharCards();
      var busca = document.getElementById('rtBusca');
      desenharObjs(busca ? busca.value : '');
      desenharNotas();
      contarNotas();
      desenharAgenda();
    }
  };
})();

/* ==================================================================
   Pagina do vendedor. Le o token depois do "#" da URL e pede ao
   servidor a carteira daquele token -- so ela.

   O token fica no fragmento (#) e nao na query (?) de proposito: o
   navegador nunca envia o fragmento ao servidor, entao o segredo nao
   entra em log de acesso nem em cabecalho Referer.
   ================================================================== */

var $ = function (id) { return document.getElementById(id); };

function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
}

var toastTimer = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}

function primeiroNome(nome) {
  var p = String(nome || '').trim().split(/\s+/)[0] || '';
  return p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : '';
}

function aviso(titulo, texto) {
  $('conteudo').innerHTML =
    '<p class="kicker">Carteira</p>' +
    '<h2>' + escapeHtml(titulo) + '</h2>' +
    '<p class="sub">' + escapeHtml(texto) + '</p>';
}

/* Colunas que o vendedor precisa ver na tela. O restante continua no
   arquivo baixado -- aqui a tela fica legivel no celular. */
var COLUNAS_PRIORITARIAS = [
  'Integrador (CLI - Nome)', 'Integrador', 'Cidade', 'UF',
  'Telefone', 'E-mail', 'Categoria', 'Última Nota', 'Valor Faturado'
];

function colunasVisiveis(colunas) {
  var achadas = COLUNAS_PRIORITARIAS.filter(function (c) {
    return colunas.indexOf(c) > -1;
  });
  return achadas.length ? achadas : colunas.slice(0, 6);
}

/* paraNumero, moeda, inteiro, toCSV, toTSV, safeName e download vem de
   formato.js, que entra neste mesmo <script>. E a unica leitura de numero
   das duas paginas -- foi ter uma segunda que produziu o valor errado no
   cartao do roteiro. */

/* Telefone e e-mail viram link (um toque liga ou escreve) e valor vira
   moeda -- "2382309.77" nao diz nada a quem esta olhando a lista. */
function celula(coluna, valor) {
  var texto = String(valor === undefined || valor === null ? '' : valor).trim();
  if (!texto) return '';

  if (/valor|faturad/i.test(coluna)) {
    var emReais = moeda(texto);
    if (emReais) return escapeHtml(emReais);
  }

  if (/telefone|celular|fone/i.test(coluna)) {
    var digitos = texto.replace(/\D/g, '');
    if (digitos.length >= 8) {
      var numero = digitos.length <= 11 ? '+55' + digitos : '+' + digitos;
      return '<a href="tel:' + escapeHtml(numero) + '">' + escapeHtml(texto) + '</a>';
    }
  }
  if (/mail/i.test(coluna) && texto.indexOf('@') > 0) {
    return '<a href="mailto:' + escapeHtml(texto) + '">' + escapeHtml(texto) + '</a>';
  }
  return escapeHtml(texto);
}

/* Identidade do cliente, para reconhecer quem aparece em mais de uma
   rodada. Mesmo criterio do app do gestor: o codigo CLI-xxxx quando existe. */
function chaveCliente(linha, colunas) {
  var nome = '';
  for (var i = 0; i < colunas.length; i++) {
    if (/integrador/i.test(colunas[i])) { nome = String(linha[colunas[i]] || ''); break; }
  }
  var m = nome.match(/CLI[-\s]?0*(\d+)/i);
  return m ? 'CLI' + m[1] : nome.trim().toUpperCase();
}

/* Em quantas rodadas cada cliente aparece. O vendedor precisa saber que o
   cliente da lista de hoje ja estava na de ontem -- senao liga duas vezes
   achando que sao casos diferentes. */
function mapearRepetidos(rodadas) {
  var onde = {};
  rodadas.forEach(function (r) {
    r.linhas.forEach(function (l) {
      var k = chaveCliente(l, r.colunas);
      if (!k) return;
      if (!onde[k]) onde[k] = [];
      if (onde[k].indexOf(r.rotulo) === -1) onde[k].push(r.rotulo);
    });
  });
  return onde;
}

function secaoDaRodada(r, indice, repetidos) {
  var visiveis = colunasVisiveis(r.colunas);
  var quando = new Date(r.publicadoEm);
  var idBase = 'r' + indice;

  var linhasHtml = r.linhas.map(function (l, li) {
    var k = chaveCliente(l, r.colunas);
    var outras = (repetidos[k] || []).filter(function (x) { return x !== r.rotulo; });
    var marcado = !!(estado.marcas[r.modo] || {})[k];
    var quantasNotas = (estado.notas[k] || []).length;

    var celulas = visiveis.map(function (c, ci) {
      var conteudo = celula(c, l[c]);
      if (ci === 0) {
        if (quantasNotas) {
          conteudo += ' <span class="tag-nota" title="Abrir suas anotações deste cliente">' +
            quantasNotas + (quantasNotas === 1 ? ' anotação' : ' anotações') + '</span>';
        }
        if (outras.length) {
          conteudo += ' <span class="tag-rep" title="Este cliente também está em: ' +
            escapeHtml(outras.join(', ')) + '">também em ' + escapeHtml(outras[0]) + '</span>';
        }
      }
      var titulo = (c === visiveis[0] || /mail/i.test(c))
        ? ' title="' + escapeHtml(l[c]) + '"' : '';
      return '<td data-rotulo="' + escapeHtml(c) + '"' + titulo + '>' + conteudo + '</td>';
    }).join('');

    return '<tr data-rodada="' + indice + '" data-linha="' + li + '"' +
        (marcado ? ' data-falei="1"' : '') + '>' +
      '<td class="col-falei" data-rotulo="Já falei">' +
        '<input type="checkbox" class="falei-box"' + (marcado ? ' checked' : '') +
        ' data-cliente="' + escapeHtml(k) + '" data-modo="' + escapeHtml(r.modo) + '"' +
        ' aria-label="Já falei com este cliente"></td>' +
      celulas + '</tr>';
  }).join('');

  var marcados = Object.keys(estado.marcas[r.modo] || {}).length;

  return '<div class="panel">' +
      '<div class="panel-head">' +
        '<h3>' + escapeHtml(r.rotulo) +
          ' <span class="count-pill">' + r.linhas.length + '</span></h3>' +
        '<div class="btn-row">' +
          '<span class="hint" data-contados="' + escapeHtml(r.modo) + '">' +
            marcados + ' de ' + r.linhas.length + ' já contatados</span>' +
          '<button class="btn btn-sm" data-copiar="' + idBase + '">Copiar</button>' +
          '<button class="btn btn-sm btn-primary" data-baixar="' + idBase + '">Baixar CSV</button>' +
        '</div>' +
      '</div>' +
      '<p class="hint" style="margin-top:-8px;">Enviada em ' +
        escapeHtml(quando.toLocaleDateString('pt-BR')) + ' às ' +
        escapeHtml(quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })) +
      '.</p>' +
      '<div class="tablewrap cartoes"><table><thead><tr>' +
        '<th class="col-falei" title="Marque quando já tiver falado com o cliente">✓</th>' +
        visiveis.map(function (c) { return '<th>' + escapeHtml(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + linhasHtml + '</tbody></table></div>' +
    '</div>';
}

function render(dados) {
  // Mais recente primeiro: e a rodada que o vendedor precisa ver ao abrir.
  var rodadas = Object.keys(dados.rodadas || {})
    .map(function (k) { return dados.rodadas[k]; })
    .filter(function (r) { return r && r.linhas && r.linhas.length; })
    .sort(function (a, b) { return b.publicadoEm - a.publicadoEm; });

  var total = rodadas.reduce(function (a, r) { return a + r.linhas.length; }, 0);

  var cabecalho =
    '<p class="kicker">Carteira de prospecção</p>' +
    '<h2>Olá, ' + escapeHtml(primeiroNome(dados.vendedor)) + '</h2>';

  if (!rodadas.length) {
    $('conteudo').innerHTML = cabecalho +
      '<p class="sub">Nenhuma lista ativa para você no momento.</p>' +
      '<div class="panel"><p class="empty">Assim que seu gestor publicar uma lista nova, ' +
      'ela aparece aqui neste mesmo link — não precisa de link novo.</p></div>';
    return;
  }

  var repetidos = mapearRepetidos(rodadas);
  var quantosRepetem = Object.keys(repetidos).filter(function (k) {
    return repetidos[k].length > 1;
  }).length;

  $('conteudo').innerHTML = cabecalho +
    '<p class="sub">Você tem <strong>' + total +
      (total === 1 ? ' cliente</strong>' : ' clientes</strong>') +
      ' esperando contato, em ' +
      (rodadas.length === 1 ? 'uma lista' : rodadas.length + ' listas') + '. ' +
      (quantosRepetem
        ? fmtRepetidos(quantosRepetem) + ' Cada lista tem seu motivo — confira o título de cada uma.'
        : 'Cada lista tem seu motivo — confira o título de cada uma.') +
    '</p>' +
    '<div class="rt-work">' +
      '<div class="rt-listas">' +
        rodadas.map(function (r, i) { return secaoDaRodada(r, i, repetidos); }).join('') +
        '<p class="hint">A tela mostra as colunas principais. O arquivo baixado traz todas.</p>' +
      '</div>' +
      '<aside class="rt-lado">' + Roteiro.html() + '</aside>' +
    '</div>';

  estado.rodadas = rodadas;
  Roteiro.iniciar(primeiroNome(dados.vendedor), {
    notasDe: function (cliente) { return estado.notas[cliente] || []; },
    notasTodas: notasTodas,
    irParaCliente: irParaCliente,
    salvarNota: salvarNota,
    editarNota: editarNota,
    apagarNota: apagarNota,
    agendar: agendar,
    mudarAgenda: mudarAgenda,
    perguntarIa: perguntarIa
  });
  Roteiro.agendaMudou(estado.agenda.itens, estado.agenda.avisa);
  ligarSelecao(rodadas);
  ligarMarcas();
  Roteiro.saldoIa();

  rodadas.forEach(function (r, i) {
    var idBase = 'r' + i;
    var bc = document.querySelector('[data-copiar="' + idBase + '"]');
    var bb = document.querySelector('[data-baixar="' + idBase + '"]');
    if (bc) bc.addEventListener('click', function () {
      var texto = toTSV(r.linhas, r.colunas);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(
          function () { toast('Lista copiada'); },
          function () { toast('Não consegui copiar — use o botão Baixar CSV'); }
        );
      } else {
        toast('Não consegui copiar — use o botão Baixar CSV');
      }
    });
    if (bb) bb.addEventListener('click', function () {
      download(new Blob([toCSV(r.linhas, r.colunas)], { type: 'text/csv;charset=utf-8' }),
        'carteira-' + String(dados.vendedor).toLowerCase().replace(/[^a-z0-9]+/g, '-') +
        '-' + r.modo + '.csv');
    });
  });
}

/* ---------- conversa com o servidor ----------
   Tudo passa pelo token do link. Nenhuma chamada manda o nome do vendedor:
   quem diz de quem é a marca ou a anotação é o servidor, a partir do token. */

var estado = { token: '', marcas: {}, notas: {}, rodadas: [],
               agenda: { itens: [], avisa: false } };

async function chamar(caminho, corpo) {
  var resposta = await fetch(caminho, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: estado.token }, corpo || {}))
  });
  var dados = await resposta.json();
  if (!resposta.ok) throw new Error(dados && dados.erro ? dados.erro : 'Falhou.');
  return dados;
}

/* A caixinha e a anotacao são conforto, não a razão da página existir. Se o
   servidor não responder, a lista tem de aparecer do mesmo jeito. */
async function carregarExtras() {
  try {
    var m = await chamar('/api/marcas', {});
    estado.marcas = m.marcas || {};
  } catch (e) { estado.marcas = {}; }
  try {
    var n = await chamar('/api/anotacoes', { acao: 'listar' });
    estado.notas = n.notas || {};
  } catch (e) { estado.notas = {}; }
  try {
    var a = await chamar('/api/agenda', { acao: 'listar' });
    estado.agenda = { itens: a.agenda || [], avisa: !!a.avisa };
  } catch (e) { estado.agenda = { itens: [], avisa: false }; }
}

function ligarMarcas() {
  document.querySelectorAll('.falei-box').forEach(function (caixa) {
    caixa.addEventListener('click', function (ev) {
      ev.stopPropagation();   // marcar não é escolher a linha
    });
    caixa.addEventListener('change', async function () {
      var cliente = caixa.getAttribute('data-cliente');
      var modo = caixa.getAttribute('data-modo');
      var querMarcar = caixa.checked;
      var linha = caixa.closest('tr');
      caixa.disabled = true;
      try {
        var r = await chamar('/api/marcas', { modo: modo, cliente: cliente, marcado: querMarcar });
        estado.marcas[modo] = r.marcas || {};
        if (querMarcar) linha.setAttribute('data-falei', '1');
        else linha.removeAttribute('data-falei');
        atualizarContagem(modo);
      } catch (e) {
        caixa.checked = !querMarcar;   // desfaz o visual: não gravou
        toast('Não consegui salvar a marcação. Tente de novo.');
      }
      caixa.disabled = false;
    });
  });
}

function atualizarContagem(modo) {
  var alvo = document.querySelector('[data-contados="' + modo + '"]');
  if (!alvo) return;
  var rodada = estado.rodadas.filter(function (r) { return r.modo === modo; })[0];
  if (!rodada) return;
  alvo.textContent = Object.keys(estado.marcas[modo] || {}).length +
    ' de ' + rodada.linhas.length + ' já contatados';
}

/* Depois de mexer numa anotação, a lista precisa refletir: a etiqueta com a
   quantidade fica na linha do cliente. */
function atualizarEtiquetaNotas(cliente) {
  var quantas = (estado.notas[cliente] || []).length;
  document.querySelectorAll('.falei-box[data-cliente="' + CSS.escape(cliente) + '"]')
    .forEach(function (caixa) {
      var primeira = caixa.closest('tr').querySelectorAll('td')[1];
      if (!primeira) return;
      var etiqueta = primeira.querySelector('.tag-nota');
      if (!quantas) { if (etiqueta) etiqueta.remove(); return; }
      if (!etiqueta) {
        etiqueta = document.createElement('span');
        etiqueta.className = 'tag-nota';
        etiqueta.title = 'Suas anotações deste cliente';
        primeira.appendChild(document.createTextNode(' '));
        primeira.appendChild(etiqueta);
      }
      etiqueta.textContent = quantas + (quantas === 1 ? ' anotação' : ' anotações');
    });
}

async function salvarNota(cliente, data, texto) {
  var r = await chamar('/api/anotacoes', { acao: 'somar', cliente: cliente, data: data, texto: texto });
  estado.notas[cliente] = r.notas || [];
  atualizarEtiquetaNotas(cliente);
  return estado.notas[cliente];
}

async function editarNota(cliente, indice, data, texto) {
  var r = await chamar('/api/anotacoes', {
    acao: 'editar', cliente: cliente, indice: indice, data: data, texto: texto
  });
  estado.notas[cliente] = r.notas || [];
  return estado.notas[cliente];
}

async function apagarNota(cliente, indice) {
  var r = await chamar('/api/anotacoes', { acao: 'apagar', cliente: cliente, indice: indice });
  estado.notas[cliente] = r.notas || [];
  atualizarEtiquetaNotas(cliente);
  return estado.notas[cliente];
}

async function perguntarIa(acao, pergunta) {
  return chamar('/api/duvida', { acao: acao, pergunta: pergunta });
}

/* O fuso do aparelho vai junto so para o e-mail mostrar a hora que o
   vendedor digitou. O instante em si ja segue em UTC. */
function fusoDaqui() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch (e) { return ''; }
}

async function agendar(cliente, nome, quandoISO, obs) {
  var r = await chamar('/api/agenda', {
    acao: 'somar', cliente: cliente, nome: nome,
    quando: quandoISO, fuso: fusoDaqui(), obs: obs
  });
  Roteiro.agendaMudou(r.agenda, r.avisa);
  return r.agenda;
}

async function mudarAgenda(acao, id) {
  var r = await chamar('/api/agenda', { acao: acao, id: id });
  Roteiro.agendaMudou(r.agenda, r.avisa);
  return r.agenda;
}

/* O caderno da aba Anotações: só os clientes em que o vendedor escreveu
   alguma coisa, do mais recente para o mais antigo. Enquanto ele não
   escrever nada, isto devolve lista vazia e a aba abre em branco. */
function notasTodas() {
  var fora = [];
  Object.keys(estado.notas).forEach(function (k) {
    var notas = estado.notas[k] || [];
    if (!notas.length) return;
    fora.push({
      cliente: k,
      nome: nomeDoCliente(k) || k,
      notas: notas,
      quando: Math.max.apply(null, notas.map(function (n) { return Number(n.ts) || 0; }))
    });
  });
  fora.sort(function (a, b) { return b.quando - a.quando; });
  return fora;
}

/* Do código do cliente de volta ao nome que está na lista. Se ele saiu da
   carteira nesta rodada, o nome não existe mais aqui -- a anotação continua
   guardada, e o código serve de rótulo. */
function nomeDoCliente(chave) {
  for (var i = 0; i < estado.rodadas.length; i++) {
    var r = estado.rodadas[i];
    for (var j = 0; j < r.linhas.length; j++) {
      if (chaveCliente(r.linhas[j], r.colunas) !== chave) continue;
      for (var c = 0; c < r.colunas.length; c++) {
        if (/integrador/i.test(r.colunas[c])) return String(r.linhas[j][r.colunas[c]] || '');
      }
    }
  }
  return '';
}

/* Do caderno de volta ao cliente: seleciona a linha dele na lista, para o
   roteiro e o editor de anotações passarem a falar daquele cliente. */
function irParaCliente(chave) {
  for (var i = 0; i < estado.rodadas.length; i++) {
    var r = estado.rodadas[i];
    for (var j = 0; j < r.linhas.length; j++) {
      if (chaveCliente(r.linhas[j], r.colunas) !== chave) continue;
      var tr = document.querySelector(
        '.rt-listas tbody tr[data-rodada="' + i + '"][data-linha="' + j + '"]');
      if (tr) {
        var antes = document.querySelectorAll('.rt-listas tr[data-rtsel="1"]');
        for (var k = 0; k < antes.length; k++) antes[k].removeAttribute('data-rtsel');
        tr.setAttribute('data-rtsel', '1');
      }
      Roteiro.selecionar(Roteiro.daLinha(r.linhas[j], r.colunas, r.modo));
      return true;
    }
  }
  return false;
}

/* Clicar numa linha faz o roteiro falar daquele cliente. A linha continua
   sendo uma linha de tabela: quem só quer ler a lista não perde nada, e quem
   vai ligar ganha a fala com a data e o histórico certos. */
function ligarSelecao(rodadas) {
  var linhas = document.querySelectorAll('.rt-listas tbody tr[data-rodada]');
  for (var i = 0; i < linhas.length; i++) {
    (function (tr) {
      function escolher() {
        // Vale tambem quando o clique cai no telefone: quem toca no numero e
        // exatamente quem vai ligar, e e nessa hora que o roteiro precisa
        // estar pronto. O link continua funcionando -- nada e cancelado aqui.
        var r = rodadas[Number(tr.getAttribute('data-rodada'))];
        var linha = r && r.linhas[Number(tr.getAttribute('data-linha'))];
        if (!linha) return null;

        var antes = document.querySelectorAll('.rt-listas tr[data-rtsel="1"]');
        for (var k = 0; k < antes.length; k++) antes[k].removeAttribute('data-rtsel');
        tr.setAttribute('data-rtsel', '1');

        Roteiro.selecionar(Roteiro.daLinha(linha, r.colunas, r.modo));
        return linha;
      }
      tr.addEventListener('click', function (ev) {
        var linha = escolher();
        // A etiqueta "2 anotações" e um atalho: um toque nela ja abre o
        // caderno. Serve o celular, onde o toque duplo e mais desajeitado.
        if (linha && ev.target && ev.target.classList.contains('tag-nota')) {
          Roteiro.abrirNotas();
        }
      });

      // Dois cliques abrem o caderno daquele cliente, ja na aba certa.
      tr.addEventListener('dblclick', function () {
        if (escolher()) Roteiro.abrirNotas();
      });

      /* O toque duplo do Android contado por nos.
         O evento dblclick existe no papel em todo navegador de celular, mas
         nao chega de forma confiavel: dependendo da versao e do teclado de
         gestos, o segundo toque vira zoom, rolagem ou selecao de texto e o
         dblclick some. Entao aqui a conta e nossa -- dois toques na MESMA
         linha dentro de 450 ms abrem o caderno, sem depender de o navegador
         sintetizar coisa alguma. O mouse continua no dblclick de cima. */
      var toqueAnterior = 0;
      tr.addEventListener('pointerup', function (ev) {
        if (ev.pointerType === 'mouse') return;
        if (ev.target && ev.target.closest &&
            ev.target.closest('a, .col-falei, .tag-nota')) return;
        var agora = Date.now();
        if (agora - toqueAnterior < 450) {
          toqueAnterior = 0;
          if (escolher()) Roteiro.abrirNotas();
        } else {
          toqueAnterior = agora;
        }
      });
    })(linhas[i]);
  }
}

function fmtRepetidos(n) {
  return n === 1
    ? '<strong>1 cliente aparece em mais de uma lista</strong> — está marcado, para você não ligar duas vezes.'
    : '<strong>' + n + ' clientes aparecem em mais de uma lista</strong> — estão marcados, para você não ligar duas vezes.';
}

async function carregar() {
  var token = (location.hash || '').replace(/^#/, '').trim();

  if (!token) {
    aviso('Link incompleto',
      'Falta a parte final do endereço. Abra o link exatamente como você recebeu, ' +
      'sem cortar nada depois do "#". Se não tiver mais a mensagem, peça um link novo ao seu gestor.');
    return;
  }

  try {
    var resposta = await fetch('/api/carteira', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: token })
    });
    var dados = await resposta.json();

    if (!resposta.ok) {
      aviso('Não consegui abrir sua carteira',
        dados && dados.erro ? dados.erro : 'Peça um link novo ao seu gestor.');
      return;
    }
    estado.token = token;
    await carregarExtras();
    render(dados);
  } catch (e) {
    aviso('Sem conexão',
      'Não consegui falar com o servidor. Confira sua internet e atualize a página.');
  }
}

carregar();
window.addEventListener('hashchange', carregar);

</script>
