/* Identidade fixa: preto e amarelo BelEnergy, um unico mundo visual. */
:root{
  --bg:#0A0A0B; --panel:#131316; --panel-2:#1A1A1E; --panel-3:#232329;
  --line:#2A2A31; --line-2:#3A3A43;
  --text:#F4F4F1; --text-2:#9E9EA0; --text-3:#6B6B70;
  --y:#FFC72C; --y-hi:#FFD966; --y-dim:#8A6A12; --y-wash:#241D07;
  --ok:#42C98B; --ok-wash:#0F2A1E;
  --no:#FF6B6B; --no-wash:#2C1414;
  --neutral:#7E8794; --neutral-wash:#1B1F24;
  /* azul so para o que vem da IA: separa a resposta gerada agora do
     conteudo escrito e revisado, que continua no amarelo da casa. */
  --ia:#7FB2FF; --ia-wash:#111A2B;
  --radius:10px;
  --ui:'PlexSans',system-ui,-apple-system,sans-serif;
  --dp:'Archivo',system-ui,sans-serif;
  --mono:'PlexMono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--y);color:#000;}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(10,10,11,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1240px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;}
.brand svg{display:block;flex:none;}
.wordmark{
  font-family:var(--dp);font-weight:800;font-size:19px;letter-spacing:-.02em;
  line-height:1;white-space:nowrap;
}
.wordmark .b{color:var(--text);}
.wordmark .e{color:var(--y);}
.brand-div{width:1px;height:26px;background:var(--line-2);}
.appname{
  font-family:var(--dp);font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--text-2);
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.statuschip{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line-2);color:var(--text-3);white-space:nowrap;
}
.statuschip[data-on="1"]{border-color:var(--ok);color:var(--ok);background:var(--ok-wash);}

/* ---------------- steps ---------------- */
.steps{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:57px;z-index:35;}
.steps-in{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto;}
.step{
  appearance:none;background:none;border:0;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:9px;padding:15px 16px;
  border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text-3);
  font-size:13.5px;font-weight:500;transition:color .15s,border-color .15s;
}
.step:hover:not(:disabled){color:var(--text);}
.step:disabled{opacity:.4;cursor:not-allowed;}
.step[aria-selected="true"]{color:var(--y);border-bottom-color:var(--y);}
.step-n{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  border:1px solid currentColor;flex:none;
}
.step[aria-selected="true"] .step-n{background:var(--y);color:#000;border-color:var(--y);}
.step[data-done="1"]:not([aria-selected="true"]) .step-n{background:var(--ok);color:#000;border-color:var(--ok);}

main{max-width:1240px;margin:0 auto;padding:32px 22px 100px;}
.pane[hidden]{display:none;}

/* ---------------- typography ---------------- */
h2{font-family:var(--dp);font-weight:700;font-size:1.5rem;letter-spacing:-.015em;margin:0 0 6px;}
h3{font-family:var(--dp);font-weight:600;font-size:1.02rem;margin:0 0 4px;letter-spacing:-.005em;}
.sub{color:var(--text-2);margin:0 0 22px;max-width:66ch;font-size:.95rem;}
.kicker{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--y);margin:0 0 9px;
}
.mono{font-family:var(--mono);}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------------- buttons ---------------- */
.btn{
  appearance:none;cursor:pointer;border-radius:7px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);
  font-size:13.5px;font-weight:500;padding:9px 15px;
  display:inline-flex;align-items:center;gap:7px;
  transition:background .14s,border-color .14s,color .14s,transform .06s;
}
.btn:hover:not(:disabled){background:var(--panel-3);border-color:var(--line-2);}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn:focus-visible{outline:2px solid var(--y);outline-offset:2px;}
.btn-primary{
  background:var(--y);color:#0A0A0B;border-color:var(--y);font-weight:600;
}
.btn-primary:hover:not(:disabled){background:var(--y-hi);border-color:var(--y-hi);}
.btn-sm{font-size:12px;padding:6px 11px;border-radius:6px;}
.btn-ghost{background:transparent;}
.btn[data-ok="1"]{background:var(--ok);border-color:var(--ok);color:#0A0A0B;}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}

/* ---------------- panels ---------------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:18px;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.panel-head h3{margin:0;}

/* ---------------- dropzone ---------------- */
.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--radius);
  padding:44px 24px;text-align:center;background:var(--panel);
  transition:border-color .16s,background .16s;
}
.drop.over{border-color:var(--y);background:var(--y-wash);}
.drop-icon{color:var(--y);margin-bottom:14px;}
.drop h3{font-size:1.12rem;margin-bottom:5px;}
.drop p{color:var(--text-2);margin:0 0 18px;font-size:.92rem;}
.drop input[type=file]{display:none;}
.or{
  display:flex;align-items:center;gap:14px;margin:22px 0 16px;
  color:var(--text-3);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
textarea{
  width:100%;min-height:130px;resize:vertical;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.6;padding:13px;
}
textarea:focus{outline:2px solid var(--y);outline-offset:-1px;border-color:transparent;}
textarea::placeholder{color:var(--text-3);}

/* ---------------- column chips ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  font-family:var(--mono);font-size:11.5px;padding:4px 10px;border-radius:5px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);
}
.chip[data-key="1"]{border-color:var(--ok);color:var(--ok);background:var(--ok-wash);font-weight:600;}
.chip[data-miss="1"]{border-color:var(--no);color:var(--no);background:var(--no-wash);font-weight:600;}

/* ---------------- tables ---------------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:420px;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);background:var(--panel-2);position:sticky;top:0;z-index:2;
}
tbody tr:hover{background:var(--panel-2);}
tbody tr:last-child td{border-bottom:0;}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* equipe (editavel) */
.equipe input{
  width:100%;background:transparent;border:1px solid transparent;border-radius:5px;
  color:var(--text);font-family:inherit;font-size:12.5px;padding:5px 7px;
}
.equipe input:hover{border-color:var(--line);}
.equipe input:focus{outline:none;border-color:var(--y);background:var(--panel-2);}
.equipe input.uf{font-family:var(--mono);text-transform:uppercase;font-weight:600;color:var(--y);width:64px;}
.equipe td{padding:3px 8px;}
.rm{
  appearance:none;background:none;border:0;cursor:pointer;color:var(--text-3);
  font-size:15px;line-height:1;padding:4px 7px;border-radius:5px;
}
.rm:hover{color:var(--no);background:var(--no-wash);}

/* ---------------- stats ---------------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;border-left:3px solid var(--line-2);
}
.stat b{
  display:block;font-family:var(--dp);font-weight:700;font-size:1.85rem;line-height:1.1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.stat span{
  display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--text-3);margin-top:6px;
}
.stat[data-t="go"]{border-left-color:var(--y);} .stat[data-t="go"] b{color:var(--y);}
.stat[data-t="out"]{border-left-color:var(--no);} .stat[data-t="out"] b{color:var(--no);}
.stat[data-t="hold"]{border-left-color:var(--neutral);} .stat[data-t="hold"] b{color:var(--neutral);}

/* ---------------- vendedores / barras ---------------- */
.vend{border-top:1px solid var(--line);}
.vrow{
  display:grid;grid-template-columns:34px minmax(0,1fr) 160px 92px 108px auto;
  gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);
}
/* sem isto a coluna flexivel nao encolhe abaixo do nome (nowrap) e a linha vaza */
.vrow > *{min-width:0;}
.vrow:hover{background:var(--panel-2);}
.vuf{
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--y);
  background:var(--y-wash);border:1px solid var(--y-dim);border-radius:4px;
  padding:2px 0;text-align:center;
}
.vname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.vmail{font-family:var(--mono);font-size:10.5px;color:var(--text-3);}
.vmail[data-alerta="1"]{color:var(--no);}
/* Marca quantos clientes chegaram de vendedor de fora da equipe. */
.tag-repasse{
  font-family:var(--mono);font-size:10px;color:var(--y);
  border:1px solid var(--y);border-radius:99px;padding:1px 6px;
  white-space:nowrap;vertical-align:middle;
}
.vbar{height:6px;background:var(--panel-3);border-radius:99px;overflow:hidden;}
.vbar i{display:block;height:100%;background:var(--y);border-radius:99px;}
.vqt{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;}
.vval{font-family:var(--mono);font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right;}
.vhead{
  display:grid;grid-template-columns:34px minmax(0,1fr) 160px 92px 108px auto;gap:12px;
  padding:0 8px 8px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);
}
.vhead .r{text-align:right;}

/* Nem toda exportacao do BI traz "Valor Faturado". Sem a coluna, mostrar
   "R$ 0" para a equipe inteira seria so ruido: a coluna some. */
body.sem-valor .vval,body.sem-valor .h-val{display:none;}
body.sem-valor .vrow,body.sem-valor .vhead{grid-template-columns:34px minmax(0,1fr) 160px 92px auto;}
body.sem-valor .frow,body.sem-valor .fhead{grid-template-columns:34px minmax(0,1fr) 120px 92px 86px;}

/* ---------------- disclosure ---------------- */
details{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
summary{
  cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;
  font-size:13.5px;font-weight:500;list-style:none;
}
summary::-webkit-details-marker{display:none;}
summary::before{
  content:"";width:0;height:0;border-left:5px solid var(--text-3);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .16s;flex:none;
}
details[open] summary::before{transform:rotate(90deg);}
summary:hover{background:var(--panel-2);}
.count-pill{
  font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;
  border:1px solid var(--line-2);color:var(--text-2);margin-left:auto;
}
.details-body{padding:0 18px 18px;}

/* ---------------- formulario ---------------- */
.field label,.lbl{
  display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;
}
.field input[type=text],select{
  width:100%;max-width:420px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:7px;color:var(--text);font-family:inherit;font-size:13.5px;padding:9px 12px;
}
select{max-width:260px;}
.field input:focus,select:focus{outline:2px solid var(--y);outline-offset:-1px;border-color:transparent;}
.radios{display:grid;gap:9px;}
.radio,.check,.field label.radio,.field label.check{
  display:flex;align-items:flex-start;gap:11px;cursor:pointer;line-height:1.5;
  font-family:inherit;font-size:13.5px;font-weight:400;letter-spacing:normal;
  text-transform:none;color:var(--text-2);margin-bottom:0;
}
.radio input,.check input{
  appearance:none;width:16px;height:16px;flex:none;margin-top:3px;cursor:pointer;
  border:1.5px solid var(--line-2);background:var(--panel-2);position:relative;
}
.radio input{border-radius:50%;}
.check input{border-radius:4px;}
.radio input:checked,.check input:checked{border-color:var(--y);background:var(--y);}
.radio input:checked::after{
  content:"";position:absolute;inset:3.5px;border-radius:50%;background:#0A0A0B;
}
.check input:checked::after{
  content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid #0A0A0B;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.radio input:focus-visible,.check input:focus-visible{outline:2px solid var(--y);outline-offset:2px;}
.radio strong,.check strong{font-weight:600;color:var(--text);}
.inline-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.inline-field label{margin-bottom:0;}

.sub-block{margin-bottom:18px;}
.pick{display:flex;flex-wrap:wrap;gap:8px;}
.pick label{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:7px;padding:7px 12px;
  background:var(--panel-2);font-size:13px;color:var(--text-2);
  transition:border-color .14s,background .14s,color .14s;
}
.pick label:hover{border-color:var(--text-3);}
.pick label:has(input:checked){border-color:var(--y);background:var(--y-wash);color:var(--text);}
.pick input{
  appearance:none;width:15px;height:15px;flex:none;border-radius:4px;cursor:pointer;
  border:1.5px solid var(--line-2);background:var(--bg);position:relative;
}
.pick input:checked{background:var(--y);border-color:var(--y);}
.pick input:checked::after{
  content:"";position:absolute;left:4px;top:.5px;width:4px;height:8px;
  border:solid #0A0A0B;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.pick input:focus-visible{outline:2px solid var(--y);outline-offset:2px;}
.pick .n{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.pick label:has(input:checked) .n{color:var(--y-hi);}
.pick-empty{color:var(--text-3);font-size:13px;}

/* ---------------- funil ---------------- */
.funil-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.frow{
  display:grid;grid-template-columns:34px minmax(0,1fr) 120px 92px 86px 108px;
  gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);
}
.frow > *{min-width:0;}
.frow:hover{background:var(--panel-2);}
.fhead{
  display:grid;grid-template-columns:34px minmax(0,1fr) 120px 92px 86px 108px;gap:12px;
  padding:0 8px 8px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);
}
.fhead .r{text-align:right;}
.taxa{
  font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums;
}
.taxa[data-lvl="bom"]{color:var(--ok);}
.taxa[data-lvl="neutro"]{color:var(--y);}
.taxa[data-lvl="ruim"]{color:var(--no);}
.fbar{height:6px;background:var(--panel-3);border-radius:99px;overflow:hidden;}
.fbar i{display:block;height:100%;border-radius:99px;background:var(--ok);}

/* ---------------- situacao dos links ---------------- */
.sit-vend{
  border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px;
  background:var(--panel-2);
}
.sit-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.sit-nome{font-size:13.5px;font-weight:600;}
.sit-uf{
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--y);
  background:var(--y-wash);border:1px solid var(--y-dim);border-radius:4px;
  padding:2px 7px;margin-right:8px;
}
.sit-lista{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:8px 0;border-top:1px solid var(--line);margin-top:10px;font-size:13px;
}
.sit-lista .quando{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.sit-vazio{color:var(--text-3);font-size:13px;margin-top:8px;}
.btn-perigo{border-color:var(--no);color:var(--no);}
.btn-perigo:hover:not(:disabled){background:var(--no-wash);border-color:var(--no);}

/* ---------------- historico por estado ---------------- */
.pick .rd{display:inline-flex;align-items:center;gap:8px;}
.hbars{
  display:flex;align-items:flex-end;gap:6px;height:132px;
  padding:12px 10px 0;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;overflow-x:auto;margin-bottom:16px;
}
.hbar{
  flex:1 0 34px;min-width:34px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;height:100%;gap:6px;
}
.hbar i{
  display:block;width:100%;border-radius:4px 4px 0 0;background:var(--y);
  min-height:3px;transition:background .14s;
}
.hbar[data-lvl="bom"] i{background:var(--ok);}
.hbar[data-lvl="ruim"] i{background:var(--no);}
.hbar b{
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.hbar span{
  font-family:var(--mono);font-size:9px;color:var(--text-3);white-space:nowrap;
}
.hbar:hover i{background:var(--y-hi);}
.trend{font-family:var(--mono);font-size:12px;font-weight:600;}
.trend[data-d="sobe"]{color:var(--ok);}
.trend[data-d="desce"]{color:var(--no);}
.trend[data-d="igual"]{color:var(--text-3);}

/* ---------------- insights ---------------- */
.insight{
  border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:8px;
  padding:16px 18px;margin-bottom:11px;background:var(--panel-2);
}
.insight[data-n="bom"]{border-left-color:var(--ok);}
.insight[data-n="ruim"]{border-left-color:var(--no);}
.insight[data-n="neutro"]{border-left-color:var(--y);}
.insight h4{margin:0 0 6px;font-family:var(--dp);font-size:1rem;font-weight:600;letter-spacing:-.005em;}
.insight p{margin:0 0 9px;color:var(--text-2);font-size:.93rem;}
.insight .acao{
  margin:0;color:var(--text);font-size:.92rem;padding-left:13px;border-left:2px solid var(--line-2);
}
.insight .acao b{color:var(--y);font-weight:600;font-size:10.5px;font-family:var(--mono);
  letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;}

/* ---------------- lista do vendedor no desktop ----------------
   E onde a equipe vai usar. O nome do integrador e longo e empurrava as
   colunas de Categoria e Valor para fora da tela: aqui ele encolhe com
   reticencias (o nome inteiro fica no title) e o resto cabe sem rolagem
   lateral. A altura maior mostra mais clientes de uma vez. */
.cartoes{max-height:min(72vh, 900px);}
.cartoes td:first-child{max-width:38ch;overflow:hidden;text-overflow:ellipsis;}
.cartoes td[data-rotulo="E-mail"]{max-width:26ch;overflow:hidden;text-overflow:ellipsis;}
.cartoes td[data-rotulo="Valor Faturado"],
.cartoes td[data-rotulo="Qtde. Pedidos"]{
  text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
}

/* ---------------- lista do vendedor no celular ----------------
   Tabela em tela pequena obriga a rolar para o lado e o vendedor perde de
   vista de quem e cada linha. Abaixo de 640px cada cliente vira um cartao,
   com o nome da coluna ao lado do valor. */
.tag-rep{
  display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.04em;padding:2px 7px;border-radius:99px;white-space:nowrap;
  background:var(--y-wash);border:1px solid var(--y-dim);color:var(--y);
  vertical-align:middle;margin-left:6px;
}
.cartoes a{color:var(--y);text-decoration:none;border-bottom:1px solid var(--y-dim);}
.cartoes a:hover{border-bottom-color:var(--y);}
@media (max-width:640px){
  .cartoes{max-height:none;border:0;background:none;overflow:visible;}
  .cartoes table,.cartoes tbody,.cartoes tr,.cartoes td{display:block;width:100%;}
  .cartoes thead{display:none;}
  .cartoes tr{
    border:1px solid var(--line);border-radius:9px;background:var(--panel);
    padding:12px 14px;margin-bottom:10px;
  }
  .cartoes td{
    border:0;padding:5px 0;white-space:normal;max-width:none;
    display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:baseline;
  }
  .cartoes td:empty{display:none;}
  .cartoes td::before{
    content:attr(data-rotulo);
    font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;
  }
  .cartoes td:first-child{
    display:block;font-weight:600;font-size:14px;color:var(--text);
    padding-bottom:9px;margin-bottom:5px;border-bottom:1px solid var(--line);
  }
  .cartoes td:first-child::before{display:none;}
}

/* ---------------- misc ---------------- */
.alert{
  border-left:3px solid var(--no);background:var(--no-wash);color:var(--text);
  padding:13px 16px;border-radius:0 7px 7px 0;margin-bottom:16px;font-size:.92rem;
}
.alert[data-t="info"]{border-left-color:var(--y);background:var(--y-wash);}
.empty{color:var(--text-3);text-align:center;padding:44px 20px;font-size:.93rem;}
.hint{color:var(--text-3);font-size:.85rem;margin:8px 0 0;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
  background:var(--y);color:#0A0A0B;font-weight:600;font-size:13.5px;
  padding:11px 20px;border-radius:99px;z-index:90;opacity:0;
  transition:transform .24s cubic-bezier(.2,.8,.3,1),opacity .24s;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}

@media (max-width:820px){
  .vrow,.vhead{grid-template-columns:32px minmax(0,1fr) auto;gap:10px;}
  .vrow .vbar,.vrow .vval,.vhead .h-bar,.vhead .h-val{display:none;}
  .vrow .btn-row{grid-column:1 / -1;}
  .frow,.fhead{grid-template-columns:32px minmax(0,1fr) 72px 62px;gap:10px;}
  .frow .fbar,.fhead .h-bar,.frow .vval,.fhead .h-val{display:none;}
  .funil-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .funil-grid .stat b{font-size:1.12rem;overflow-wrap:anywhere;}
  main{padding:24px 16px 80px;}
  .topbar-in,.steps-in{padding-left:16px;padding-right:16px;}
}

/* ================= roteiro de ligacao (pagina do vendedor) =================
   Duas colunas: as listas a esquerda, o roteiro numa coluna fixa a direita
   que acompanha a rolagem. Clicar num cliente da tabela faz o roteiro usar
   os dados dele. Tudo com prefixo rt- para nao encostar no app do gestor,
   que divide esta mesma folha de estilo. */
.rt-work{display:grid;gap:18px;align-items:start;grid-template-columns:minmax(0,1fr) 400px;}
.rt-listas{min-width:0;display:flex;flex-direction:column;gap:18px;}
.rt-lado{min-width:0;position:sticky;top:16px;max-height:calc(100vh - 40px);overflow:auto;}
.rt-painel{border-color:var(--y-wash);border-left:3px solid var(--y);}
.rt-conta-itens{font-family:var(--mono);font-size:11.5px;color:var(--text-3);}

/* a linha clicavel e a que esta escolhida.
   touch-action:manipulation desliga o zoom por toque duplo em cima da linha --
   sem isso, no celular o segundo toque vira zoom e o duplo clique nunca chega
   ao caderno de anotacoes. O zoom do resto da pagina continua livre. */
.rt-listas tbody tr{cursor:pointer;touch-action:manipulation;}
.rt-listas tbody tr[data-rtsel="1"]{background:var(--y-wash);box-shadow:inset 3px 0 0 var(--y);}

.rt-dica{font-size:12.6px;color:var(--text-3);margin:0 0 14px;}
.rt-escolhido{background:var(--panel-3);border-radius:8px;padding:11px 13px;margin-bottom:15px;}
.rt-quem{font-family:var(--dp);font-weight:600;font-size:13.5px;overflow-wrap:anywhere;}
.rt-dados{font-family:var(--mono);font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.75;}
.rt-dados b{color:var(--y);}

.rt-tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px;flex-wrap:wrap;}
.rt-tab{
  appearance:none;background:none;border:0;cursor:pointer;
  font-family:var(--dp);font-weight:600;font-size:13.5px;color:var(--text-3);
  padding:9px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.rt-tab:hover{color:var(--text-2);}
.rt-tab[aria-selected="true"]{color:var(--y);border-bottom-color:var(--y);}
.rt-tab:focus-visible{outline:2px solid var(--y);outline-offset:-2px;}

/* ---- caderno da equipe, na pagina do gestor ---- */
.cad-vend{border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:11px;}
.cad-vend-topo{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  flex-wrap:wrap;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
.cad-conta{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.cad-cli{margin-bottom:10px;}
.cad-cli:last-child{margin-bottom:0;}
.cad-cli-nome{font-size:12.5px;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere;}
.cad-fora{
  font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.04em;
  color:var(--text-3);border:1px solid var(--line-2);border-radius:99px;padding:1px 6px;
}
.cad-nota{
  font-size:12.5px;color:var(--text-2);line-height:1.55;padding:4px 0 4px 11px;
  border-left:2px solid var(--line-2);margin-bottom:3px;overflow-wrap:anywhere;
}
.cad-data{font-family:var(--mono);font-size:10.5px;color:var(--y);margin-right:8px;}
.cad-agenda{background:var(--panel-3);border-radius:7px;padding:9px 11px;margin-bottom:11px;}
.cad-agenda-rot{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px;
}
.cad-ag-linha{font-size:12.5px;line-height:1.6;overflow-wrap:anywhere;}
.cad-ag-hora{font-family:var(--mono);font-size:11px;color:var(--y);margin-right:9px;}
.cad-ag-obs{color:var(--text-3);}

/* ---- agenda do vendedor ---- */
.rt-ag-novo{display:grid;gap:8px;}
.rt-ag-rot{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-3);}
.rt-ag-quando,.rt-ag-obs{
  width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;
  color:var(--text-1);font-family:var(--ui);font-size:13.5px;padding:8px 10px;
}
.rt-ag-quando{font-family:var(--mono);}
.rt-ag-quando:focus,.rt-ag-obs:focus{outline:none;border-color:var(--y);}
.rt-ag-lista{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.rt-ag-item{background:var(--panel-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.rt-ag-topo{display:flex;justify-content:space-between;align-items:baseline;gap:9px;flex-wrap:wrap;}
.rt-ag-hora{font-family:var(--mono);font-size:11.5px;color:var(--y);}
.rt-ag-falta{font-family:var(--mono);font-size:10px;color:var(--text-3);}
.rt-ag-quem{font-family:var(--dp);font-weight:600;font-size:13px;margin-top:3px;overflow-wrap:anywhere;}
.rt-ag-obs-txt{font-size:12.5px;color:var(--text-2);margin-top:3px;overflow-wrap:anywhere;}

/* o caderno: os clientes em que ja se escreveu alguma coisa */
.rt-caderno{display:flex;flex-direction:column;gap:7px;}
.rt-caderno-item{
  appearance:none;text-align:left;cursor:pointer;width:100%;
  background:var(--panel-3);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;display:grid;gap:2px;color:inherit;font:inherit;
}
.rt-caderno-item:hover{border-color:var(--y);}
.rt-caderno-item:focus-visible{outline:2px solid var(--y);outline-offset:2px;}
.rt-cad-nome{font-family:var(--dp);font-weight:600;font-size:13px;overflow-wrap:anywhere;}
.rt-cad-quantas{font-family:var(--mono);font-size:10px;color:var(--y);letter-spacing:.04em;}
.rt-cad-ultima{font-size:12px;color:var(--text-3);overflow-wrap:anywhere;}

.rt-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin-bottom:15px;}
.rt-seg button{
  appearance:none;background:var(--panel-2);border:0;cursor:pointer;color:var(--text-3);
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;padding:7px 12px;
}
.rt-seg button + button{border-left:1px solid var(--line-2);}
.rt-seg button[aria-pressed="true"]{background:var(--y);color:#0A0A0B;}
.rt-seg button:focus-visible{outline:2px solid var(--y);outline-offset:-2px;}

.rt-busca{
  width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;
  color:var(--text);font-family:inherit;font-size:13.5px;padding:10px 13px;margin-bottom:14px;
}
.rt-busca::placeholder{color:var(--text-3);}
.rt-busca:focus{outline:2px solid var(--y);outline-offset:1px;border-color:var(--y);}

#rtCards{display:flex;flex-direction:column;gap:12px;}
.rt-card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:14px 15px;display:flex;flex-direction:column;gap:10px;
}
.rt-nome{font-family:var(--dp);font-weight:600;font-size:14px;}
.rt-fala{
  border-left:2px solid var(--y);background:var(--y-wash);
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:13.4px;line-height:1.62;
}
.rt-fala em{color:var(--y-hi);font-style:normal;font-weight:600;}
.rt-fill{border-bottom:1px dashed var(--text-3);color:var(--text-3);}
.rt-nota{color:var(--text-3);}
.rt-porque{font-size:12.4px;color:var(--text-2);margin:0;}

.rt-grupo{
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--text-3);
  margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
.rt-grupo:first-child{margin-top:0;}
.rt-obj{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);margin-bottom:7px;overflow:hidden;}
.rt-obj-topo{
  width:100%;appearance:none;background:none;border:0;cursor:pointer;text-align:left;
  color:inherit;display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:13.4px;
}
.rt-obj-topo:hover{background:var(--panel-3);}
.rt-obj-topo:focus-visible{outline:2px solid var(--y);outline-offset:-2px;}
.rt-n{
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--y);
  background:var(--y-wash);border-radius:5px;padding:2px 6px;flex:none;
}
.rt-obj-txt{flex:1;font-weight:500;}
.rt-seta{color:var(--text-3);flex:none;transition:transform .18s;font-size:11px;}
.rt-obj[data-aberto="1"] .rt-seta{transform:rotate(90deg);}
.rt-obj-corpo{display:none;padding:0 13px 14px;border-top:1px solid var(--line);}
.rt-obj[data-aberto="1"] .rt-obj-corpo{display:block;}
.rt-portras{font-size:12.4px;color:var(--text-2);margin:12px 0;padding-left:10px;border-left:2px solid var(--line-2);}
.rt-etapa{
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-3);margin:13px 0 6px;
}
.rt-cuidado{
  border-left:3px solid var(--no);background:var(--no-wash);
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:12.4px;margin-top:12px;
}
.rt-cuidado b{color:var(--no);}
.rt-contawrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:7px;}
.rt-contawrap table{min-width:300px;}
.rt-gap{
  font-family:var(--mono);font-size:12px;background:var(--panel-3);
  border-radius:7px;padding:11px 13px;margin:12px 0;line-height:1.85;
}
.rt-gap .rt-bom{color:var(--y);font-weight:600;}
.rt-gap .rt-ruim{color:var(--no);font-weight:600;}

/* barra de rolagem visivel: a lista tem altura propria e precisa mostrar
   que ha mais coisa abaixo */
.rt-listas .tablewrap{max-height:420px;}
.rt-lado::-webkit-scrollbar,.rt-listas .tablewrap::-webkit-scrollbar{width:11px;height:11px;}
.rt-lado::-webkit-scrollbar-track,.rt-listas .tablewrap::-webkit-scrollbar-track{background:var(--panel-2);border-radius:99px;}
.rt-lado::-webkit-scrollbar-thumb,.rt-listas .tablewrap::-webkit-scrollbar-thumb{
  background:var(--line-2);border-radius:99px;border:2px solid var(--panel-2);
}
.rt-lado,.rt-listas .tablewrap{scrollbar-color:var(--line-2) var(--panel-2);scrollbar-width:thin;}

/* ---- caixinha "ja falei" na lista ---- */
th.col-falei,td.col-falei{width:42px;text-align:center;padding-left:6px;padding-right:6px;}
.falei-box{
  appearance:none;width:17px;height:17px;border:1.5px solid var(--line-2);border-radius:5px;
  background:var(--panel-2);cursor:pointer;vertical-align:middle;position:relative;flex:none;
}
.falei-box:hover:not(:disabled){border-color:var(--y);}
.falei-box:focus-visible{outline:2px solid var(--y);outline-offset:2px;}
.falei-box:disabled{opacity:.5;cursor:wait;}
.falei-box:checked{background:var(--ok);border-color:var(--ok);}
.falei-box:checked::after{
  content:'';position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #0A0A0B;border-width:0 2px 2px 0;transform:rotate(45deg);
}
tr[data-falei="1"] td:not(.col-falei){color:var(--text-3);}
.tag-nota{
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.05em;
  border:1px solid var(--y);color:var(--y);border-radius:99px;padding:1px 6px;white-space:nowrap;
  cursor:pointer;touch-action:manipulation;
}
.tag-nota:hover{background:var(--y-wash);}

/* ---- aba de anotacoes ---- */
.rt-pip{
  display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:99px;
  background:var(--y);color:#0A0A0B;font-family:var(--mono);font-size:9.5px;line-height:16px;
  text-align:center;
}
.rt-notas{width:100%;border-collapse:collapse;font-size:13px;}
.rt-notas th{
  background:none;border-bottom:1px solid var(--line);padding:6px 8px;position:static;
}
.rt-notas td{border-bottom:1px solid var(--line);padding:0;white-space:normal;vertical-align:top;}
.rt-notas td.dt{width:96px;}
.rt-nota-data{
  width:100%;background:none;border:0;color:var(--y);font-family:var(--mono);
  font-size:11.5px;padding:9px 6px;
}
.rt-nota-txt{
  width:100%;background:none;border:0;color:var(--text);font-family:inherit;font-size:13px;
  padding:9px 6px;resize:vertical;min-height:38px;line-height:1.5;
}
.rt-nota-data:focus,.rt-nota-txt:focus{outline:2px solid var(--y);outline-offset:-2px;border-radius:5px;}
.rt-nota-txt::placeholder{color:var(--text-3);}
.rt-nota-txt:disabled,.rt-nota-data:disabled{opacity:.5;}
.rt-notas tr[data-rtnova="1"] td{background:var(--panel-2);}
.rt-apagar{
  appearance:none;background:none;border:0;cursor:pointer;color:var(--text-3);
  font-size:13px;padding:9px 6px;line-height:1;
}
.rt-apagar:hover{color:var(--no);}
.rt-apagar:focus-visible{outline:2px solid var(--no);outline-offset:-2px;border-radius:5px;}
.rt-notas-vazio{color:var(--text-3);font-size:12.8px;padding:12px 2px;margin:0;}
.rt-salvo{font-family:var(--mono);font-size:11px;color:var(--ok);}
.rt-salvo-linha{font-family:var(--mono);font-size:10px;color:var(--ok);display:block;padding:0 6px 6px;}
.rt-privado{
  border-left:3px solid var(--ok);background:var(--ok-wash);padding:11px 14px;
  border-radius:0 7px 7px 0;font-size:12.6px;margin-top:16px;
}
.rt-privado b{color:var(--ok);}

/* ---- pergunta a IA ---- */
.rt-ia{
  margin-top:18px;border:1px solid var(--line);border-left:3px solid var(--ia);
  background:var(--ia-wash);border-radius:0 8px 8px 0;padding:15px 16px;
}
.rt-ia[data-destaque="1"]{border-color:var(--ia);box-shadow:0 0 0 1px var(--ia) inset;}
.rt-ia-topo{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.rt-ia-nome{font-family:var(--dp);font-weight:600;font-size:14px;}
.rt-ia-selo{
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ia);border:1px solid var(--ia);border-radius:99px;padding:2px 7px;
}
.rt-ia-dica{font-size:12.4px;color:var(--text-2);margin:0 0 11px;}
.rt-ia-txt{
  width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;
  color:var(--text);font-family:inherit;font-size:13.4px;padding:10px 12px;resize:vertical;
}
.rt-ia-txt:focus{outline:2px solid var(--ia);outline-offset:1px;border-color:var(--ia);}
.rt-ia-txt::placeholder{color:var(--text-3);}
.rt-btn-ia{background:var(--ia);color:#08101F;border-color:var(--ia);font-weight:600;}
.rt-btn-ia:hover:not(:disabled){background:#9CC5FF;}
.rt-ia-conta{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.rt-ia-conta[data-baixo="1"]{color:var(--no);}
.rt-ia-resposta{margin-top:15px;border-top:1px solid var(--line);padding-top:14px;}
.rt-rodape-ia{font-size:11.5px;color:var(--text-3);margin-top:13px;line-height:1.6;}
.rt-pensando{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:13px;margin-top:14px;}
.rt-ponto{width:7px;height:7px;border-radius:50%;background:var(--ia);animation:rtPulsa 1.1s infinite;}
.rt-ponto:nth-child(2){animation-delay:.18s;}
.rt-ponto:nth-child(3){animation-delay:.36s;}
@keyframes rtPulsa{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion:reduce){.rt-ponto{animation:none;opacity:.7;}}

/* lado a lado nao cabe em tela estreita: o roteiro vai para cima da lista,
   ja com o cliente escolhido em destaque */
@media (max-width:1080px){
  .rt-work{grid-template-columns:minmax(0,1fr);}
  .rt-lado{position:static;max-height:none;order:-1;}
}

<script>
/* ==================================================================
   Leitura e escrita de valor -- fonte unica das duas paginas.

   Este arquivo entra tanto no app do gestor quanto na pagina do
   vendedor. A razao de existir e um erro real: havia duas leituras de
   numero diferentes no projeto, e a do roteiro apagava TODOS os pontos
   de "958627.0100000000". O ponto decimal sumia junto com os
   separadores de milhar, o resultado passava de 2^53 e a tela mostrava
   R$ 9.586.270.100.000.000 no lugar de R$ 958.627.

   Regra da casa: nenhum outro arquivo le nem formata numero por conta
   propria. Se faltar alguma conversao, ela nasce aqui.
   ================================================================== */

/* Numero vindo da planilha, em qualquer um dos formatos que o BI produz:
   numero puro (14776416.8864), texto com ponto decimal ("958627.01"),
   texto brasileiro ("958.627,01") ou ja formatado ("R$ 1.234,56").

   O ponto so e separador de milhar quando ha uma virgula na mesma string.
   Devolve NaN quando nao ha numero -- quem chama decide o que fazer. */
function paraNumero(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  var s = String(v === null || v === undefined ? '' : v).replace(/[R$\s ]/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') > -1 && s.indexOf('.') > -1) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.indexOf(',') > -1) s = s.replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

/* Dinheiro para a TELA, sem centavos: numa carteira que passa do milhao,
   centavo e ruido. Devolve null quando nao ha valor, para quem chama poder
   omitir a linha em vez de mostrar R$ 0. */
function moeda(v) {
  var n = paraNumero(v);
  if (isNaN(n) || n <= 0) return null;
  return n.toLocaleString('pt-BR', {
    style: 'currency', currency: 'BRL', maximumFractionDigits: 0
  });
}

/* Contagem para a TELA: "1.040", nao "1040.0". */
function inteiro(v) {
  var n = paraNumero(v);
  if (isNaN(n) || n <= 0) return null;
  return Math.round(n).toLocaleString('pt-BR');
}

/* Colunas de dinheiro sao reconhecidas pelo nome, porque o rotulo muda de
   uma exportacao para outra. */
var RE_DINHEIRO = /valor|faturad|pre[cç]o|receita|ticket/i;

/* Um valor como ele deve sair no ARQUIVO. Diferente da tela:
   - dinheiro sai com virgula decimal e duas casas ("14776416,89"), que e o
     que o Excel em portugues le como numero, e e o mesmo valor da base sem
     o ruido de ponto flutuante;
   - inteiro sai inteiro, sem ".0" pendurado;
   - texto sai exatamente como veio. Nada e reescrito. */
function valorExport(coluna, valor) {
  if (valor === null || valor === undefined) return '';
  if (typeof valor === 'number') {
    if (!isFinite(valor)) return '';
    if (RE_DINHEIRO.test(coluna)) return valor.toFixed(2).replace('.', ',');
    if (valor === Math.round(valor)) return String(valor);
    return String(valor).replace('.', ',');
  }
  return String(valor);
}

function aspasCsv(v) {
  return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
}

/* CSV com ponto e virgula e BOM: e assim que o Excel em portugues abre sem
   perguntar nada e sem trocar os acentos. */
function toCSV(linhas, colunas) {
  var saida = [colunas.map(aspasCsv).join(';')];
  linhas.forEach(function (r) {
    saida.push(colunas.map(function (c) {
      return aspasCsv(valorExport(c, r[c]));
    }).join(';'));
  });
  return '﻿' + saida.join('\r\n');
}

/* TSV para colar direto numa planilha ja aberta. Tab e quebra de linha
   dentro do valor viram espaco, senao a colagem sai desalinhada. */
function toTSV(linhas, colunas) {
  var saida = [colunas.join('\t')];
  linhas.forEach(function (r) {
    saida.push(colunas.map(function (c) {
      return valorExport(c, r[c]).replace(/[\t\r\n]+/g, ' ');
    }).join('\t'));
  });
  return saida.join('\n');
}

/* Nome de arquivo que passa em Windows, Mac e Linux. */
function safeName(s) {
  var limpo = String(s === null || s === undefined ? '' : s)
    .replace(/[\\/:*?"<>|]+/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 80);
  return limpo || 'sem-nome';
}

function download(blob, nome) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

/* ---------- zip ----------
   Sem compressao (metodo "store"). Basta para juntar CSVs e evita depender
   de biblioteca externa: o app precisa continuar abrindo offline, num
   arquivo so. */
function crc32(bytes) {
  var tabela = crc32.tabela;
  if (!tabela) {
    tabela = crc32.tabela = new Int32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      tabela[n] = c;
    }
  }
  var crc = -1;
  for (var i = 0; i < bytes.length; i++) {
    crc = (crc >>> 8) ^ tabela[(crc ^ bytes[i]) & 0xFF];
  }
  return (crc ^ -1) >>> 0;
}

function buildZip(entries) {
  var enc = new TextEncoder();
  var partes = [], central = [], deslocamento = 0;

  entries.forEach(function (e) {
    var nome = enc.encode(e.name);
    var dados = enc.encode(e.content);
    var crc = crc32(dados);

    var local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);       // versao necessaria
    local.setUint16(6, 0x0800, true);   // nome em UTF-8
    local.setUint16(8, 0, true);        // metodo: store
    local.setUint16(10, 0, true);       // hora
    local.setUint16(12, 0, true);       // data
    local.setUint32(14, crc, true);
    local.setUint32(18, dados.length, true);
    local.setUint32(22, dados.length, true);
    local.setUint16(26, nome.length, true);
    local.setUint16(28, 0, true);       // sem campo extra
    partes.push(new Uint8Array(local.buffer), nome, dados);

    var cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);          // versao de quem criou
    cd.setUint16(6, 20, true);          // versao necessaria
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, 0, true);
    cd.setUint16(14, 0, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, dados.length, true);
    cd.setUint32(24, dados.length, true);
    cd.setUint16(28, nome.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, deslocamento, true);
    central.push(new Uint8Array(cd.buffer), nome);

    deslocamento += 30 + nome.length + dados.length;
  });

  var tamCentral = central.reduce(function (a, p) { return a + p.length; }, 0);
  var fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true);
  fim.setUint16(4, 0, true);
  fim.setUint16(6, 0, true);
  fim.setUint16(8, entries.length, true);
  fim.setUint16(10, entries.length, true);
  fim.setUint32(12, tamCentral, true);
  fim.setUint32(16, deslocamento, true);
  fim.setUint16(20, 0, true);

  return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]),
                  { type: 'application/zip' });
}

          f: ['Mando agora. Só me responde uma coisa antes, pra eu mandar a coisa certa: <em>você está com obra em andamento ou cotando pra fechar?</em> Se for cotação eu mando preço, se for obra andando eu mando prazo. Mandando os dois você não lê nenhum. <em>Qual dos dois?</em>'] }
  };

  var CONTA =
    '<div class="rt-etapa">A conta que ele faz junto com o cliente</div>' +
    '<div class="rt-contawrap"><table>' +
    '<thead><tr><th>Projeto 10 kWp</th><th class="num">Concorrente</th><th class="num">BelEnergy</th></tr></thead>' +
    '<tbody>' +
    '<tr><td>Kit</td><td class="num">R$ 22.000</td><td class="num">R$ 21.500</td></tr>' +
    '<tr><td>Frete</td><td class="num">R$ 600</td><td class="num">R$ 1.900</td></tr>' +
    '<tr><td><b>Custo do kit</b></td><td class="num"><b>R$ 22.600</b></td><td class="num"><b>R$ 23.400</b></td></tr>' +
    '</tbody></table></div>' +

    'R$ 1.500. Mesmo tirando os R$ 800 da mão de obra, ele continua R$ 700 mais caro — e com menos ' +
    'margem para executar. Os valores são um exemplo: use os números da obra dele.</p>';

  /* ---------- preencher as marcas ---------- */

  var VAZIO = {
    '{CLIENTE}': 'o cliente',
    '{CIDADE}': 'a cidade',
    '{ULTIMA}': 'a data da última compra',
    '{DIAS}': 'o tempo parado',
    '{PEDIDOS}': 'tantos',
    '{VALOR}': 'o valor'
  };

  function preencher(txt) {
    return String(txt).replace(/\{(CLIENTE|CIDADE|ULTIMA|DIAS|PEDIDOS|VALOR)\}/g, function (marca) {
      if (atual && atual[marca]) return rtEsc(atual[marca]);
      return '<span class="rt-fill">' + VAZIO[marca] + '</span>';
    });
  }

  /* ---------- ler o cliente da linha da tabela ---------- */

  function acharCol(colunas, re) {
    for (var i = 0; i < colunas.length; i++) if (re.test(colunas[i])) return colunas[i];
    return null;
  }

  /* "CLI-0000000123 - SOLAR NORTE LTDA" -> "SOLAR NORTE LTDA" */
  function nomeCurto(v) {
    var s = String(v == null ? '' : v).trim();
    var m = s.match(/^CLI[-\s]?\d+\s*[-–]\s*(.+)$/i);
    return (m ? m[1] : s).trim();
  }

  /* Datas chegam como "dd/mm/aaaa" -- e o formato que o leitor de xlsx
     produz. Qualquer outra coisa devolve null em vez de um numero errado. */
  function diasDesde(txt) {
    var m = String(txt == null ? '' : txt).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    var d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    if (isNaN(d.getTime())) return null;
    var dias = Math.floor((Date.now() - d.getTime()) / 86400000);
    return dias >= 0 && dias < 36500 ? dias : null;
  }

  function textoDias(n) {
    if (n === null) return null;
    if (n < 45) return n + ' dias';
    var meses = Math.round(n / 30);
    return meses + (meses === 1 ? ' mês' : ' meses');
  }

  function daLinha(linha, colunas, modo) {
    var cNome = acharCol(colunas, /integrador/i);
    var cCidade = acharCol(colunas, /^cidade$/i);
    var cUltima = acharCol(colunas, /última nota|ultima nota/i);
    var cPedidos = acharCol(colunas, /pedido/i);
    var cValor = acharCol(colunas, /valor|faturad/i);

    // moeda() e inteiro() vivem em carteira.js e sao a unica leitura de
    // numero desta pagina. Ler aqui por conta propria foi o que produziu
    // R$ 9.586.270.100.000.000 no lugar de R$ 958.627.
    var dias = cUltima ? diasDesde(linha[cUltima]) : null;

    return {
      rotulo: cNome ? nomeCurto(linha[cNome]) : '',
      // Mesma chave que carteira.js usa para guardar as anotacoes: o codigo
      // CLI quando existe. Se as duas divergirem, o caderno do cliente some.
      cliente: chaveCliente(linha, colunas),
      modo: modo,
      '{CLIENTE}': cNome ? nomeCurto(linha[cNome]) : '',
      '{CIDADE}': cCidade ? String(linha[cCidade] || '').trim() : '',
      '{ULTIMA}': cUltima ? String(linha[cUltima] || '').trim() : '',
      '{DIAS}': textoDias(dias),
      '{PEDIDOS}': cPedidos ? inteiro(linha[cPedidos]) : null,
      '{VALOR}': cValor ? moeda(linha[cValor]) : null
    };
  }

  /* ---------- desenhar ---------- */

  function html() {

        '<div class="panel-head">' +

  function el(t, cls, inner) {
    var e = document.createElement(t);
    if (cls) e.className = cls;
    if (inner != null) e.innerHTML = inner;
    return e;
  }

  function copiar(txt, botao) {
    var limpo = String(txt).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
    var antes = botao.textContent;
    function pronto() {
      botao.textContent = 'Copiado';
      setTimeout(function () { botao.textContent = antes; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(limpo).then(pronto, pronto);
    } else {
      pronto();
    }
  }

  function desenharEscolhido() {
    var alvo = document.getElementById('rtEscolhido');
    if (!alvo) return;
    if (!atual) {
      alvo.innerHTML = '<p class="rt-dica">Clique num cliente da lista para o roteiro ' +
        'usar os dados dele — data da última compra, cidade e histórico entram na fala.</p>';
      return;
    }
    var partes = [];
    if (atual['{CIDADE}']) partes.push(rtEsc(atual['{CIDADE}']));
    if (atual['{ULTIMA}']) {
      partes.push('última compra <b>' + rtEsc(atual['{ULTIMA}']) + '</b>' +
        (atual['{DIAS}'] ? ' · parado há <b>' + rtEsc(atual['{DIAS}']) + '</b>' : ''));
    }
    if (atual['{PEDIDOS}']) partes.push('<b>' + rtEsc(atual['{PEDIDOS}']) + '</b> pedidos');
    if (atual['{VALOR}']) partes.push('<b>' + rtEsc(atual['{VALOR}']) + '</b>');

    alvo.innerHTML = '<div class="rt-escolhido">' +
      '<div class="rt-quem">' + rtEsc(atual.rotulo) + '</div>' +
      (partes.length ? '<div class="rt-dados">' + partes.join('<br>') + '</div>' : '') +
      '</div>';
  }

  function desenharCards() {
    var alvo = document.getElementById('rtCards');
    if (!alvo) return;
    alvo.innerHTML = '';
    ABERTURAS[tipo].forEach(function (a) {
      var texto = preencher(a.fala());
      var card = el('div', 'rt-card');
      card.appendChild(el('div', 'rt-nome', rtEsc(a.nome)));
      card.appendChild(el('div', 'rt-fala', texto));
      card.appendChild(el('p', 'rt-porque', rtEsc(a.porque)));
      var linha = el('div', 'btn-row');
      var b = el('button', 'btn btn-sm btn-ghost', 'Copiar');
      b.addEventListener('click', function () { copiar(texto, b); });
      linha.appendChild(b);
      card.appendChild(linha);
      alvo.appendChild(card);
    });
  }

  function desenharObjs(filtro) {
    var alvo = document.getElementById('rtObjs');
    if (!alvo) return;
    alvo.innerHTML = '';
    var f = String(filtro || '').trim().toLowerCase();
    var achou = 0;

    GRUPOS.forEach(function (g) {
      var itens = g.itens.filter(function (n) {
        if (!f) return true;
        var o = OBJ[n];
        var tudo = n + ' ' + o.t + ' ' + o.p + ' ' + o.f.join(' ') + ' ' + (o.f2 || []).join(' ');
        return tudo.toLowerCase().indexOf(f) > -1;
      });
      if (!itens.length) return;
      achou += itens.length;
      alvo.appendChild(el('div', 'rt-grupo', rtEsc(g.titulo)));

      itens.forEach(function (n) {
        var o = OBJ[n];
        var caixa = el('div', 'rt-obj');

        topo.appendChild(el('span', 'rt-seta', '&#9654;'));
        topo.addEventListener('click', function () {
          var aberto = caixa.getAttribute('data-aberto') === '1';
          caixa.setAttribute('data-aberto', aberto ? '0' : '1');
          topo.setAttribute('aria-expanded', aberto ? 'false' : 'true');
        });

        corpo.appendChild(el('p', 'rt-portras', '<b>Por trás disso:</b> ' + rtEsc(o.p)));
        corpo.appendChild(el('div', 'rt-etapa', 'O que dizer'));
        o.f.forEach(function (t) { corpo.appendChild(el('div', 'rt-fala', preencher(t))); });
        if (o.conta) corpo.appendChild(el('div', null, CONTA));
        if (o.f2) {
          corpo.appendChild(el('div', 'rt-etapa', 'Se ele insistir'));
          o.f2.forEach(function (t) { corpo.appendChild(el('div', 'rt-fala', preencher(t))); });
        }
        if (o.q) corpo.appendChild(el('p', 'rt-porque', '<b>Por que funciona:</b> ' + rtEsc(o.q)));
        if (o.c) corpo.appendChild(el('div', 'rt-cuidado', '<b>Cuidado:</b> ' + rtEsc(o.c)));

        var linha = el('div', 'btn-row');
        linha.style.marginTop = '12px';
        var b = el('button', 'btn btn-sm btn-ghost', 'Copiar resposta');
        b.addEventListener('click', function () { copiar(preencher(o.f.join('\n\n')), b); });
        linha.appendChild(b);
        corpo.appendChild(linha);

        caixa.appendChild(topo);
        caixa.appendChild(corpo);
        alvo.appendChild(caixa);
      });
    });

    var vazio = document.getElementById('rtSemResultado');
    if (vazio) vazio.hidden = achou > 0;
